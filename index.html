<body>
<div id="stage"></div>
<div id="grid"></div>
<div id="shell">
  <header id="hud" hidden></header>
  <main id="app"></main>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<!-- the shared engine (v4 step 1): the rules with no screen in them -->
<script src="engine/core.js?v=3.26"></script>
<script>
/* ==========================================================================
   QUIZ ME BABY
   Single-file app. No build, no server, no internet required (except the
   Google Fonts link, which degrades gracefully, and .xlsx import).
   ========================================================================== */
'use strict';

/* ---------- tiny helpers ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const uid = () => Math.random().toString(36).slice(2, 10);
/* The bank stores type and difficulty lower-case because that is what the
   matching logic compares against. Nothing the host READS should be
   lower-case, so every label goes through here on the way to the screen. */
const Cap = (s) => { s = String(s ?? ''); return s ? s[0].toUpperCase() + s.slice(1) : s; };
const nf = (n) => Number(n).toLocaleString('en-US');
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hash(str){ let h = 5381; for(let i=0;i<str.length;i++) h = ((h<<5)+h+str.charCodeAt(i))|0; return 'q'+(h>>>0).toString(36); }

/* ==========================================================================
   0. BUILD STAMP
   ==========================================================================
   The footer on the home screen reads from here and nowhere else, so the
   version and the date can never end up disagreeing with each other. There is
   no build step in a single HTML file — nothing updates this on its own, so
   BUMP BOTH FIELDS whenever you change the app. A date that has quietly gone
   stale is worse than no date at all.

   Deriving it from document.lastModified was the obvious alternative and is a
   trap: copying the file to another laptop resets the timestamp, so a build
   from months ago would announce itself as updated today.
   ========================================================================== */
const BUILD = { v:'3.28', date:'23 Oct 2026', author:'Thierry Boulos', year:2026 };

/* ==========================================================================
   0b. SELF-UPDATE
   A home-screen web clip caches this file hard, and the people who already
   saved it can't be asked to re-add it. So the app checks its own version
   on every launch and resume.

   version.json is the single source of truth. It is fetched with no-store
   AND a cache-busting query — no-store only bypasses Safari's cache, the
   ?t= is what stops GitHub's CDN handing back a stale copy of the check
   itself. If it disagrees with the build baked into this copy, we bounce to
   a URL the cache has never seen (?v=<new>), which is guaranteed to miss
   every cache between here and the origin.

   Two safeguards:
   - it never fires off the home screen, so it cannot interrupt a live game
     (state isn't restored across reloads — S.screen is always 'home' on boot)
   - a sessionStorage guard means a failed bounce is tried once, not forever,
     so a half-deployed build can't put the app in a reload loop.

   To ship an update: bump BUILD.v here AND version.json to the same string.
   ========================================================================== */
(function(){
  var GUARD = 'qmb.updating.v1';
  function check(){
    fetch('version.json?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if(!j || !j.v) return;
        if(j.v === BUILD.v){ try{ sessionStorage.removeItem(GUARD); }catch(e){} return; }
        if(typeof S !== 'undefined' && S.screen !== 'home') return;
        try{
          if(sessionStorage.getItem(GUARD) === j.v) return;
          sessionStorage.setItem(GUARD, j.v);
        }catch(e){}
        location.replace(location.pathname + '?v=' + encodeURIComponent(j.v));
      })
      .catch(function(){});
  }
  if(document.readyState === 'complete') check(); else window.addEventListener('load', check);
  /* A saved web clip gets resumed far more often than it gets cold-launched,
     and a resume does not re-run page load. */
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) check(); });
})();

/* ==========================================================================
   1. SEED QUESTION BANK
   type: 'standard' | 'closest'
   use_with: pairing key — two standard questions with the same key in the same
             theme are asked as a matched pair (one to each team) so neither
             team gets an unfairly different KIND of question.
   ========================================================================== */
const THEMES = ['Acronyms','Art & Books','Disney & Pixar','Food & Drink','Friends','Geek & Gamer','Geography','History','Internet & Memes','Know the Host','Lebanon','Movies','Music','Nature','Pop Culture','Rave Culture','Science','Sexy Time','Sports','Tech','TV Series','90s Kids'];
const DIFFS  = ['easy','medium','hard','expert'];
/* a night's difficulty in words: the default mix is Easy, Medium and Hard (Expert only once those run
   out), Mixed is all four, or one level on its own */
const DLabel = (d) => d === QMB.DEFAULT_DIFF ? 'Easy to Hard' : d === 'mixed' ? 'Mixed' : Cap(d);

/* --------------------------------------------------------------------------
   CUSTOM THEMES
   The twenty-two above are the house set. The host may add up to four of their
   own — "Work", "The Cousins", whatever the room is — and they are DERIVED
   FROM THE BANK rather than stored in a list of their own: a custom theme
   exists exactly as long as a question is filed under it, and the last
   question leaving takes the theme with it. That is what "only if someone
   creates them" means, and it needs no separate bookkeeping to go stale.

   THEMES itself is mutated on boot to include them, so every picker, filter
   and chip wall in the app sees them without knowing they are special. That
   also fixes a quieter bug: a theme arriving via CSV import was pushed into
   THEMES at import time and then forgotten on the next reload, so imported
   questions became unreachable from the setup screen.
   -------------------------------------------------------------------------- */
const BUILT_IN_THEMES   = THEMES.slice();
const MAX_CUSTOM_THEMES = 4;
function customThemes(){
  const seen = {}, out = [];
  S.bank.forEach(q => {
    const t = (q.theme || '').trim();
    if(!t || BUILT_IN_THEMES.indexOf(t) > -1 || seen[t]) return;
    seen[t] = 1; out.push(t);
  });
  return out.sort();
}
/* Make THEMES match the bank exactly, both directions: adopt anything new the
   bank has, and drop any custom theme whose last question has been deleted —
   otherwise a freed slot leaves a ghost chip on the setup screen until reload.
   The house twenty-two are never removed, empty or not. */
function reconcileThemes(){
  const live = customThemes();
  live.forEach(t => { if(THEMES.indexOf(t) < 0) THEMES.push(t); });
  for(let i = THEMES.length - 1; i >= 0; i--){
    const t = THEMES[i];
    if(BUILT_IN_THEMES.indexOf(t) < 0 && live.indexOf(t) < 0) THEMES.splice(i, 1);
  }
}

const SEED = [
/* ---- ACRONYMS ---- */
['Acronyms','medium','common-acronym','What does "ATM" stand for?','Automated Teller Machine',''],
['Acronyms','medium','common-acronym','What does "PIN" stand for?','Personal Identification Number','Which makes "PIN number" redundant.'],
['Acronyms','medium','org-acronym','What does "NASA" stand for?','National Aeronautics and Space Administration',''],
['Acronyms','medium','org-acronym','What does "NATO" stand for?','North Atlantic Treaty Organization',''],
['Acronyms','expert','surprising-acronym','What does "SCUBA" stand for?','Self-Contained Underwater Breathing Apparatus',''],
['Acronyms','expert','surprising-acronym','What does "LASER" stand for?','Light Amplification by Stimulated Emission of Radiation',''],
['Acronyms','hard','org-acronym-2','What does "UNESCO" stand for?','United Nations Educational, Scientific and Cultural Organization',''],
['Acronyms','hard','org-acronym-2','What does "OPEC" stand for?','Organization of the Petroleum Exporting Countries',''],
['Acronyms','hard','tech-acronym-3','What does "PDF" stand for?','Portable Document Format',''],
['Acronyms','hard','tech-acronym-3','What does "GIF" stand for?','Graphics Interchange Format','The creator says it is pronounced "jif". Nobody listens.'],
['Acronyms','hard','acronym','What does the "HTTP" at the start of a web address stand for?','HyperText Transfer Protocol','Accept "HyperText Transfer".'],
['Acronyms','hard','acronym','What does "GPU" stand for?','Graphics Processing Unit',''],
['Acronyms','hard','tech-acronym-2','What does "USB" stand for?','Universal Serial Bus',''],
['Acronyms','hard','medical-acronym','What does "MRI" stand for?','Magnetic Resonance Imaging',''],
['Acronyms','hard','medical-acronym','What does "DNA" stand for?','Deoxyribonucleic Acid',''],
['Acronyms','easy','','What does "CEO" stand for?','Chief Executive Officer',''],
['Acronyms','medium','business-acronym','What does "IPO" stand for?','Initial Public Offering',''],
['Acronyms','easy','texting-acronym','What does "LOL" stand for?','Laughing Out Loud',''],
['Acronyms','easy','texting-acronym','What does "FOMO" stand for?','Fear Of Missing Out',''],
['Acronyms','medium','car-acronym','What does "BMW" stand for in English?','Bavarian Motor Works','Bayerische Motoren Werke.'],
['Acronyms','medium','car-acronym','What does "SUV" stand for?','Sport Utility Vehicle',''],

/* ---- DON'T SAY THE SAME AS ME --------------------------------------------
   [prompt, [candidate answer, candidate answer, ...]]
   No theme, no difficulty, no pairing ticker — same reasoning as the auction:
   a prompt like "Name a cheese" is not easy or hard, it is just wide or
   narrow, and that width IS the difficulty here.

   The list does three jobs at once:
   - It is the set of REAL answers. A captain's answer has to be on it (typos
     allowed), or it counts as saying it. So it must be complete: a closed set
     (planets, the countries of Africa, Bond actors) lists every member, and an
     open one (a fruit, a cheese) lists everything people would actually say.
     Obscure but correct answers stay, at the end; wrong ones never go on.
   - It is ORDERED, most commonly given answer first. The secret word is only
     ever one of the top six, the way the person next to you would answer,
     each as likely as the next (all of a list of six or fewer). So put
     Connery before Lazenby, Apple before Quince.
   - Its LENGTH is the prompt's real-world scope: 2 for a true binary like
     Heads or Tails, dozens for something wide open like fast food chains.
     That number orders a night's nine prompts from vast (safe, many ways to
     dodge) down to tight: only the last two are small, one of three or four
     answers, then a coin flip — see saySameDeck().
   Other ways of writing a word (Connery for Sean Connery, Yellow for Amber)
   live with Party's also-accepted answers (party/public/accept.json byAnswer),
   keyed by the word itself.
   -------------------------------------------------------------------------- */

/* --------------------------------------------------------------------------
   GUESS THE MAP — the built-in maps
   Every one is drawn by the app itself from real borders (maps-geo.js: Natural
   Earth 1:10m countries, US Census states), so all twenty share one look —
   same sea, same land, same palette, same legend — and every border, coast and
   city dot sits where it really is. Nothing is a traced or approximated image.

   A map is pure data:
     view   which base map — world · europe · northatl · namerica · us

/* A graded map lists each place's number once (`vals`) and its colour bands
   from the best down (`bands`); the shaded groups are worked out
   here, so a corrected figure can never leave a country in the wrong band. */
SEED_MAPS.forEach(function(m){
  if(!m.vals || !m.bands) return;
  /* `min` when bigger is better, `max` when it is a ranking (1st is best) */
  m.cls = m.bands.map(function(b, i){
    const prev = i ? m.bands[i - 1] : null;
    const inBand = b.max != null
      ? v => v <= b.max && v > (prev ? prev.max : -Infinity)
      : v => v >= b.min && v < (prev ? prev.min : Infinity);
    return { c:b.c, hint:b.hint, label:b.label,
      codes:Object.keys(m.vals).filter(k => inBand(m.vals[k])).join(' ') };
  });
});

   first), and the deck takes one from every level in turn — shuffled within
   each turn, so the easy one is not always first. Ten flags over two levels
   is five and five; over three, 4-3-3. */

/* Hand-picks first, in the order ticked; the chosen levels fill the rest. */

/* Ask for the dealt flags now, so they are in the browser's cache long before
   the mini-game comes round — and only those, never the whole set. */
function preloadFlags(list){ (list || []).forEach(q => { const i = new Image(); i.src = flagSrc(q); }); }
function flagImg(q){
  return '<img class="map-img flag-img" src="' + flagSrc(q) + '" alt="A flag" draggable="false" ' +
    'onerror="this.outerHTML=\'<div class=&quot;map-wait&quot;>Could not load the flag — check the connection.</div>\'">';
}

/* "45 ml (1½ oz) — White rum" -> ['45 ml (1½ oz)', 'White rum'] */
function splitIng(t){
  const i = String(t).indexOf(' — ');
  return i < 0 ? ['', String(t)] : [t.slice(0, i), t.slice(i + 3)];
}

/* party: true adds the rows only Party plays (Drop the Pin, Guess the Airport, Majority Rules); Classic's own bank
   leaves them out, so its question list never shows games it can't run (scripts/export-bank.js asks for them) */
function buildSeedBank(party){
  const out = [];
  SEED.forEach(function(r){ out.push({
    id:hash(r[3]), question:r[3], answer:r[4], notes:r[5]||'', theme:r[0],
    type:'standard', difficulty:r[1], use_with:r[2], src:'seed'
  }); });
  SEED_CLOSEST.forEach(function(r){ out.push({
    id:hash(r[2]), question:r[2], answer:String(r[3]), notes:r[4]||'', theme:r[0],
    type:'closest', difficulty:r[1], use_with:'', src:'seed'
  }); });
  SEED_AUCTION.forEach(function(r){ out.push({
    id:hash(r[0]), question:r[0], answer:'Host counts', notes:r[1]||'', theme:'',
    type:'auction', difficulty:'', use_with:'', src:'seed'
  }); });
  SEED_SAYSAME.forEach(function(r){ out.push({
    id:hash(r[0]), question:r[0], answer:'', notes:'', theme:'',
    type:'saysame', difficulty:'', use_with:'', pool:r[1].slice(), src:'seed'
  }); });
  /* The bank row carries the words; the drawing itself is looked up from
     SEED_MAPS by `map` at render time, so a corrected border or colour never
     needs a bank migration — only the words do. */
  FLAGS.forEach(function(f){ out.push({
    id:'flag:' + f[0], question:f[1], answer:f[1], notes:f[3] || '', theme:'',
    type:'flag', difficulty:'', use_with:'', flag:f[0], level:f[2], src:'seed'
  }); });
  DISHES.forEach(function(d){ out.push({
    id:'dish:' + d[0], question:d[1], answer:d[1], notes:'', theme:'',
    type:'dish', difficulty:'', use_with:'', dish:d[0], level:d[2], source:d[3], ings:d[4].slice(), src:'seed'
  }); });
  SEED_MAPS.forEach(function(m){ out.push({
    id:hash('map:' + m.key), question:m.title, answer:m.answer, notes:m.notes, theme:'',
    type:'map', difficulty:'', use_with:'', map:m.key, level:m.level, src:'seed'
  }); });
  if(party){
    PINS.forEach(function(p){ out.push({
      id:'pin:' + p[0], question:p[1], answer:p[1], notes:p[5], theme:'',
      type:'pin', difficulty:'', use_with:'', level:p[2], lat:p[3], lon:p[4], place:p[5],
      photo:p[6], credit:p[7], licence:p[8], page:p[9], src:'seed'
    }); });
    AIRPORTS.forEach(function(a){ out.push({
      id:'airport:' + a[0], question:a[1], answer:a[1], notes:a[8], theme:'',
      type:'airport', difficulty:'', use_with:'', level:a[2], code:a[0], city:a[3], lang:a[4],
      boardTitle:a[5], board:a[6].map(function(r){ return r.slice(); }), accept:a[7].slice(), source:a[9], src:'seed'
    }); });
    MAJORITY.forEach(function(m){ out.push({
      id:'mr:' + m[0], question:m[2], answer:m[3][m[4]], notes:m[5] || '', theme:'',
      type:'majority', difficulty:'', use_with:'', level:m[1], options:m[3].slice(), src:'seed'
    }); });
  }
  return out;
}

/* ==========================================================================
   3. AUDIO ENGINE — gentle, synthesised, no files
   ========================================================================== */
const Snd = {
  ctx:null, master:null,
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = S.settings.volume;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 5200; lp.Q.value = 0.6;  // nothing harsh, ever
    this.master.connect(lp); lp.connect(this.ctx.destination);
  },
  resume(){ this.init(); if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  vol(v){ if(this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05); },
  note(freq, at, dur, opt){
    opt = opt || {};
    if(!this.ctx || !S.settings.sound) return;
    const t = this.ctx.currentTime + at;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = opt.type || 'sine'; o.frequency.value = freq;
    const peak = opt.gain == null ? 0.16 : opt.gain;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.035);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  chord(freqs, at, dur, opt){ const self = this; freqs.forEach(function(f,i){ self.note(f, at + i*0.012, dur, opt); }); },

  /* 5-second round jingle — warm and calm, not a fanfare blast */
  jingle(){
    this.resume(); if(!this.ctx || !S.settings.sound) return;
    const N = {C3:130.81,F3:174.61,G3:196.00,A3:220.00,C4:261.63,E4:329.63,G4:392.00,A4:440.00,B4:493.88,C5:523.25,D5:587.33,E5:659.25,G5:783.99};
    this.note(N.C3, 0, 4.6, {type:'sine', gain:0.075});
    this.note(N.G3, 0.02, 4.6, {type:'sine', gain:0.05});
    const arp = [N.C4,N.E4,N.G4,N.B4,N.D5,N.E5,N.G5];
    const self = this;
    arp.forEach(function(f,i){ self.note(f, 0.18 + i*0.185, 1.5, {type:'triangle', gain:0.125}); });
    this.chord([N.A3,N.C4,N.E4], 1.75, 1.6, {type:'sine', gain:0.08});
    this.chord([N.F3,N.A4,N.C5], 2.60, 1.7, {type:'sine', gain:0.08});
    this.chord([N.G3,N.B4,N.D5], 3.35, 1.9, {type:'sine', gain:0.08});
    this.note(N.C5, 4.05, 1.5, {type:'triangle', gain:0.11});
    this.note(N.E5, 4.08, 1.5, {type:'triangle', gain:0.085});
    this.note(N.G5, 4.11, 1.6, {type:'triangle', gain:0.065});
  },
  /* end of timer — three soft descending bells. A nudge, not an alarm. */
  alarm(){
    this.resume(); if(!this.ctx || !S.settings.sound) return;
    const self = this;
    [880, 698.46, 523.25].forEach(function(f, i){
      self.note(f, i*0.26, 1.5, {type:'sine', gain:0.14});
      self.note(f*2, i*0.26, 0.7, {type:'sine', gain:0.04});
    });
  },
  /* filtered white noise — the whoosh under a title card, the drumroll */
  noise(at, dur, opt){
    if(!this.ctx || !S.settings.sound) return;
    opt = opt || {};
    const ctx = this.ctx, n = Math.max(1, Math.ceil(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = opt.type || 'bandpass'; f.Q.value = opt.q || 1;
    const t = ctx.currentTime + at;
    f.frequency.setValueAtTime(opt.f0 || 800, t);
    if(opt.f1) f.frequency.exponentialRampToValueAtTime(opt.f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(opt.gain || 0.2, t + (opt.att || dur * 0.6));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.05);
  },
  whoosh(){ this.resume(); this.noise(0, 0.6, { f0:260, f1:3600, q:0.7, gain:0.2, att:0.42 }); this.note(98, 0.42, 0.6, { type:'sine', gain:0.22 }); },
  drumroll(){
    this.resume(); if(!this.ctx || !S.settings.sound) return;
    for(let i = 0; i < 16; i++) this.noise(i * 0.05, 0.06, { type:'lowpass', f0:700, gain:0.05 + i * 0.01, att:0.008 });
    this.note(82, 0.82, 0.7, { type:'sine', gain:0.3 });
    this.noise(0.82, 1.1, { type:'highpass', f0:3000, gain:0.09, att:0.01 });
  },
  tick(){ this.note(1320, 0, 0.07, {type:'sine', gain:0.095}); this.note(2640, 0, 0.04, {type:'sine', gain:0.03}); },
  correct(){ this.resume(); this.note(659.25,0,0.42,{type:'triangle',gain:0.14}); this.note(987.77,0.09,0.6,{type:'triangle',gain:0.11}); },
  wrong(){ this.resume(); this.note(311.13,0,0.4,{type:'sine',gain:0.12}); this.note(233.08,0.11,0.6,{type:'sine',gain:0.10}); },
  point(){ this.resume(); const self=this; [523.25,659.25,783.99].forEach(function(f,i){ self.note(f,i*0.07,0.5,{type:'triangle',gain:0.10}); }); },
  win(){
    this.resume(); if(!this.ctx || !S.settings.sound) return;
    const self = this;
    [523.25,659.25,783.99,1046.50,783.99,1046.50,1318.51].forEach(function(f,i){ self.note(f, i*0.16, 1.6, {type:'triangle', gain:0.125}); });
    this.chord([261.63,329.63,392.00], 0, 3.2, {type:'sine', gain:0.07});
    this.chord([349.23,440.00,523.25], 1.2, 2.6, {type:'sine', gain:0.07});
  },
  soft(){ this.resume(); this.note(660,0,0.16,{type:'sine',gain:0.06}); }
};

/* ==========================================================================
   4. TIMER
   ========================================================================== */
const Timer = {
  total:0, left:0, running:false, id:null, onEnd:null, lastWhole:null, _t0:0, _base:0,
  start(sec, onEnd){
    this.stop();
    this.total = sec; this.left = sec; this.onEnd = onEnd; this.lastWhole = sec;
    this._base = sec; this._t0 = performance.now(); this.running = true;
    this.paint(); this._loop();
  },
  _loop(){
    const self = this;
    this.id = setInterval(function(){
      self.left = Math.max(0, self._base - (performance.now() - self._t0)/1000);
      const whole = Math.ceil(self.left);
      if(whole !== self.lastWhole){
        self.lastWhole = whole;
        if(whole <= 10 && whole > 0 && S.settings.tick && S.settings.sound) Snd.tick();
      }
      self.paint();
      if(self.left <= 0) self.finish();
    }, 60);
  },
  finish(){
    clearInterval(this.id); this.id = null; this.running = false; this.left = 0;
    this.paint(true);
    Snd.alarm();
    if(S.game && (S.screen === 'ask' || S.screen === 'steal')) Host.say('timeup', { t:curTeam() });
    const f = this.onEnd; this.onEnd = null;
    if(f) f();
  },
  pause(){ if(!this.running) return; clearInterval(this.id); this.id = null; this.running = false; this.paint(); },
  resumeT(){ if(this.running || this.left <= 0) return; this._base = this.left; this._t0 = performance.now(); this.running = true; this._loop(); this.paint(); },
  toggle(){ this.running ? this.pause() : this.resumeT(); },
  add(sec){ if(this.left <= 0) return; this.total += sec; this.left += sec; this._base += sec; this.paint(); },
  stop(){ clearInterval(this.id); this.id = null; this.running = false; this.onEnd = null; },
  paint(ended){
    const box = $('.timer'); if(!box) return;
    const val = box.querySelector('.val'), bar = box.querySelector('.bar');
    if(val) val.textContent = Math.ceil(this.left);
    if(bar){ const C = 565.487; bar.style.strokeDashoffset = String(C * (1 - (this.total ? this.left/this.total : 0))); }
    box.classList.toggle('warn', this.left <= this.total*0.4 && this.left > 10);
    box.classList.toggle('crit', this.left <= 10 && this.left > 0);
    box.classList.toggle('done', !!ended || this.left <= 0);
    const btn = $('[data-act="timerToggle"]');
    if(btn) btn.textContent = this.left <= 0 ? 'Time up' : (this.running ? 'Pause' : 'Resume');
  }
};

/* --------------------------------------------------------------------------
   BANK BOOTSTRAP — built-in questions vs. this browser's saved bank.

   The built-in bank above ships inside this HTML file. The first time the app
   runs in a browser it is copied into that browser's local storage, and from
   then on the saved copy is what the app reads.

   That means a newer version of this FILE would normally be invisible to a
   browser that already has a saved bank. SEED_VERSION fixes that: bump it
   whenever the built-in bank changes, and on next open any built-in questions
   this browser has never seen get merged in — without touching anything the
   host imported or wrote themselves, and without resurrecting ones they deleted.
   -------------------------------------------------------------------------- */
const SEED_VERSION = 29;   // bumped when the built-in bank changes
/* Seed prompts that shipped once and have since been retired outright — not
   corrected, removed. This is different from `killed`: `killed` is the HOST
   deleting a question, and the app must never bring it back. This is the
   CONTENT changing out from under a browser that never touched it — the seed
   list simply no longer has this prompt — and without an explicit retire
   list the row would sit there forever, since the merge below only adds and
   corrects, it never deletes what it does not recognise. Matched on the
   question text (equivalent to its id, easier to read here) and gated on
   `src:'seed'`, so anything the host built or imported on top of the same
   text is left alone. */
const RETIRED_SEED = [
  /* seed 28: moved to Majority Rules (the owner's second review), so a night never asks them twice */

(function bootBank(){
  /* Earlier banks were retired wholesale, not merged. Clear them out so a
     browser that ran an older copy of this file cannot resurrect those
     questions — this bank is the one everybody gets. */
  try{ ['qn.bank.v1','qn.seedv.v1','qn.killed.v1',
        'qn.bank.v2','qn.seedv.v2','qn.killed.v2',
        'qn.bank.v3','qn.seedv.v3','qn.killed.v3',
        'qn.bank.v4','qn.seedv.v4','qn.killed.v4',
        'qn.bank.v5','qn.seedv.v5','qn.killed.v5'].forEach(k => localStorage.removeItem(k)); }catch(e){}
  let stored  = DB.get(DB.k.bank, null);
  const killed  = DB.get(DB.k.killed, []);          // seed questions the host deleted
  const seenVer = DB.get(DB.k.seedv, 0);
  const seed    = buildSeedBank();

  if(!stored){ S.bank = seed; }
  else if(seenVer < SEED_VERSION){
    const beforeRetire = stored.length;
    stored = stored.filter(q => !(q.src === 'seed' && RETIRED_SEED.indexOf(q.question) > -1));
    const retired = beforeRetire - stored.length;

    const have = {};
    stored.forEach(q => have[q.id] = 1);
    killed.forEach(id => have[id] = 1);
    const fresh = seed.filter(q => !have[q.id]);

    /* Adding what is new is only half of it. A built-in question can also be
       CORRECTED — a misspelt answer, a question filed under the wrong theme —
       and the id is a hash of the question text, so a correction to any other
       field arrives under an id this browser already has. Adding-only silently
       dropped every one of those fixes, and the host kept reading the old
       answer off their own screen with no way to know.

       So a seed question is refreshed from the seed. Only a seed question:
       `src` marks where a row came from, and anything the host imported or
       typed themselves is left exactly as it is, even where it happens to sit
       on top of a built-in id. Deleted ones stay deleted — `killed` is checked
       before anything is written back. */
    const byId = {};
    seed.forEach(q => byId[q.id] = q);
    let fixed = 0;
    stored.forEach(q => {
      const s = byId[q.id];
      if(!s || q.src !== 'seed') return;
      /* pool is an array — a straight !== is always true between two distinct
         array references even when the contents match, which would report a

/* the four that get spread through the rounds — the Battle is the finale */
const INTERLEAVED = QMB.INTERLEAVED;

/* both live in the shared engine now (engine/core.js) */
const miniPointValue = QMB.miniPointValue;
const planMinis = QMB.planMinis;



/* every mini-game still owed after the round at index r finishes */
/* the running order lives in the engine; these read it for the screens */
const minisAfter = (r) => QMB.minisAfter(G(), r);

const G = () => S.game;
const curRound = () => { const g = G(); return g.rounds[g.r]; };
/* which TEAM index sits in slot `seat` of this round */
const seatTeam = (round, seat) => QMB.seatTeam(G(), round, seat, S.settings);
const curTeam  = () => seatTeam(curRound(), G().seat);
const otherTeam = (t) => t === 0 ? 1 : 0;

const pointValue = QMB.pointValue;


/* schedule: pips for the HUD. standard rounds + one mini bar, and a second
   bar on the end once the Battle has actually been activated — it is a
   surprise, so it must not appear on the schedule before it is accepted. */
const BATTLE_SCREENS = ['battleIntro','battleQ','battleHandoff','battleTie','battleSummary'];
function schedule(){
  const g = G(); const out = [];
  for(let i = 0; i < g.rounds.length; i++){
    out.push({ kind:'std', i });
    (g.plan || []).forEach(p => { if(p.after === i) out.push({ kind:'mini', key:p.key }); });
  }
  if(!g.rounds.length) (g.plan || []).forEach(p => out.push({ kind:'mini', key:p.key }));
  /* The Battle is on the card from Setup, so it is on the schedule from the
     first pip — it is no longer a surprise the host springs at the end. */
  if(g.hasBattle) out.push({ kind:'mini', key:'battle' });
  return out;
}
const AUCTION_SCREENS = ['auctionIntro','auctionBid','auctionRun','auctionLeg','auctionResult'];
const CLOSEST_SCREENS = ['miniIntro','miniQ','miniEntry','miniSummary'];
const SAYSAME_SCREENS = ['sayIntro','sayQ','sayJudge','saySummary'];
const MAP_SCREENS = ['mapIntro','mapQ','mapJudge','mapTie','mapSummary'];
const FLAG_SCREENS = ['flagIntro','flagQ','flagJudge','flagSummary'];
const DISH_SCREENS = ['dishIntro','dishQ','dishCheck','dishReveal','dishTie','dishSummary'];
/* which mini-game, if any, is on screen right now */
function liveMini(){
  if(CLOSEST_SCREENS.indexOf(S.screen) > -1) return 'closest';
  if(AUCTION_SCREENS.indexOf(S.screen) > -1) return 'auction';
  if(SAYSAME_SCREENS.indexOf(S.screen) > -1) return 'saysame';
  if(MAP_SCREENS.indexOf(S.screen) > -1) return 'map';
  if(FLAG_SCREENS.indexOf(S.screen) > -1) return 'flag';
  if(DISH_SCREENS.indexOf(S.screen) > -1) return 'dish';
  if(BATTLE_SCREENS.indexOf(S.screen) > -1) return 'battle';
  return null;
}
function pipState(){
  const g = G(); const sch = schedule();
  const live = liveMini();
  return sch.map(s => {
    if(s.kind === 'mini'){
      if(live === s.key) return 'now';
      return g.done[s.key] ? 'done' : 'todo';
    }
    /* Use the round's own done flag, not g.r — g.r stays parked on the
       last-played round for the whole of a mini-game, which would show a
       finished round as still to come. */
    if(s.i === g.r && !live) return 'now';
    return (g.rounds[s.i] && g.rounds[s.i].done) ? 'done' : 'todo';
  });
}

/* ==========================================================================
   10. RENDER
   ========================================================================== */
/* Re-render in place. Scroll position is held unless the caller navigates —
   toggling a setting must not throw you back to the top of the page. */
function render(){
  const app = el('app');
  const y = window.scrollY;

  /* Typing in a filter box re-renders the screen underneath the cursor, and
     replacing innerHTML throws the focused input away mid-word — which is why
     the bank search took one letter per click. Note who had focus and where
     the caret sat, then put both back on the rebuilt element. The data-act /
     data-k / data-side triple is what identifies an input across a rebuild;
     there are no ids on these fields. */
  const live = document.activeElement;
  const keep = live && live.dataset && app.contains(live) &&
               (live.tagName === 'INPUT' || live.tagName === 'TEXTAREA')
    ? { act:live.dataset.act, k:live.dataset.k, side:live.dataset.side,
        start:live.selectionStart, end:live.selectionEnd }
    : null;

  const fn = SCREENS[S.screen] || SCREENS.home;
  /* These two strip the page's 24/64px padding so a full-height screen really
     does fit the window. Any screen using .play or .fits MUST be in one of
     them — left out, it renders 88px of padding inside a box already sized to
     the viewport and the page scrolls by exactly that much. */
  document.body.classList.toggle('playmode', ['ask','steal','miniQ','battleQ','auctionBid','auctionRun','sayQ','mapQ','flagQ','dishQ'].indexOf(S.screen) > -1);
  document.body.classList.toggle('fitmode', ['miniSummary','final','battleSummary','battleHandoff','auctionLeg','auctionResult','saySummary','mapTie','mapSummary','flagSummary','dishTie','dishSummary'].indexOf(S.screen) > -1);
  /* the enlarged map belongs to the screen that opened it */
  if(S.tmp.mzFor && S.tmp.mzFor !== S.screen) closeMapZoom();
  document.body.classList.toggle('homemode', S.screen === 'home');
  app.innerHTML = fn();
  if(keep && keep.act){
    const sel = '[data-act="' + keep.act + '"]' +
      (keep.k    ? '[data-k="'    + keep.k    + '"]' : '') +
      (keep.side ? '[data-side="' + keep.side + '"]' : '');
    const back = app.querySelector(sel);
    if(back){
      back.focus({ preventScroll:true });
      /* setSelectionRange throws on number/email inputs, where it also has
         nothing useful to do — the focus alone is the point there. */
      try{ back.setSelectionRange(keep.start, keep.end); }catch(e){}
    }
  }
  renderHUD();
  hudFx();
  if(AFTER[S.screen]) AFTER[S.screen]();
  if(S.tmp.toTop){ S.tmp.toTop = false; window.scrollTo(0, 0); }
  else window.scrollTo(0, y);
}
function nav(screen){ S.tmp.toTop = true; S.screen = screen; render(); }

function renderHUD(){
  const h = el('hud');
  const g = G();
  const inGame = g && (['roundIntro','ask','reveal','steal','stealReveal','answer','roundScore','sudden','final'].indexOf(S.screen) > -1
    || CLOSEST_SCREENS.indexOf(S.screen) > -1
    || AUCTION_SCREENS.indexOf(S.screen) > -1
    || SAYSAME_SCREENS.indexOf(S.screen) > -1
    || MAP_SCREENS.indexOf(S.screen) > -1
    || FLAG_SCREENS.indexOf(S.screen) > -1
    || DISH_SCREENS.indexOf(S.screen) > -1
    || BATTLE_SCREENS.indexOf(S.screen) > -1);
  if(!inGame){ h.hidden = true; h.innerHTML = ''; return; }
  h.hidden = false;

  const pips = pipState().map((st, i) => {
    const sch = schedule()[i];
    const title = sch.kind === 'mini' ? MINI_GAMES[sch.key].name
                : 'Round ' + (sch.i + 1);
    /* the .mini class is the wide bar — the Battle earns one too */
    return '<span class="pip ' + (sch.kind === 'std' ? '' : 'mini ') + (st === 'now' ? 'now' : st === 'done' ? 'done' : '') + '" title="' + title + '"></span>';
  }).join('');

  let label;
  if(CLOSEST_SCREENS.indexOf(S.screen) > -1){
    label = '<b>CLOSEST TO WINS</b> &nbsp;·&nbsp; ' + legLabel();
  } else if(AUCTION_SCREENS.indexOf(S.screen) > -1){
    const a = g.auction;
    label = '<b>THE AUCTION</b>' +
      (a && S.screen !== 'auctionResult' ? ' &nbsp;·&nbsp; Leg ' + Math.min(a.leg + 1, a.n) + '/' + a.n : '') +
      (S.screen === 'auctionRun' && a ? ' &nbsp;·&nbsp; ' + a.count + '/' + a.bid : '');
  } else if(SAYSAME_SCREENS.indexOf(S.screen) > -1){
    label = '<b>DON&rsquo;T SAY THE SAME AS ME</b> &nbsp;·&nbsp; ' + sayLegLabel();
  } else if(MAP_SCREENS.indexOf(S.screen) > -1){
    label = '<b>GUESS THE MAP</b> &nbsp;·&nbsp; ' + (S.screen === 'mapSummary' ? 'Final' : S.screen === 'mapTie' ? 'Level' : mapLegLabel());
  } else if(FLAG_SCREENS.indexOf(S.screen) > -1){
    label = '<b>GUESS THE FLAG</b> &nbsp;·&nbsp; ' + (S.screen === 'flagSummary' ? 'Final' : flagLegLabel());
  } else if(DISH_SCREENS.indexOf(S.screen) > -1){
    label = '<b>GUESS THE COCKTAIL OR DISH</b> &nbsp;·&nbsp; ' + (S.screen === 'dishSummary' ? 'Final' : S.screen === 'dishTie' ? 'Level' : dishLegLabel());
  } else if(BATTLE_SCREENS.indexOf(S.screen) > -1){
    const b = g.battle;
    label = '<b>BATTLE OF THE CAPTAINS</b>' +
      (S.screen === 'battleQ' ? ' &nbsp;·&nbsp; ' + esc(battleCapName(b.cap)) + ' ' + (b.i + 1) + '/' + b.n
       : S.screen === 'battleTie' ? ' &nbsp;·&nbsp; Tie breaker ' + b.tb.n : '');
  } else if(S.screen === 'sudden'){
    label = '<b>SUDDEN DEATH</b>';
  } else if(S.screen === 'final'){
    label = '<b>FINAL RESULT</b>';
  } else {
    const rd = curRound();
    label = 'Round <b>' + (g.r + 1) + '</b> of ' + g.rounds.length + ' &nbsp;·&nbsp; <b>' + esc(rd ? rd.theme : '') + '</b>';
  }

  h.innerHTML =
    '<div class="hud-in">' +
      '<div class="hud-team a"><span class="dot"></span><div><div class="nm">' + esc(g.teams[0].name) + '</div></div><div class="sc num">' + g.teams[0].score + '</div></div>' +
      '<div class="hud-mid"><div class="hud-label">' + label + '</div><div class="pips">' + pips + '</div></div>' +
      '<div class="hud-team b"><div class="sc num">' + g.teams[1].score + '</div><div><div class="nm">' + esc(g.teams[1].name) + '</div></div><span class="dot"></span></div>' +
      '<div class="hud-actions"><button class="btn sm ghost" data-act="quit">Exit</button></div>' +
    '</div>';
}

SCREENS.home = function(){
  return '' +
  '<section class="home">' +
    '<div class="home-main">' +
      '<div class="logo-wrap">' +
        /* He lives inside the logo block so phones can sit him beside the
           wordmark. On desktop he is position:absolute against .home — and
           neither .home-main nor .logo-wrap is a positioned ancestor — so
           moving him here leaves the desktop layout byte-for-byte identical. */
        '<img class="mascot" src="' + MASCOT + '" alt="Imad, your MC" draggable="false">' +
        '<div class="logo">Quiz Me<br>Baby</div>' +
      '</div>' +
      /* Three buttons and a quiet link. The stats line and the tagline were
         reading material nobody stopped for; history lives in Settings now. */
      '<div class="home-menu">' +
        '<button class="btn gold lg block" data-act="playMode" data-h="0">Play with host</button>' +
        '<button class="btn block" data-act="playMode" data-h="1">Play without host</button>' +
        '<button class="btn block" data-act="go" data-to="soloSetup">Play solo</button>' +
        '<button class="btn ghost block" data-act="go" data-to="settings">Settings</button>' +

/* ==========================================================================
   12. SCREENS — SETUP
   ========================================================================== */
/* themes that can actually field a matched pair at this difficulty */
function usableThemes(diff){
  return THEMES.filter(t => pairsFor(t, diff).length > 0);
}
function defaultSetup(){
  const rounds = 8;
  return {
    teamA:{ name:'Team A', captain:'', players:'' },
    teamB:{ name:'Team B', captain:'', players:'' },
    rounds,
    themes:shuffle(usableThemes(QMB.DEFAULT_DIFF)).slice(0, rounds),
    difficulty:QMB.DEFAULT_DIFF,
    themeDiff:{},       // theme -> difficulty, overriding the house setting
    standard:true,      // false = a mini-games-only night, no standard rounds
    minis:['closest'],  // which mini-games are on tonight's card
    pickClosest:[], pickAuction:[], pickSaySame:[], pickMap:[],   // hand-picked mini-game questions
    picks:{}            // theme -> [questionId, questionId] chosen by hand
  };
}

/* --------------------------------------------------------------------------
   DIFFICULTY, PER THEME
   `difficulty` is the house setting for the night. A theme may override it —
   hard Friends for the table who have seen it fifty times, easy Geography for
   everyone else — and that override is what every pool, count and warning in
   the app reads from. A theme with no entry simply inherits.
   -------------------------------------------------------------------------- */

function diffFor(theme){ return diffOf(S.setup, theme); }
/* themes actually running on something other than the house setting */
function overrideThemes(){
  const c = S.setup;
  if(!c || !c.themeDiff) return [];
  return c.themes.filter(t => c.themeDiff[t] && c.themeDiff[t] !== c.difficulty);
}
/* keep the theme count matched to the round count when the round count moves */
function syncThemes(){
  const c = S.setup;
  if(c.themes.length > c.rounds){ c.themes = c.themes.slice(0, c.rounds); prunePicks(); return; }
  const spare = shuffle(usableThemes(c.difficulty).filter(t => c.themes.indexOf(t) < 0));
  while(c.themes.length < c.rounds && spare.length) c.themes.push(spare.shift());
}

/* --------------------------------------------------------------------------
   HAND-PICKED QUESTIONS
   The host may nominate exactly two questions per theme — one for each team.
   Anything they do not touch is still matched automatically at build time.
   -------------------------------------------------------------------------- */
/* The theme's own difficulty is the default — pass one explicitly only to ask
   a what-if question, which nothing currently does. */
function pickPool(theme, diff){
  const d = diff || diffFor(theme);
  return S.bank.filter(q => q.type === 'standard' && q.theme === theme && matchDiff(q, d) && isFresh(q));
}
function picksFor(theme){ return ((S.setup && S.setup.picks) || {})[theme] || []; }
/* a pick stops being valid the moment its theme, difficulty or freshness moves */
function prunePicks(){
  const c = S.setup; if(!c) return;
  /* A difficulty override for a theme that is no longer in play is dead weight,
     and worse, it would come back silently if the host re-added the theme. */
  const td = c.themeDiff = c.themeDiff || {};
  Object.keys(td).forEach(t => { if(c.themes.indexOf(t) < 0) delete td[t]; });
  const p = c.picks = c.picks || {};
  Object.keys(p).forEach(t => {
    if(c.themes.indexOf(t) < 0){ delete p[t]; return; }
    const ok = {}; pickPool(t).forEach(q => ok[q.id] = 1);
    p[t] = p[t].filter(id => ok[id]);
    if(!p[t].length) delete p[t];
  });
  /* Turn a mini-game off and its hand-picked questions go with it — leaving
     them would silently reapply if the host switched it back on later. */
  Object.keys(MINI_PICKS).forEach(k => {
    const m = MINI_PICKS[k];
    if((c.minis || []).indexOf(k) < 0){ c[m.store] = []; return; }
    const ok = {}; S.bank.forEach(q => { if(q.type === m.type && (isFresh(q) || m.type === 'map')) ok[q.id] = 1; });
    c[m.store] = (c[m.store] || []).filter(id => ok[id]);
  });
}


SCREENS.setup = function(){
  const c = S.setup = S.setup || defaultSetup();
  prunePicks();
  const setThemes  = c.themes.filter(t => picksFor(t).length === 2);
  const halfThemes = c.themes.filter(t => picksFor(t).length === 1);
  const cap = capacity(c.themes, diffFor);   // resolver, so overrides count
  const enough = cap.rounds >= c.rounds;
  const enoughMini = cap.closest >= 7;
  /* the mini-game card: what is on the card, where it lands, what it is worth */
  c.minis = c.minis || [];
  const miniKeys   = Object.keys(MINI_GAMES).filter(k => c.minis.indexOf(k) > -1);
  const miniInter  = INTERLEAVED.filter(k => miniKeys.indexOf(k) > -1);
  const stdOn      = c.standard !== false;
  const miniPlan   = stdOn ? planMinis(c.rounds, miniInter) : miniInter.map(k => ({ key:k, after:-1 }));
  const miniBattle = miniKeys.indexOf('battle') > -1;
  const miniEach   = miniPointValue(stdOn ? c.rounds : 0, miniKeys.length, miniBattle);
  const miniTotal  = miniEach * (miniKeys.length + (miniBattle ? 1 : 0));   // the Battle pays double

  /* one theme per round — the counts have to match exactly */
  const themeGap = c.themes.length - c.rounds;
  const themesOK = themeGap === 0;
  const canStart = stdOn ? enough && themesOK : miniKeys.length > 0;

  /* The count came off the face of the chip. On a phone it was the difference
     between two themes per row and three, and it was answering a question the
     host does not have — the capacity warning underneath already catches a
     theme that cannot field a round. A theme that is genuinely too thin is
     dimmed instead, which reads at a glance and costs no width. */
  const themeChips = THEMES.map(t => {
    const d = diffFor(t);
    const n = S.bank.filter(q => q.theme === t && q.type === 'standard' && matchDiff(q, d) && isFresh(q)).length;
    const on = c.themes.indexOf(t) > -1;
    return '<button class="chip' + (n < 2 ? ' thin' : '') + '" role="button" aria-pressed="' + on + '" data-act="theme" data-t="' + esc(t) + '"' +
      (n < 2 ? ' title="Not enough questions in ' + esc(t) + ' at ' + esc(DLabel(d)) + ' difficulty"' : '') + '>' +
      esc(t) + '</button>';
  }).join('');

  const roundBtns = [];
  for(let i = 4; i <= 14; i++) roundBtns.push('<button data-act="rounds" data-n="' + i + '" aria-pressed="' + (c.rounds === i) + '" class="' + (c.rounds === i ? 'gold' : '') + '">' + i + '</button>');

  const diffBtns = [QMB.DEFAULT_DIFF, 'easy','medium','hard','expert','mixed'].map(d =>

  /* ---- the advanced drawer ------------------------------------------------
     Three things the host almost never touches on a normal Tuesday, folded
     away behind one button so the setup screen stays a phone screen: the
     hand-picked questions, a difficulty per theme, and tonight's rules.
     Collapsed by default. The summary line under the button says what is
     configured in there, so nothing set can hide behind a closed drawer. */
  const adv  = !!S.tmp.advOpen;
  const ovr  = overrideThemes();
  const bits = [];
  if(setThemes.length)  bits.push(setThemes.length + ' theme' + (setThemes.length > 1 ? 's' : '') + ' hand-picked');
  if(halfThemes.length) bits.push(halfThemes.length + ' half-picked');
  if(ovr.length)        bits.push(ovr.length === 1 ? '1 theme on its own difficulty' : ovr.length + ' themes on their own difficulty');
  if(S.settings.noRepeat)       bits.push('no repeats');
  if(S.settings.alternateFirst) bits.push('alternating first answer');
  const advSummary = bits.length
    ? bits.join(' <span class="sep">·</span> ')
    : 'Hand-pick the questions, set a difficulty per theme, change tonight&rsquo;s rules.';

  function advBody(){
    /* A. hand-picked questions */
    const pickBlock = '<div class="stack">' +

      '<p class="help">Optional. Tick exactly <strong>two</strong> questions in a theme — one for each team — and that round is locked to the pair you chose. Leave a theme alone and the app matches a pair itself, as always.</p>' +
      (halfThemes.length
        ? '<div class="warnbox"><strong>' + esc(halfThemes.join(', ')) + '</strong> ' + (halfThemes.length > 1 ? 'have' : 'has') + ' only one question ticked. A round needs two — tick a second one or clear it, otherwise that theme falls back to a random pair.</div>'

/* --------------------------------------------------------------------------
   HAND-PICKING THE MINI-GAMES
   Same idea as the themes, and same rule: only what is actually on tonight's
   card is offered. Picking questions for a mini-game the host has not selected
   would be work thrown away, so those blocks simply are not drawn.
   Under-filling is fine — pick two auction categories out of three and the
   third is drawn for you. Picks lead, the bank makes the numbers up.
   -------------------------------------------------------------------------- */
const MINI_PICKS = {
  closest:{ store:'pickClosest', type:'closest', cap:CLOSEST_LEGS, label:'Closest To Wins',
            help:'Number questions, in the order you tick them. Anything short is dealt from the bank as usual.' },
  auction:{ store:'pickAuction', type:'auction', cap:AUCTION_LEGS, label:'The Auction',
            help:'Categories, in the order you tick them. Anything short is drawn from the bank.' },
  saysame:{ store:'pickSaySame', type:'saysame', cap:SAYSAME_LEGS, label:"Don't Say the Same as Me",
            help:'Prompts, in the order you tick them. Anything short is dealt from the bank as usual — vast prompts play first, tight ones last.' },
  map:    { store:'pickMap', type:'map', cap:MAP_LEGS, label:'Guess the Map',
            help:'Maps at tonight&rsquo;s level(s), in the order you tick them. Anything short is drawn from those levels, and the rest wait as tie-breakers.' },
  flag:   { store:'pickFlag', type:'flag', cap:FLAG_LEGS, label:'Guess the Flag',
            help:'Flags at tonight&rsquo;s level(s), in the order you tick them. Anything short is dealt from the level, and the rest wait as swaps and tie-breakers.' },
  dish:   { store:'pickDish', type:'dish', cap:DISH_LEGS, label:'Guess the Cocktail or Dish',
            help:'Cocktails and dishes at tonight&rsquo;s levels, in the order you tick them. Anything short is dealt from those levels, and the rest wait as swaps and tie-breakers.' }
};
function miniPicksFor(key){ return (S.setup && S.setup[MINI_PICKS[key].store]) || []; }
function miniPickBlocks(only){
  const c = S.setup;
  return Object.keys(MINI_PICKS).filter(k => (c.minis || []).indexOf(k) > -1 && (!only || k === only)).map((k, i) => {
    const m = MINI_PICKS[k];
    const sel = miniPicksFor(k), full = sel.length >= m.cap;
    /* Maps come back once they have all been played (see mapPool), so the
       picker offers every one — fresh first, played ones after and tagged —
       rather than an empty list on a table that has been through all twenty. */
    const pool = m.type === 'map'
      ? S.bank.filter(q => mapOK(q) && mapAt(q, mapLevelsOf(c))).sort((a, b) => isFresh(b) - isFresh(a))
      : m.type === 'flag'
      ? S.bank.filter(q => flagOK(q) && flagLevelsOf(c).indexOf(q.level) > -1)
          .sort((a, b) => (isFresh(b) - isFresh(a)) || a.question.localeCompare(b.question))
      : m.type === 'dish'
      ? S.bank.filter(q => dishOK(q) && dishLevelsOf(c).indexOf(q.level) > -1)
          .sort((a, b) => (isFresh(b) - isFresh(a)) || a.level.localeCompare(b.level) || a.question.localeCompare(b.question))
      : S.bank.filter(q => q.type === m.type && isFresh(q) &&
          (m.type !== 'saysame' || (q.pool || []).length >= 2));
    const rows = pool.map(q => {
      const on = sel.indexOf(q.id) > -1;
      return '<button class="pickrow" role="button" aria-pressed="' + on + '"' + (!on && full ? ' disabled' : '') +
        ' data-act="miniPickToggle" data-k="' + k + '" data-id="' + q.id + '">' +
        '<span class="tick" aria-hidden="true"></span>' +
        (m.type === 'flag' ? '<img class="pick-flag" src="' + flagSrc(q) + '" alt="" loading="lazy">' : '') +
        '<span class="pq"><span class="qq">' + esc(q.question) + '</span>' +
        /* Closest To Wins is a number — the answer IS the useful line, and its
           note is a source citation nobody picks a question on. The auction has
           no answer worth printing ("Host counts"), so it shows its ruling. A
           Say-Same prompt has no FIXED answer to show — one is drawn fresh
           each time it is played — so it shows the pool instead, which is the
           thing the host is actually choosing between prompts on. */
        (m.type === 'closest' ? '<span class="qa">' + esc(q.answer) + '</span>'
         : m.type === 'saysame' ? '<span class="qa dim">' + esc(q.pool.join(' · ')) + '</span>'
         /* a map's title IS its answer; the line under it says what kind of map */
         : m.type === 'map' ? '<span class="qa dim">' + (mapSpec(q) ? MAP_VIEW_NAME[mapSpec(q).view] + ' map' + (q.level ? ' · ' + MAP_LEVELS[q.level] : '') : 'Your own map') +
             (isFresh(q) ? '' : ' · played before') + '</span>'
         : m.type === 'flag' ? '<span class="qa dim">' + esc(q.notes || FLAG_LEVELS[q.level]) + (isFresh(q) ? '' : ' · played before') + '</span>'
         : m.type === 'dish' ? '<span class="qa dim">' + esc(dishLevelName(q.level)) + ' · ' + q.ings.length + ' ingredients' + (isFresh(q) ? '' : ' · played before') + '</span>'
         : q.notes ? '<span class="qa dim">' + esc(q.notes) + '</span>' : '') +
        '</span></button>';
    }).join('');
    return (only && !i ? '' : '<hr class="hair">') +
      '<div class="stack" style="gap:8px">' +
        '<div class="row between">' +
          '<div class="eyebrow gold">' + m.label + '</div>' +
          '<div class="row" style="gap:8px">' +
            '<span class="badge ' + (full ? 'ok' : sel.length ? 'gold' : 'line') + '">' + sel.length + ' of ' + m.cap + ' ticked</span>' +
            (sel.length ? '<button class="btn sm ghost" data-act="miniPickClear" data-k="' + k + '">Clear</button>' : '') +
          '</div>' +
        '</div>' +
        '<p class="help">' + m.help + '</p>' +
        (pool.length ? '<div class="picklist">' + rows + '</div>'
                     : '<div class="empty">Nothing left in the bank for this one.</div>') +
      '</div>';
  }).join('');
}

/* standalone pausable countdown for modals (Call a Friend) */
var cdId = null;
const CD = {
  left:0, base:0, t0:0, running:false, node:'', lastWhole:null,
  start(sec, nodeId){
    this.stop();
    this.left = sec; this.base = sec; this.node = nodeId; this.lastWhole = Math.ceil(sec);
    this.t0 = performance.now(); this.running = true;
    this.paint(); this.loop();
  },
  loop(){
    const self = this;
    cdId = setInterval(function(){
      self.left = Math.max(0, self.base - (performance.now() - self.t0) / 1000);
      const w = Math.ceil(self.left);
      if(w !== self.lastWhole){
        self.lastWhole = w;
        if(w <= 10 && w > 0 && S.settings.tick && S.settings.sound) Snd.tick();
      }
      self.paint();
      if(self.left <= 0){ self.stop(); Snd.alarm(); }
    }, 80);
  },
  toggle(){
    if(this.left <= 0) return;
    if(this.running){ clearInterval(cdId); cdId = null; this.running = false; }
    else { this.base = this.left; this.t0 = performance.now(); this.running = true; this.loop(); }
    this.paint();
  },
  add(s){ if(this.left <= 0) return; this.left += s; this.base += s; this.paint(); },
  stop(){ clearInterval(cdId); cdId = null; this.running = false; },
  paint(){
    const n = el(this.node); if(n) n.textContent = Math.ceil(this.left);
    const b = $('[data-act="cdToggle"]');
    if(b) b.textContent = this.left <= 0 ? 'Time up' : (this.running ? 'Pause' : 'Resume');
  }
};

/* The answer is NOT shown here. If it were, a stealing team watching a shared
   screen would simply read it off. The host judges from the peek, or from
   knowing it. The full reveal comes later, on SCREENS.answer. */
function peek(q){
  if(NOHOST()) return '';             // nobody to hide it from, nobody to show it to
  return '<details class="peek"><summary>Peek at the answer — host only</summary>' +
    '<div class="peek-body"><strong>' + esc(q.answer) + '</strong>' +
    (q.notes ? '<p class="help" style="margin-top:6px">' + esc(q.notes) + '</p>' : '') +
    '</div></details>';
}
/* No host: the TV is the host. Questions are read off the screen, the answer
   comes up for everyone the moment the team locks in, whoever holds the phone
   taps right or wrong, and there is no steal. Set in Setup, carried on the game. */
const NOHOST = () => !!(S.game && S.game.hostless);

function teamName(i){ return '<span class="tn ' + (i === 0 ? 'a' : 'b') + '">' + esc(G().teams[i].name) + '</span>'; }

/* THE reveal — everyone sees this, and only once the question is fully settled. */
SCREENS.answer = function(){
  const g = G(), rd = curRound(), ti = curTeam(), q = rd.q[g.seat], r = rd.res[g.seat] || {};
  let verdict;
  if(r.correct)      verdict = '<span class="badge ok">' + esc(g.teams[ti].name) + ' got it</span>';
  else if(r.stolen)  verdict = '<span class="badge ok">' + esc(g.teams[otherTeam(ti)].name) + ' stole it</span>';

/* ==========================================================================
   16. ROUND SCOREBOARD
   ========================================================================== */
SCREENS.roundScore = function(){
  const g = G(), rd = curRound();
  /* what the button is actually about to do: a mini-game owed against this
     round wins, then the Battle if the rounds are done, then the next round */
  const owed = minisAfter(g.r);
  const last = g.r + 1 >= g.rounds.length;
  const nextMini = owed.length ? owed[0].key : (last && g.hasBattle && !g.done.battle ? 'battle' : null);
  /* don't promise a tie breaker while a mini-game is still to come — it may
     well settle the thing, and the button must give nothing away either way */
  const heading = last && !nextMini && g.teams[0].score === g.teams[1].score;
  const lines = [0, 1].map(seat => {
    const ti = seatTeam(rd, seat), r = rd.res[seat];
    if(!r) return '';
    const who = g.teams[ti].name;
    let txt;
    if(r.correct) txt = '<span class="badge ok">' + esc(who) + ' answered it</span>';
    else if(r.stolen) txt = '<span class="badge ok">' + esc(g.teams[otherTeam(ti)].name) + ' stole it</span>';
    else txt = '<span class="badge no">Nobody got it</span>';
    return '<div class="list-row"><div><div class="eyebrow">Question for ' + esc(who) + (rd.dbl[ti] ? ' · 2×' : '') + '</div>' +
      '<div style="font-weight:600;margin-top:4px;font-size:14px">' + esc(rd.q[seat].question) + '</div>' +
      '<div class="help" style="margin-top:4px">Answer: <strong style="color:var(--gold)">' + esc(rd.q[seat].answer) + '</strong></div></div>' + txt + '</div>';
  }).join('');

  return '<div class="stack lg" style="padding-top:14px">' +
    '<div class="center"><div class="eyebrow gold">End of round ' + rd.n + ' — ' + esc(rd.theme) + '</div></div>' +
    scoreBig() +
    '<div class="stack">' + lines + '</div>' +
    '<div class="btn-row center">' +
      '<button class="btn ghost" data-act="quit">End game</button>' +
      '<button class="btn gold lg" data-act="nextRound">' +
        (nextMini ? 'Next — ' + MINI_GAMES[nextMini].name : heading ? 'Scores tied — tie breaker' : last ? 'Finish the game' : 'Next round') +
      '</button>' +
    '</div>' +
    '<p class="center help">Take a break here. The game holds until you press next.</p>' +
  '</div>';
};

function scoreBig(delta){
  const g = G();
  const cell = (i) => '<div class="score-cell ' + (i === 0 ? 'a' : 'b') + '">' +
    '<div class="v num">' + g.teams[i].score + '</div>' +
    '<div class="n">' + esc(g.teams[i].name) + '</div>' +
    (delta && delta[i] ? '<div class="delta">+' + delta[i] + ' this round</div>' : '') +
  '</div>';
  return '<div class="score-big">' + cell(0) + '<div class="vs">VS</div>' + cell(1) + '</div>';
}

/* Years must not get a thousands separator — "1,961" reads as nonsense. */
function fmtAns(q){
  const n = Number(q.answer);
  if(!isFinite(n) || q.answer === '') return esc(q.answer);
  if(/\byears?\b/i.test(q.question) && n >= 1000 && n <= 2999) return String(n);
  return nf(n);
}
function legLabel(){
  const m = G().mini;
  const i = Math.min(m.i, m.qs.length - 1);
  return i >= m.base ? 'Tie-breaker leg ' + (i - m.base + 1) : 'Leg ' + (i + 1) + ' of ' + m.base;
}
function miniDots(){
  const m = G().mini;
  let out = '<span class="mini-dots">';
  for(let i = 0; i < m.qs.length; i++){
    const s = m.subs[i];
    out += '<i class="' + (!s ? '' : s.winner === 'tie' ? 't' : s.winner === 0 ? 'a' : 'b') + '"></i>';
  }
  return out + '</span>';
}

}

/* ==========================================================================

function mapLegLabel(){
  const s = G().mapGame;
  const i = Math.min(s.i, s.qs.length - 1);
  return i >= s.base ? 'Tie-breaker map ' + (i - s.base + 1) : 'Map ' + (i + 1) + ' of ' + s.base;
}
function mapDots(){
  const s = G().mapGame;
  let out = '<span class="mini-dots">';
  for(let i = 0; i < s.qs.length; i++){
    const r = s.subs[i];
    out += '<i class="' + (!r ? '' : r.winner === 'tie' ? 't' : r.winner === 'none' ? 'n' : r.winner === 0 ? 'a' : 'b') + '"></i>';
  }
  return out + '</span>';
}
const mapBand = () => '<div class="center"><div class="mini-band tight"><span class="eyebrow gold">' + mapLegLabel() + '</span>' + mapDots() + '</div></div>';
/* the host's peek: the title is the answer here, the answer line is the gloss */
function mapPeek(q){ return peek({ answer:q.question, notes:q.answer && q.answer !== q.question ? q.answer : '' }); }

/* One hint per map: its subject area. Remembered per map, not per leg, so a
   swapped-in map starts without one. A host's own picture has no topic. */
function mapHint(q){
  const sp = mapSpec(q), s = G().mapGame;
  if(!sp || !sp.topic) return '';
  return (s.hints || {})[q.id]
    ? '<div class="map-hint">Hint: <strong>' + esc(sp.topic) + '</strong></div>'
    : '<button class="btn sm ghost map-hint-btn" data-act="mapHint">Show a hint</button>';
}

   still on its way, wait for it, redraw, and arm the timer then. */
AFTER.mapQ = function(){
  const q = G().mapGame.qs[G().mapGame.i];
  if(needsGeo(q)){ mapWaitGeo(); return; }
  /* marked as played the moment it is actually on screen — not when the game
     is built — so a map the night never reached stays fresh */
  if(!S.used.has(q.id)) markUsed(q);
  armTimer('map' + G().mapGame.i, MAP_SECS, () => { if(S.screen === 'mapQ') go('mapJudge'); });
};
function mapWaitGeo(){
  const here = S.screen;
  loadMapGeo().then(() => { if(S.screen === here) render(); }).catch(() => {
    const w = $('[data-geo="wait"]');
    if(w) w.innerHTML = 'Could not load the map — check the connection. <button class="btn sm ghost" data-act="mapRetry">Try again</button>';
  });
}

/* ==========================================================================
   17g. GUESS THE COCKTAIL OR DISH — screens
   The list is drawn whole and the rows light up one by one, so nothing jumps
   as they arrive. One clock runs the leg: ingredient k shows at (k-1)·STEP
   seconds, and LAST more seconds follow the final one. A call pauses it.

function dishLegLabel(){
  const s = G().dishGame;
  const i = Math.min(s.i, s.qs.length - 1);
  return i >= s.base ? 'Tie-breaker ' + (i - s.base + 1) : 'Number ' + (i + 1) + ' of ' + s.base;
}
function dishDots(){
  const s = G().dishGame;
  let out = '<span class="mini-dots">';
  for(let i = 0; i < s.qs.length; i++){
    const r = s.subs[i];
    out += '<i class="' + (!r ? '' : r.winner === 'none' ? 'n' : r.winner === 0 ? 'a' : 'b') + '"></i>';
  }
  return out + '</span>';
}
const dishBand = () => '<div class="center"><div class="mini-band tight"><span class="eyebrow gold">' + dishLegLabel() + '</span>' + dishDots() + '</div></div>';
function dishList(q, shown){
  return '<ol class="ings' + (q.ings.length > 8 ? ' long' : '') + '">' + q.ings.map((t, i) => {
    const p = splitIng(t);
    return '<li class="ing' + (i < shown ? ' on' : '') + '" data-i="' + i + '">' +
      '<span class="ing-n">' + esc(p[1]) + '</span>' + (p[0] ? '<span class="ing-q">' + esc(p[0]) + '</span>' : '') + '</li>';
  }).join('') + '</ol>';
}

/* one clock for the whole leg; the watcher lights the next row as it comes due */
function dishWatch(){
  if(S.screen !== 'dishQ' || !S.game){ clearInterval(S.tmp.dishIv); return; }
  const s = G().dishGame, q = s.qs[s.i], L = s.leg;
  const want = Math.min(q.ings.length, 1 + Math.floor((Timer.total - Timer.left) / DISH_STEP + 1e-6));
  if(want <= L.shown) return;
  L.shown = want;
  $$('.ings .ing').forEach(li => { if(+li.dataset.i < want) li.classList.add('on'); });
  const c = $('.dish-count b'); if(c) c.textContent = want;
  Snd.soft();
}

/* ---- the enlarged map ----
   Pinch-zoom is switched off app-wide (it wrecked the buttons on a phone), so
   a map with fifty year labels on it needs its own way to get close. Tap the
   map: it fills the screen. Tap a spot: it zooms in there. Drag to look
   around, tap again to zoom back out. It lives outside #app, so the timer
   underneath keeps running and a re-render never wipes it. */
function openMapZoom(){
  const g = G(); if(!g) return;
  const s = g.mapGame, q = s.qs[s.i], reveal = S.screen === 'mapJudge';
  closeMapZoom();
  const box = document.createElement('div');
  box.id = 'mapzoom';
  box.innerHTML =
    '<div class="mz-top"><span class="eyebrow gold">' + (reveal ? esc(q.question) : 'What does this map show?') + '</span>' +
      (reveal ? '' : '<span class="mz-t num" id="mzT"></span>') +
      '<button class="xbtn" id="mzClose" aria-label="Close">&times;</button></div>' +
    '<div class="mz-stage" id="mzStage">' + mapSVG(q, reveal) + '</div>' +
    mapLegend(q, reveal) +
    '<p class="mz-help">Tap to zoom in &middot; drag to look around &middot; tap again to zoom out</p>';
  document.body.appendChild(box);
  S.tmp.mzFor = S.screen;

  const stage = box.querySelector('#mzStage');
  const svg = stage.querySelector('svg'), img = stage.querySelector('img');
  box.querySelector('#mzClose').addEventListener('click', e => { e.stopPropagation(); closeMapZoom(); });
  if(!reveal){
    const t = box.querySelector('#mzT');
    const tick = () => { if(t) t.textContent = Math.ceil(Timer.left) + 's'; };
    tick(); S.tmp.mzTick = setInterval(tick, 250);
  }

  /* one zoom level, 2.6x, panned by dragging — enough to read Luxembourg */
  const Z = 2.6;
  let zoomed = false, tx = 0, ty = 0, drag = null;
  const target = svg || img;
  if(!target) return;
  target.style.transformOrigin = '0 0';
  const apply = () => { target.style.transform = zoomed ? 'translate(' + tx + 'px,' + ty + 'px) scale(' + Z + ')' : ''; };
  const clamp = () => {
    const w = target.clientWidth, h = target.clientHeight;
    tx = Math.min(0, Math.max(w - w * Z, tx));
    ty = Math.min(0, Math.max(h - h * Z, ty));
  };
  stage.addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY, tx, ty, moved:false }; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if(!drag || !zoomed) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
    tx = drag.tx + dx; ty = drag.ty + dy; clamp(); apply();
  });
  stage.addEventListener('pointerup', e => {
    const d = drag; drag = null;
    if(d && d.moved) return;
    if(zoomed){ zoomed = false; tx = ty = 0; apply(); return; }
    const r = target.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    zoomed = true; tx = px - px * Z; ty = py - py * Z; clamp(); apply();
  });
}
function closeMapZoom(){
  const b = el('mapzoom'); if(b) b.remove();
  clearInterval(S.tmp.mzTick); S.tmp.mzTick = null; S.tmp.mzFor = null;
}

function confetti(){
  const c = document.createElement('div');
  c.className = 'confetti';
  const cols = ['#F5C518','#FFE58A','#31C9F7','#FF4D82','#FFFFFF'];
  for(let i = 0; i < 90; i++){
    const s = document.createElement('i');
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.background = cols[i % cols.length];
    s.style.animationDuration = (2.6 + Math.random() * 2.4) + 's';
    s.style.animationDelay = (Math.random() * 1.6) + 's';
    s.style.opacity = String(0.55 + Math.random() * 0.45);
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 7000);
}

/* ==========================================================================
   19b. SOLO — practice on your own
   ==========================================================================
   A different shape of thing to the party game, and deliberately so. There is
   no second team, so there are no pairs, no steals and no lifelines; there is
   no host, so nobody can judge an answer but the player.

   Three consequences worth stating, because each one was a choice:

   1. YOU MARK YOURSELF. Question, ten seconds, answer, "Got it / Missed it".
      Multiple choice would be firmer, but the bank holds no wrong options and
      inventing them from other answers gives you "Canberra / a pride / Khalil
      Gibran" — a giveaway, not a question. Honest-system beats a fake one.

   2. SOLO NEVER BURNS A QUESTION. It does not read the played-question memory
      and it does not write to it. Practising on a Tuesday must not empty the
      good material out of Friday's party game, which is exactly what would
      happen if solo shared that memory.

   3. NOTHING IS RECORDED. Game history is a two-team format — names, scores,
      a winner. A solo run has none of those, so it stays out rather than
      arriving there malformed. The result lives on the last screen.
   ========================================================================== */
const SOLO_SECS   = 10;                       // fixed. Not the host's timers.
const SOLO_COUNTS = [10, 20, 30, 40, 50];

/* Barred outright, never offered. Every "Know the Host" answer in the bank is
   the literal string "Host knows this one" — the answer lives in the host's
   head, not in the file. That is fine with a host in the room and useless
   without one: solo would reveal "Host knows this one" and ask you to mark
   yourself against it. BATTLE_SKIP_THEMES bars it for the same reason. */
const SOLO_SKIP_THEMES = ['Know the Host'];
const soloThemes = () => THEMES.filter(t => SOLO_SKIP_THEMES.indexOf(t) < 0);

function defaultSolo(){
  return { diff:'mixed', themes:[], n:10, qs:[], i:0, got:0 };
}
/* An empty themes list means every theme SOLO ALLOWS — the "All themes" chip.
   The skip list is applied here as well as in the chips, so a barred theme
   cannot reach the pool even if it somehow lands in s.themes. Note the absence
   of isFresh(): see (2) above. */
function soloPool(cfg){
  const s = cfg || S.solo;
  return S.bank.filter(q =>
    q.type === 'standard' &&
    SOLO_SKIP_THEMES.indexOf(q.theme) < 0 &&
    (s.diff === 'mixed' || q.difficulty === s.diff) &&
    (!s.themes.length || s.themes.indexOf(q.theme) > -1));
}

SCREENS.soloSetup = function(){
  const s = S.solo = S.solo || defaultSolo();
  const avail = soloPool().length;

  const diffBtns = ['easy','medium','hard','expert','mixed'].map(d =>
    '<button data-act="soloDiff" data-d="' + d + '" aria-pressed="' + (s.diff === d) + '" class="' +
      (s.diff === d ? 'gold' : '') + '">' + Cap(d) + '</button>').join('');

  const themeChips =
    '<button class="chip" role="button" aria-pressed="' + (!s.themes.length) + '" data-act="soloAll">All themes</button>' +
    soloThemes().map(t => {
      const n = soloPool({ diff:s.diff, themes:[t] }).length;
      const on = s.themes.indexOf(t) > -1;
      return '<button class="chip' + (n ? '' : ' thin') + '" role="button" aria-pressed="' + on +
        '" data-act="soloTheme" data-t="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('');

  /* A count you cannot fill is dead, not hidden — seeing 50 greyed out tells
     you the bank is the limit far better than 50 quietly missing would. */
  const nBtns = SOLO_COUNTS.map(n =>
    '<button data-act="soloN" data-n="' + n + '" aria-pressed="' + (s.n === n) + '"' +
      (avail < n ? ' disabled title="Only ' + avail + ' questions match"' : '') +
      ' class="' + (s.n === n ? 'gold' : '') + '">' + n + '</button>').join('');

  const ok = avail >= s.n && avail > 0;

  return '<div class="stack lg" style="padding-top:12px">' +
    '<div class="row between">' +
      '<div><div class="eyebrow gold">Solo</div><h2 class="display">Play on your own</h2></div>' +
      '<button class="btn ghost sm" data-act="go" data-to="home">Back</button>' +
    '</div>' +

    '<div class="card pad lit stack">' +
      '<div class="sec-head"><div class="eyebrow gold">01</div><h3 class="display">Difficulty</h3></div>' +
      '<div class="seg">' + diffBtns + '</div>' +
    '</div>' +

    '<div class="card pad lit stack">' +
      '<div class="sec-head"><div class="eyebrow gold">02</div><h3 class="display">Themes</h3>' +
        '<span class="badge line">' + (s.themes.length ? s.themes.length + ' picked' : 'All') + '</span></div>' +
      '<div class="chips theme-chips">' + themeChips + '</div>' +
    '</div>' +

    '<div class="card pad lit stack">' +
      '<div class="sec-head"><div class="eyebrow gold">03</div><h3 class="display">How many questions?</h3>' +
        '<span class="badge ' + (ok ? 'ok' : 'no') + '">' + avail + ' available</span></div>' +
      '<div class="seg" style="flex-wrap:wrap">' + nBtns + '</div>' +
    '</div>' +

    (ok ? '' : '<div class="warnbox"><strong>' +
      (avail ? 'Only ' + avail + ' questions match.</strong> Add themes, or drop to a smaller round.'
             : 'Nothing matches.</strong> Widen the themes or the difficulty.') + '</div>') +

    '<p class="help">Ten seconds a question. You mark your own answer — there is no host to argue with. Nothing here touches your party game: solo never uses up a question and never lands in your game history.</p>' +

    '<div class="btn-row end">' +
      '<button class="btn ghost" data-act="go" data-to="home">Cancel</button>' +
      '<button class="btn gold lg" data-act="soloStart"' + (ok ? '' : ' disabled') + '>Start</button>' +
    '</div>' +
  '</div>';
};

/* The bar across the top of both play screens. It carries the way out and the
   running tally, and it sits in the same place on the question and on the
   answer so neither ever has to be hunted for.

   The tally is correct-over-ANSWERED, not correct-over-total: 7/12, then 7/13
   if you miss the next one, then 8/14 if you get it. s.i is the number already
   marked, which is exactly the denominator wanted. */
function soloTop(){
  const s = S.solo;

SCREENS.soloDone = function(){
  const s = S.solo;
  /* Score against what you ANSWERED, not what you set out to answer. Ending a
     50 early and being shown 6/50 would read as a hammering rather than as six
     out of the six you actually played. On a full run the two are the same. */
  const n = s.i, planned = s.qs.length, early = n < planned;
  const pct = n ? Math.round(s.got / n * 100) : 0;
  const verdict = !n           ? 'Nothing answered — no harm done.'
                : pct >= 90 ? 'Bar-quiz dangerous.'
                : pct >= 70 ? 'Comfortably above the room.'
                : pct >= 50 ? 'Respectable. The other half is why you practise.'
                : pct >= 30 ? 'Plenty left in the bank.'
                : 'Everyone starts here.';
  return '<div class="stack lg" style="padding-top:12px">' +
    '<div class="winner">' +
      '<div class="crown">' + ICON.trophy + '</div>' +
      '<div class="eyebrow gold">Solo result</div>' +
      '<div class="name num">' + s.got + ' / ' + n + '</div>' +
      '<p class="muted"><strong>' + pct + '%</strong> — ' + verdict + '</p>' +
      (early ? '<p class="help">Ended early — ' + n + ' of ' + planned + ' asked.</p>' : '') +
    '</div>' +
    '<div class="btn-row center">' +
      '<button class="btn ghost" data-act="go" data-to="home">Home</button>' +
      '<button class="btn" data-act="go" data-to="soloSetup">Change setup</button>' +
      '<button class="btn gold lg" data-act="soloAgain">Play again</button>' +
    '</div>' +
  '</div>';
};

S.tmp.bankFilter = { theme:'', type:'', diff:'', q:'' };

/* Row cap for the bank table. Now that the list is sorted by theme, a cap that
   bites lops off whole themes from the end of the alphabet rather than a random
   tail, so keep it well clear of a normal bank. */
const BANK_ROW_CAP = 2000;
SCREENS.bank = function(){
  const f = S.tmp.bankFilter;
  const rows = S.bank.filter(q =>
    (!f.theme || q.theme === f.theme) &&
    (!f.type  || q.type === f.type) &&
    (!f.diff  || q.difficulty === f.diff) &&
    (!f.q     || (q.question + ' ' + q.answer).toLowerCase().indexOf(f.q.toLowerCase()) > -1)
  );
  /* theme A-Z, then easy → medium → hard (not alphabetical, which would read
     easy/hard/medium), then the question A-Z. */
  const dRank = (q) => { const i = DIFFS.indexOf(q.difficulty); return i < 0 ? DIFFS.length : i; };
  const coll = new Intl.Collator(undefined, { sensitivity:'base', numeric:true });
  /* flags last — 250-odd of them would otherwise fill the first screen */
  rows.sort((a, b) =>
    ((a.type === 'flag') - (b.type === 'flag')) ||
    ((a.type === 'dish') - (b.type === 'dish')) ||
    coll.compare(a.theme, b.theme) ||
    dRank(a) - dRank(b) ||
    coll.compare(a.question, b.question));
  const body = rows.slice(0, BANK_ROW_CAP).map(q =>
    '<tr><td style="max-width:380px"><div style="color:var(--ink);font-weight:600">' + esc(q.question) + '</div>' +
      (q.notes ? '<div class="help" style="margin-top:4px">' + esc(q.notes) + '</div>' : '') + '</td>' +
    /* A Say-Same row has no fixed answer — one is drawn fresh each time it is
       played — so the pool it draws from goes here instead of a blank cell. */
    '<td style="color:var(--gold);font-weight:600">' +
      (q.type === 'saysame' ? esc((q.pool || []).join(' · '))
       /* a host's own map shows its picture; a built-in one says which map */
       : q.type === 'map' ? (q.img ? '<img class="bank-thumb" src="' + esc(q.img) + '" alt="">'
                                   : '<span class="dim" style="font-weight:500">' + (mapSpec(q) ? MAP_VIEW_NAME[mapSpec(q).view] + ' map' : '') + '</span>')
       : q.type === 'flag' ? (FLAG_KEYS.has(q.flag) ? '<img class="bank-thumb bank-flag" src="' + flagSrc(q) + '" alt="" loading="lazy">' : '')
       : q.type === 'dish' ? '<span class="dim" style="font-weight:500">' + esc((q.ings || []).map(t => splitIng(t)[1]).join(' · ')) + '</span>'
       : esc(q.answer)) + '</td>' +
    '<td>' + esc(q.theme) + '</td>' +
    '<td>' + (q.type === 'closest' ? '<span class="badge gold">Closest</span>'
            : q.type === 'auction' ? '<span class="badge a">Auction</span>'
            : q.type === 'saysame' ? '<span class="badge b">Say-Same</span>'
            : q.type === 'map'     ? '<span class="badge ok">Map</span>'
            : q.type === 'flag'    ? '<span class="badge ok">Flag</span>'
            : q.type === 'dish'    ? '<span class="badge ok">' + dishKind(q) + '</span>'
            : '<span class="badge line">Standard</span>') + '</td>' +
    '<td>' + (q.type === 'dish' ? esc(DISH_LEVELS[q.level] || '') : q.type === 'flag' ? esc(FLAG_LEVELS[q.level] || '') : q.type === 'map' ? esc(MAP_LEVELS[q.level] || '') : esc(Cap(q.difficulty))) + '</td>' +
    '<td>' + (q.use_with ? '<code style="font-size:11px;color:var(--a)">' + esc(q.use_with) + '</code>' : '<span class="dim">—</span>') + '</td>' +
    '<td>' + (S.used.has(q.id) ? '<span class="badge no">played</span>' : '') + '</td>' +
    '<td><button class="btn sm ghost danger" data-act="qDel" data-id="' + q.id + '">Del</button></td></tr>').join('');

  /* The VALUE stays lower-case — it is matched against q.type / q.difficulty.
     Only the label the host reads is capitalised. */

      '<div class="eyebrow">Import your Excel / CSV</div>' +

        '<button class="btn" data-act="bankTemplate">Download CSV template</button>' +

        /* Cap() alone turns 'saysame' into "Saysame" — a real label, not a
           capitalised value, for the one type whose name is not one word. */
        '<label class="fld" style="flex:1;min-width:120px">Type<select data-act="bf" data-k="type">' +
