      (rows.length ? '<div class="tbl-wrap"><table><thead><tr><th>Question</th><th>Answer</th><th>Theme</th><th>Type</th><th>Diff</th><th>Pair ticker</th><th></th><th></th></tr></thead><tbody>' + body + '</tbody></table></div>'

/* ---------- CSV / XLSX ---------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  const delim = (text.split('\n')[0].split('\t').length > text.split('\n')[0].split(',').length) ? '\t' : ',';
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else {
      if(c === '"') q = true;
      else if(c === delim){ row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if(c === '\r'){ /* skip */ }
      else cell += c;
    }
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
function rowsToQuestions(rows){
  if(!rows.length) throw new Error('Empty file.');
  const head = rows[0].map(norm);
  const find = (...names) => { for(const n of names){ const i = head.indexOf(n); if(i > -1) return i; } return -1; };
  const iQ = find('question','questions','q');
  const iA = find('answer','answers','a');
  if(iQ < 0 || iA < 0) throw new Error('Could not find a "question" and an "answer" column in the header row.');
  const iN = find('notes','note','info');
  const iT = find('theme','topic','category');
  const iY = find('type','typeofgame','gametype','typeofquestion');
  const iD = find('difficulty','diff','level');
  const iU = find('usequestionwith','usewith','pair','ticker','pairing','group');
  const iP = find('pool','answers','options','possibleanswers','wordlist');

  const out = [];
  for(let r = 1; r < rows.length; r++){
    const row = rows[r];
    const question = String(row[iQ] || '').trim();
    const rawType = norm(iY > -1 ? row[iY] : '');
    /* A map is a picture, and a spreadsheet cannot carry one — maps travel in
       the JSON backup. Skip the row rather than let "guessthemap" fall
       through to the "guess" test below and arrive as a Closest question. */
    if(/map/.test(rawType)) continue;
    const type = /saysame|dontsay|donotsay|matchhost|notsame/.test(rawType) ? 'saysame'
               : /auct|bid|nameas?many/.test(rawType) ? 'auction'
               : /clos|estim|numb|guess|mini/.test(rawType) ? 'closest'
               : 'standard';

    /* Say-Same has no single answer — it has a pool, split on newlines,
       semicolons or pipes inside that one cell — so it is gated on the pool
       instead of the answer column, which stays required for the other three. */
    let pool;
    if(type === 'saysame'){
      pool = String(iP > -1 ? row[iP] : '').split(/[\n;|]/).map(s => s.trim()).filter(Boolean);
      pool = [...new Set(pool)];
      if(!question || pool.length < 2) continue;
    } else {
      if(!question || !String(row[iA] || '').trim()) continue;
    }
    const answer = type === 'saysame' ? '' : String(row[iA] || '').trim();

    let d = norm(iD > -1 ? row[iD] : '');
    if(/^(1|e|easy|low)/.test(d)) d = 'easy';
    else if(/^(3|h|hard|difficult|high)/.test(d)) d = 'hard';
    else d = 'medium';
    /* Auction and Say-Same have no theme by design, so an empty cell stays
       empty rather than being filed under "General" and pushed into THEMES. */
    let theme = String(iT > -1 ? row[iT] : '').trim() || (type === 'auction' || type === 'saysame' ? '' : 'General');
    if(theme){
      const known = THEMES.find(t => norm(t) === norm(theme));
      if(known) theme = known; else if(THEMES.indexOf(theme) < 0) THEMES.push(theme);
    }
    const rec = {
      id:hash(question), question, answer,
      notes:String(iN > -1 ? row[iN] : '').trim(),
      theme, type, difficulty:d,
      use_with:String(iU > -1 ? row[iU] : '').trim(),
      src:'import'
    };
    if(pool) rec.pool = pool;
    out.push(rec);
  }
  if(!out.length) throw new Error('No usable rows found.');
  return out;
}
function mergeBank(list){
  const byId = {}; S.bank.forEach(q => byId[q.id] = q);
  let added = 0, dup = 0;
  list.forEach(q => { if(byId[q.id]) { dup++; Object.assign(byId[q.id], q); } else { byId[q.id] = q; added++; } });
  S.bank = Object.values(byId);
  saveBank();
  toast(added + ' added, ' + dup + ' updated. Bank now holds ' + S.bank.length + '.', 4200);
  render();
}
function importFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext === 'xlsx' || ext === 'xls') return importXLSX(file);
  const fr = new FileReader();
  fr.onload = () => { try{ mergeBank(rowsToQuestions(parseCSV(fr.result))); } catch(e){ toast('Import failed: ' + e.message, 6000); } };
  fr.readAsText(file);
}
function importXLSX(file){
  const run = () => {
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const wb = XLSX.read(new Uint8Array(fr.result), { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:'' });
        mergeBank(rowsToQuestions(rows));
      }catch(e){ toast('Import failed: ' + e.message, 6000); }
    };
    fr.readAsArrayBuffer(file);
  };
  if(window.XLSX) return run();
  toast('Loading the spreadsheet reader…');
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.onload = run;
  s.onerror = () => toast('No internet — save the file as CSV in Excel and import that instead.', 7000);
  document.head.appendChild(s);
}
function download(name, text, mime){
  const b = new Blob([text], { type:(mime || 'text/plain') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
const csvCell = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
function bankToCSV(list){
  const head = ['question','answer','notes','theme','type','difficulty','use_question_with','pool'];
  /* maps are pictures — they go in the JSON backup, not a spreadsheet */
  return head.join(',') + '\n' + list.filter(q => q.type !== 'map' && q.type !== 'flag' && q.type !== 'dish').map(q =>
    [q.question, q.answer, q.notes, q.theme, q.type, q.difficulty, q.use_with, (q.pool || []).join(' | ')]
      .map(csvCell).join(',')).join('\n');
}

AFTER.settings = function(){
  const r = el('restoreIn');
  if(r) r.addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const d = JSON.parse(fr.result);
        if(d.bank){
          S.bank = d.bank;
          /* a backup taken before Guess the Map existed would otherwise take
             the built-in maps away for good — this browser has already seen
             this seed version, so the boot merge would never put them back */
          const have = new Set(S.bank.map(q => q.id)), killed = DB.get(DB.k.killed, []);
          buildSeedBank().forEach(q => { if(q.type === 'map' && !have.has(q.id) && killed.indexOf(q.id) < 0) S.bank.push(q); });
          saveBank();
        }
        if(d.history) { S.history = d.history; saveHistory(); }
        if(d.used) { S.used = new Set(d.used); saveUsed(); }
        if(d.settings) { S.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings); saveSettings(); }
        toast('Backup restored.'); render();
      }catch(err){ toast('That file could not be read.'); }
    };
    fr.readAsText(f);
  });
};

/* Start a timer only on a genuine navigation. A plain re-render (arming a
   lifeline, closing a modal) must not reset the clock. */
function armTimer(key, secs, onEnd){
  if(S.tmp.tKey === key){ Timer.paint(); return; }
  S.tmp.tKey = key;

}
function markUsed(q){ if(q){ S.used.add(q.id); saveUsed(); } }

/* The single gate every mini-game goes through. Called when a round has just
   finished and when a mini-game has just finished, so two scheduled against
   the same round run one after the other before the next round starts. */
/* What the button at the end of a mini-game will actually do next — the
   next mini-game owed, the next standard round, the Battle, or the end. */
function afterMiniLabel(cur){
  const g = G();
  const owed = (g.plan || []).filter(p => p.after === g.r && !g.done[p.key] && p.key !== cur);
  if(owed.length) return 'Next — ' + MINI_GAMES[owed[0].key].name;
  if(g.r + 1 < g.rounds.length) return 'Back to the standard rounds';
  if(g.hasBattle && !g.done.battle && cur !== 'battle') return 'Next — ' + MINI_GAMES.battle.name;
  return 'See the final scores';
}

/* ---------- mini ---------- */
/* ---------- moves that live in the engine ----------
   The whole night plays through QMB.play (engine/core.js) — the standard
   rounds, every mini-game, the Battle, sudden death and the order between them:
   it changes the game and says what the screen should do. This carries
   that out — the same list Party mode will carry out on the TV. */
function run(action){ applyFx(QMB.play(G(), action, { deal:DEAL, settings:S.settings })); }
function applyFx(fx){
  (fx || []).forEach(f => {
    if(f.timer === 'stop'){ Timer.stop(); clearInterval(S.tmp.dishIv); }
    else if(f.timer === 'pause') Timer.pause();
    else if(f.timer === 'resume') Timer.resumeT();
    if(f.used) markUsed(f.used);
    if(f.lifeline) openLifeline(f.lifeline);
    if(f.host) Host.say(f.host, f.vars);
    if(f.shake) shake();
    if(f.sound && Snd[f.sound]) Snd[f.sound]();
    if(f.toast) toast(f.toast, f.ms);
    if(f.go) go(f.go);
    if(f.render) render();
    if(f.finalize) finalize();
  });
}

  const g = G();

const Host = {
  q:[], t:null, flushT:null,
  vars(extra){
    const g = G(), o = Object.assign({}, extra || {});
    if(!g) return o;
    const T = g.teams, cap = (i) => (T[i].captain || '').trim() || T[i].name;
    if(o.t != null){ o.team = T[o.t].name; o.other = T[1 - o.t].name; o.captain = cap(o.t); o.othercap = cap(1 - o.t); }
    else { o.team = o.team || T[0].name; o.other = o.other || T[1].name; o.captain = o.captain || cap(0); o.othercap = o.othercap || cap(1); }
    const d = T[0].score - T[1].score;
    o.leader = T[d >= 0 ? 0 : 1].name; o.trailer = T[d >= 0 ? 1 : 0].name; o.gap = Math.abs(d);
    return o;
  },
  line(moment, v){
    const pool = HOST_LINES[moment]; if(!pool || !pool.length) return '';
    const g = G(), used = g ? (g.hostUsed = g.hostUsed || {}) : (S.tmp.hostUsed = S.tmp.hostUsed || {});
    const seen = used[moment] = used[moment] || [];
    let free = pool.map((_, i) => i).filter(i => seen.indexOf(i) < 0);
    if(!free.length){ seen.length = 0; free = pool.map((_, i) => i); }
    const i = free[Math.floor(Math.random() * free.length)];
    seen.push(i);
    return pool[i].replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? String(v[k]) : '');
  },
  say(moments, extra){
    if(!S.settings.hostOn) return;
    const v = this.vars(extra);
    [].concat(moments).forEach(m => { const l = this.line(m, v); if(l) this.q.push(l); });
    clearTimeout(this.flushT);
    this.flushT = setTimeout(() => this.flush(), 30);
  },
  /* say it once per game — keyed, so a re-render of the same screen stays quiet */
  once(key, moments, extra){
    const g = G(); if(!g) return false;
    g.hostOnce = g.hostOnce || {};
    if(g.hostOnce[key]) return false;
    g.hostOnce[key] = true;
    this.say(moments, extra);
    return true;
  },
  flush(){
    const text = this.q.join(' '); this.q = [];
    if(!text) return;
    this.bubble(text);
  },
  bubble(text){
    let b = el('hostBubble');
    if(!b){
      b = document.createElement('div'); b.id = 'hostBubble'; b.setAttribute('role', 'status');
      b.innerHTML = '<img alt="" src="' + MASCOT + '"><div class="hb-text"></div>';
      document.body.appendChild(b);
    }
    b.querySelector('.hb-text').textContent = text;
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    clearTimeout(this.t);
    this.t = setTimeout(() => b.classList.remove('on'), 2800 + text.length * 60);
  },
  hush(){
    this.q = []; clearTimeout(this.flushT);
    const b = el('hostBubble'); if(b) b.classList.remove('on');
  },
  test(){
    if(!S.settings.hostOn) return;
    S.tmp.hostUsed = {};
    const v = { team:'Team A', other:'Team B', captain:'Captain' };
    const l = this.line('start', v);
    this.q.push(l); this.flush();
  }
};

/* the scores count up, and a change of leader gets a banner and a line */
function hudFx(){
  const g = G();
  if(!g || el('hud').hidden){ return; }
  if(S.tmp.hudFor !== g.id){ S.tmp.hudFor = g.id; S.tmp.hudSc = g.teams.map(t => t.score); }
  const was = S.tmp.hudSc || [0, 0];
  g.teams.forEach((t, i) => {
    const box = $('#hud .hud-team.' + (i ? 'b' : 'a') + ' .sc');
    if(!box || t.score === was[i]) return;
    countUp(box, was[i], t.score);
  });
  S.tmp.hudSc = g.teams.map(t => t.score);
  const d = g.teams[0].score - g.teams[1].score;
  const lead = d > 0 ? 0 : d < 0 ? 1 : null;
  if(lead != null){
    if(g.hostLeader != null && g.hostLeader !== lead){ leadBanner(lead); Host.say('lead'); }
    g.hostLeader = lead;
  }
}
function countUp(node, from, to){
  const t0 = performance.now(), dur = 650;
  node.classList.remove('pop'); void node.offsetWidth; node.classList.add('pop');
  node.textContent = from;
  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    node.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    if(k < 1 && node.isConnected) requestAnimationFrame(step);
  })(t0);
}
function leadBanner(i){
  const g = G();
  const b = document.createElement('div');
  b.className = 'lead-banner ' + (i ? 'b' : 'a');
  b.innerHTML = '<span>Lead change</span><b>' + esc(g.teams[i].name) + '</b>';
  document.body.appendChild(b);
  Snd.whoosh();
  setTimeout(() => b.remove(), 2300);
}
function shake(){
  const a = el('app');
  a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
  setTimeout(() => a.classList.remove('shake'), 700);
}
function drumOnce(key){
  if(S.tmp.drumKey === key) return;
  S.tmp.drumKey = key;
  Snd.drumroll();
}

/* ---- where he speaks — added on top of each screen's own AFTER ---- */
function afterAlso(screen, fn){
  const prev = AFTER[screen];
  AFTER[screen] = function(){ if(prev) prev(); fn(); };
}
/* the very first thing on the night gets the welcome in front of it */
function opener(){ const g = G(); if(g.hostHello) return []; g.hostHello = true; return ['start']; }

afterAlso('roundIntro', () => {
  const g = G(), rd = curRound(), first = seatTeam(rd, 0);
  if(g.hostOnce && g.hostOnce['r' + g.r]) return;
  Host.once('r' + g.r, opener().concat(['round']), { t:first, theme:rd.theme, n:rd.n, N:g.rounds.length });
});
[['miniIntro', 'closest'], ['auctionIntro', 'auction'], ['sayIntro', 'saysame'], ['mapIntro', 'map'],
 ['flagIntro', 'flag'], ['dishIntro', 'dish'], ['battleIntro', 'battle']].forEach(([scr, key]) =>
  afterAlso(scr, () => { const g = G(); if(!(g.hostOnce && g.hostOnce['mi:' + key])) Host.once('mi:' + key, opener().concat(['mini_' + key])); }));

/* a mini-game's result, once the points are actually on the board */
[['miniSummary', g => g.mini], ['auctionResult', g => g.auction], ['saySummary', g => g.saySame],
 ['mapSummary', g => g.mapGame], ['flagSummary', g => g.flagGame], ['dishSummary', g => g.dishGame],
 ['battleSummary', g => g.battle]].forEach(([scr, get]) =>
  afterAlso(scr, () => {
    const g = G(), m = get(g);
    if(!m || !m.award) return;
    const w = m.award[0] > m.award[1] ? 0 : m.award[1] > m.award[0] ? 1 : null;
    if(w == null) return;
    if(Host.once('mw:' + scr, 'miniwin', { t:w, pts:Math.max(m.award[0], m.award[1]) })) confetti();
  }));

afterAlso('roundScore', () => {
  const g = G(), d = Math.abs(g.teams[0].score - g.teams[1].score);
  const k = 'rs' + g.r;
  if(g.hostOnce && g.hostOnce[k]) return;
  if(d >= 5) Host.once(k, 'big');
  else if(d <= 1) Host.once(k, 'close');
});
afterAlso('sudden', () => { const g = G(); if(!g.sdReady) jingleOnce('sudden'); Host.once('sd' + (g.sdRounds || 1), 'sudden'); });
afterAlso('final', () => { const g = G(); Host.once('final', g.winner == null ? 'finaltie' : 'final'); });

/* a drumroll as the answer comes up for the room */
afterAlso('answer', () => { const g = G(); if(!NOHOST()) drumOnce('a' + g.r + '-' + g.seat); });
afterAlso('reveal', () => { const g = G(); if(NOHOST()) drumOnce('v' + g.r + '-' + g.seat); });
afterAlso('mapJudge', () => { const s = G().mapGame; drumOnce('m' + s.i); });
afterAlso('flagJudge', () => { const s = G().flagGame; drumOnce('f' + s.i); });

  /* A phone photo is 3–12 MB and the whole bank lives in ~5 MB of browser
     storage, so the picture is redrawn at most 1400px on its long side and
     re-encoded (WebP where the browser can write it, JPEG where it cannot)
     before it goes anywhere near the bank. */
  qMapImg(e){
    const f = e.files && e.files[0];
    const prev = el('nmapPrev');
    S.tmp.newMapImg = null;
    if(!f) { if(prev) prev.innerHTML = ''; return; }
    if(!/^image\//.test(f.type)) return toast('That is not a picture.');
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const MAX = 1400, k = Math.min(1, MAX / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        let url = c.toDataURL('image/webp', 0.82);
        if(url.indexOf('data:image/webp') !== 0) url = c.toDataURL('image/jpeg', 0.84);
        S.tmp.newMapImg = url;
        const kb = Math.round(url.length * 0.75 / 1024);
        if(prev) prev.innerHTML = '<img src="' + url + '" alt=""><span class="help">' + c.width + '×' + c.height + ' · ' + kb + ' KB</span>';
      };
      im.onerror = () => toast('Could not read that picture.');
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  },

  qSave(){
    const type = el('ny').value;
    const question = el('nq').value.trim();
    if(!question) return toast('The question is required.');

    let answer = '', notes = '', theme = '', difficulty = '', use_with = '', pool, img;

    if(type === 'map'){
      img = S.tmp.newMapImg;
      if(!img) return toast('Add the map picture first.');
      notes = el('nn').value.trim();
    } else if(type === 'auction'){
      answer = 'Host counts';
      notes  = el('nnAuc').value.trim();
    } else if(type === 'saysame'){
      const lines = el('nsayPool').value.split('\n').map(s => s.trim()).filter(Boolean);
      pool = [...new Set(lines)];                     // dedupe — a repeated line buys no real variety
      if(pool.length < 2) return toast('At least two possible answers — one per line.', 3600);
    } else {
      notes = el('nn').value.trim();
      difficulty = el('nd').value;
      if(type === 'closest'){
        const raw = el('naNum').value.trim();
        const n = Number(raw.replace(/[,\s]/g, ''));
        if(!raw || !isFinite(n)) return toast('Closest To Wins needs a number as the answer.', 3600);
        answer = String(n);
      } else {
        answer = el('na').value.trim();
        if(!answer) return toast('The answer is required.');
        use_with = el('nu').value.trim();
      }
      /* theme, including a brand new custom one */
      if(el('nt').value === '__new__'){
        const name = (el('ntNew').value || '').trim();
        if(!name) return toast('Name the custom theme, or pick an existing one.', 3600);
        const match = THEMES.find(t => t.toLowerCase() === name.toLowerCase());
        if(match) theme = match;                       // typed an existing one — reuse it
        else if(customThemes().length >= MAX_CUSTOM_THEMES)
          return toast(MAX_CUSTOM_THEMES + ' custom themes is the limit. Clear one out to free a slot.', 4200);
        else { THEMES.push(name); theme = name; }
      } else theme = el('nt').value;
      /* A standard or Closest question with no theme is unreachable — no chip
         exists for it, so no round can ever draw it. Refuse rather than file
         an orphan in the bank. (Only auction questions are themeless.) */
      if(!theme || THEMES.indexOf(theme) < 0) return toast('Pick a theme for this question.');
    }

    if(S.bank.some(x => x.id === hash(question)))
      return toast('That question is already in the bank.', 3600);

    const rec = { id:hash(question), question, answer, notes, theme, type, difficulty, use_with, src:'manual' };
    if(pool) rec.pool = pool;
    if(img){
      rec.img = img;
      /* Storage that silently refuses the write would leave the map on screen
         and gone on the next open. Try it first; if it does not fit, say so. */
      try{ localStorage.setItem(DB.k.bank, JSON.stringify(S.bank.concat([rec]))); }
      catch(err){ return toast('Not enough room on this device for another picture — delete a map or two first.', 5200); }
    }
    S.bank.push(rec);
    saveBank(); closeModal();
    S.tmp.newMapImg = null;
    toast('Added' + (pool ? ' — ' + pool.length + ' possible answers' : img ? ' — your map is in the bank' : theme && BUILT_IN_THEMES.indexOf(theme) < 0 ? ' under ' + theme : '') + '.');
    render();
  },

function numFrom(v){
  if(v == null) return null;
  const s = String(v).replace(/[\s,'_]/g, '').replace(/[^0-9.\-]/g, '');
  if(!s || isNaN(Number(s))) return null;
  return Number(s);
}

/* ==========================================================================
   25. EVENT WIRING
   ========================================================================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
  const fn = ACT[t.dataset.act];
  if(fn){ e.preventDefault(); Snd.resume(); fn(t); }
});
document.addEventListener('input', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const fn = ACT[t.dataset.act];
  if(fn && ['tf','setNum','vol','bf','calc','qType','qThemeSel'].indexOf(t.dataset.act) > -1) fn(t);
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  if(['setNum','bf','qType','qThemeSel','qMapImg'].indexOf(t.dataset.act) > -1) ACT[t.dataset.act](t);
});
el('modal').addEventListener('click', e => {
  if(e.target.id !== 'modal') return;
  if(S.tmp.llModal) ACT.closeLL();   // a lifeline modal — put the clock back
  else closeModal();
});

document.addEventListener('keydown', e => {
  if(['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName) > -1) return;
  const k = e.key.toLowerCase();
  if(k === 'escape'){ if(el('mapzoom')) closeMapZoom(); else if(S.tmp.llModal) ACT.closeLL(); else closeModal(); return; }
  if(S.screen === 'reveal'){
    if(k === 'y'){ e.preventDefault(); ACT.judge({ dataset:{ v:'1' } }); }
    if(k === 'n'){ e.preventDefault(); ACT.judge({ dataset:{ v:'0' } }); }
  }
  if(S.screen === 'stealReveal'){
    if(k === 'y'){ e.preventDefault(); ACT.judgeSteal({ dataset:{ v:'1' } }); }
    if(k === 'n'){ e.preventDefault(); ACT.judgeSteal({ dataset:{ v:'0' } }); }
  }
  /* seven seconds is no time to be hunting for a button — Y/N works here too */
  if(S.screen === 'battleQ' && S.game && S.game.battle.shown){
    if(k === 'y'){ e.preventDefault(); ACT.battleMark({ dataset:{ v:'1' } }); }
    if(k === 'n'){ e.preventDefault(); ACT.battleMark({ dataset:{ v:'0' } }); }
  }
  if(k === ' ' && (S.screen === 'ask' || S.screen === 'steal' || S.screen === 'miniQ' || S.screen === 'battleQ')){ e.preventDefault(); Timer.toggle(); }
  if(k === 'enter'){
    const main = $('.btn.gold.lg') || $('.btn.gold');
    if(main){ e.preventDefault(); main.click(); }
  }
});

window.addEventListener('beforeunload', e => {
  if(S.game && S.screen !== 'final'){ e.preventDefault(); e.returnValue = ''; }
});

/* iOS Safari ignores user-scalable=no and honours touch-action only patchily,
   but it does fire these three and it does respect preventDefault on them.
   This is the belt to the stylesheet's braces. No other browser fires them,
   and a mouse never can, so a laptop is unaffected. */
['gesturestart','gesturechange','gestureend'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault(), { passive:false }));

/* ==========================================================================
   26. BOOT
   ========================================================================== */
/* The house defaults for sound moved — jingles on, 75%. Apply them once to a
   browser that is carrying settings saved under the old defaults, then never
   touch the host's choices again. */
if(!DB.get('qn.audiodefaults.v2', false)){
  S.settings.sound = true;
  S.settings.volume = 0.75;
  saveSettings();
  DB.set('qn.audiodefaults.v2', true);
}

render();
if(S.tmp.seedNews) setTimeout(() => {
  const n = S.tmp.seedNews, bits = [];
  if(n.added) bits.push(n.added + ' new built-in question' + (n.added === 1 ? '' : 's') + ' added');
  if(n.fixed) bits.push(n.fixed + ' corrected');
  if(n.retired) bits.push(n.retired + ' retired');
  toast(bits.join(', ') + ' in your bank.', 5000);
}, 900);

/* The theme plays ONCE, when the app is opened — not every time you land back
   on the home screen from Settings or from a finished game. No button, by
   design: it is the sound of the app starting up.

   Browsers refuse to make noise before the visitor has touched the page, so
   when the audio context comes up suspended the theme has to wait for a
   gesture. The trap is that on the home screen the host's first gesture is
   almost always "Start a new game" — which is how a startup sound ended up
   firing five seconds into the setup screen instead.

   So a gesture that lands on a CONTROL is treated as the host getting on with
   the night: it unlocks audio for the timers and the round jingles, and it
   cancels the opening theme outright rather than triggering it. Only an idle
   gesture — a tap on dead space, a scroll, a key — plays it, and only inside
   a short window after launch. Late is worse than never: a theme that starts
   ninety seconds in does not read as the app opening, it reads as a bug. */
(function openingTheme(){
  const GRACE = 12000;                 // after this, the moment has passed
  let armed = true;
  const disarm = () => {
    armed = false;
    window.removeEventListener('pointerdown', arm, true);
    window.removeEventListener('keydown', arm, true);
  };
  function arm(e){
    if(!armed) return;
    const t = e.target;
    const onControl = t && t.closest &&
      t.closest('button,a,input,select,textarea,label,[data-act]');
    disarm();                          // either way, this was the one chance
    Snd.resume();                      // and either way, audio is unlocked now
    if(onControl) return;              // deliberate press — unlock, stay quiet
    setTimeout(() => Snd.jingle(), 0); // let the gesture finish, then play
  }
  Snd.init();
  if(Snd.ctx && Snd.ctx.state === 'running'){ Snd.jingle(); return; }
  window.addEventListener('pointerdown', arm, true);
  window.addEventListener('keydown', arm, true);
  setTimeout(disarm, GRACE);
})();
</script>
</body>
