/* ---------- CSV / XLSX ---------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  const delim = (text.split('\n')[0].split('\t').length > text.split('\n')[0].split(',').length) ? '\t' : ',';
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else {
      if(c === '"') q = true;
      else if(c === delim){ row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if(c === '\r'){ /* skip */ }
      else cell += c;
    }
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
function rowsToQuestions(rows){
  if(!rows.length) throw new Error('Empty file.');
  const head = rows[0].map(norm);
  const find = (...names) => { for(const n of names){ const i = head.indexOf(n); if(i > -1) return i; } return -1; };
  const iQ = find('question','questions','q');
  const iA = find('answer','answers','a');
  if(iQ < 0 || iA < 0) throw new Error('Could not find a "question" and an "answer" column in the header row.');
  const iN = find('notes','note','info');
  const iT = find('theme','topic','category');
  const iY = find('type','typeofgame','gametype','typeofquestion');
  const iD = find('difficulty','diff','level');
  const iU = find('usequestionwith','usewith','pair','ticker','pairing','group');
  const iP = find('pool','answers','options','possibleanswers','wordlist');

  const out = [];
  for(let r = 1; r < rows.length; r++){
    const row = rows[r];
    const question = String(row[iQ] || '').trim();
    const rawType = norm(iY > -1 ? row[iY] : '');
    const type = /saysame|dontsay|donotsay|matchhost|notsame/.test(rawType) ? 'saysame'
               : /auct|bid|nameas?many/.test(rawType) ? 'auction'
               : /clos|estim|numb|guess|mini/.test(rawType) ? 'closest'
               : 'standard';

    /* Say-Same has no single answer — it has a pool, split on newlines,
       semicolons or pipes inside that one cell — so it is gated on the pool
       instead of the answer column, which stays required for the other three. */
    let pool;
    if(type === 'saysame'){
      pool = String(iP > -1 ? row[iP] : '').split(/[\n;|]/).map(s => s.trim()).filter(Boolean);
      pool = [...new Set(pool)];
      if(!question || pool.length < 2) continue;
    } else {
      if(!question || !String(row[iA] || '').trim()) continue;
    }
    const answer = type === 'saysame' ? '' : String(row[iA] || '').trim();

    let d = norm(iD > -1 ? row[iD] : '');
    if(/^(1|e|easy|low)/.test(d)) d = 'easy';
    else if(/^(3|h|hard|difficult|high)/.test(d)) d = 'hard';
    else d = 'medium';
    /* Auction and Say-Same have no theme by design, so an empty cell stays
       empty rather than being filed under "General" and pushed into THEMES. */
    let theme = String(iT > -1 ? row[iT] : '').trim() || (type === 'auction' || type === 'saysame' ? '' : 'General');
    if(theme){
      const known = THEMES.find(t => norm(t) === norm(theme));
      if(known) theme = known; else if(THEMES.indexOf(theme) < 0) THEMES.push(theme);
    }
    const rec = {
      id:hash(question), question, answer,
      notes:String(iN > -1 ? row[iN] : '').trim(),
      theme, type, difficulty:d,
      use_with:String(iU > -1 ? row[iU] : '').trim(),
      src:'import'
    };
    if(pool) rec.pool = pool;
    out.push(rec);
  }
  if(!out.length) throw new Error('No usable rows found.');
  return out;
}
function mergeBank(list){
  const byId = {}; S.bank.forEach(q => byId[q.id] = q);
  let added = 0, dup = 0;
  list.forEach(q => { if(byId[q.id]) { dup++; Object.assign(byId[q.id], q); } else { byId[q.id] = q; added++; } });
  S.bank = Object.values(byId);
  saveBank();
  toast(added + ' added, ' + dup + ' updated. Bank now holds ' + S.bank.length + '.', 4200);
  render();
}
function importFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext === 'xlsx' || ext === 'xls') return importXLSX(file);
  const fr = new FileReader();
  fr.onload = () => { try{ mergeBank(rowsToQuestions(parseCSV(fr.result))); } catch(e){ toast('Import failed: ' + e.message, 6000); } };
  fr.readAsText(file);
}
function importXLSX(file){
  const run = () => {
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const wb = XLSX.read(new Uint8Array(fr.result), { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:'' });
        mergeBank(rowsToQuestions(rows));
      }catch(e){ toast('Import failed: ' + e.message, 6000); }
    };
    fr.readAsArrayBuffer(file);
  };
  if(window.XLSX) return run();
  toast('Loading the spreadsheet reader…');
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.onload = run;
  s.onerror = () => toast('No internet — save the file as CSV in Excel and import that instead.', 7000);
  document.head.appendChild(s);
}
function download(name, text, mime){
  const b = new Blob([text], { type:(mime || 'text/plain') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
const csvCell = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
function bankToCSV(list){
  const head = ['question','answer','notes','theme','type','difficulty','use_question_with','pool'];
  return head.join(',') + '\n' + list.map(q =>
    [q.question, q.answer, q.notes, q.theme, q.type, q.difficulty, q.use_with, (q.pool || []).join(' | ')]
      .map(csvCell).join(',')).join('\n');
}

        '<label class="btn" style="cursor:pointer">Import a backup<input type="file" accept=".json" id="restoreIn" hidden></label>' +
      '</div>' +
    '</div>' +
  '</div>';
};
AFTER.settings = function(){
  const r = el('restoreIn');
  if(r) r.addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const d = JSON.parse(fr.result);
        if(d.bank) { S.bank = d.bank; saveBank(); }
        if(d.history) { S.history = d.history; saveHistory(); }
        if(d.used) { S.used = new Set(d.used); saveUsed(); }
        if(d.settings) { S.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings); saveSettings(); }
        toast('Backup restored.'); render();
      }catch(err){ toast('That file could not be read.'); }
    };
    fr.readAsText(f);
  });
};

/* ==========================================================================
   23. FLOW
   ========================================================================== */
function go(screen){
  Timer.stop();
  S.tmp.tKey = null;          // a real navigation always restarts the clock
  S.tmp.toTop = true;
  S.screen = screen;
  if(S.game) S.game.screen = screen;
  render();
}
/* Start a timer only on a genuine navigation. A plain re-render (arming a
   lifeline, closing a modal) must not reset the clock. */
function armTimer(key, secs, onEnd){
  if(S.tmp.tKey === key){ Timer.paint(); return; }
  S.tmp.tKey = key;
  Timer.start(secs, onEnd);
}
function markUsed(q){ if(q){ S.used.add(q.id); saveUsed(); } }

function beginRound(){
  const g = G();
  g.seat = 0;
  go('ask');
}
function afterSeat(){
  const g = G(), rd = curRound();
  if(g.seat === 0){ g.seat = 1; go('ask'); }
  else { rd.done = true; go('roundScore'); }
}
/* The single gate every mini-game goes through. Called when a round has just
   finished and when a mini-game has just finished, so two scheduled against
   the same round run one after the other before the next round starts. */
function runNextMini(){
  const g = G();
  const owed = minisAfter(g.r);
  if(!owed.length) return false;
  startMini(owed[0].key);
  return true;
}
function startMini(key){
  const g = G();
  if(key === 'closest'){ go('miniIntro'); return; }
  if(key === 'auction'){ buildAuction(); go('auctionIntro'); return; }
  if(key === 'saysame'){ go('sayIntro'); return; }
  if(key === 'battle'){
    g.battle = buildBattle();
    if(!g.battle){ g.done.battle = true; toast('Not enough spare questions left for the Battle.'); endGame(); return; }
    go('battleIntro'); return;
  }
}
function nextRound(){
  const g = G();
  if(runNextMini()) return;
  advanceRound();
}
function advanceRound(){
  const g = G();
  g.r = Math.min(g.r + 1, g.rounds.length);
  if(g.r < g.rounds.length){ g.seat = 0; go('roundIntro'); return; }
  /* The rounds are done. The Battle is the closer, and it was chosen in Setup
     rather than offered here — no pop-up, no asking. */
  if(g.hasBattle && !g.done.battle){ startMini('battle'); return; }
  endGame();
}

/* ---------- mini ---------- */
function miniFinish(){
  const g = G(), m = g.mini;
  /* Tied on legs → straight into an extra tie-breaker question. */
  if(m.wins[0] === m.wins[1]){
    if(m.spare && m.spare.length){
      const q = m.spare.shift();
      m.qs.push(q); markUsed(q);
      m.tieLegs++;
      toast('Tied after ' + (m.qs.length - 1) + ' legs — tie-breaker question.', 3600);
      go('miniQ');            // m.i already points at the new question
      return;
    }
    m.done = true;
    m.verdict = { winner:null, needsHost:true,
      note:'Tied on legs, and there are no spare Closest To questions left for another tie-breaker. Your call.' };
    go('miniSummary');
    return;
  }
  const winner = m.wins[0] > m.wins[1] ? 0 : 1;
  m.done = true;
  m.verdict = { winner, needsHost:false,
    note:m.tieLegs ? 'Settled by ' + (m.tieLegs === 1 ? 'a tie-breaker leg' : m.tieLegs + ' tie-breaker legs') + '.' : '' };
  awardMini(winner);
  go('miniSummary');
}
function awardMini(w){
  const g = G(), m = g.mini;
  if(m.awarded) return;
  m.awarded = true;
  if(w === 'split'){
    const half = Math.floor(g.miniPts / 2);
    g.teams[0].score += half; g.teams[1].score += half;
    m.award = [half, half];
    m.verdict.note = 'Split — ' + half + ' point' + (half > 1 ? 's' : '') + ' each.';
    m.verdict.winner = null;
  } else {
    g.teams[w].score += g.miniPts;
    m.award = [w === 0 ? g.miniPts : 0, w === 1 ? g.miniPts : 0];
    m.verdict.winner = w;
  }
  m.verdict.needsHost = false;
  Snd.point();
}

/* Same shape as miniFinish/awardMini above, one leg-selection difference: a
   spare here is a raw bank prompt with a `pool`, not yet an `answer` — it has
   to go through drawSaySame() at the moment it is actually pulled in, so a
   tie-breaker prompt's secret word is drawn exactly once, same as the rest. */
function saySameFinish(){
  const g = G(), s = g.saySame;
  if(s.wins[0] === s.wins[1]){
    if(s.spare && s.spare.length){
      const q = drawSaySame(s.spare.shift());
      s.qs.push(q); markUsed(q);
      s.tieLegs++;
      toast('Tied after ' + (s.qs.length - 1) + ' legs — tie-breaker prompt.', 3600);
      go('sayQ');
      return;
    }
    s.done = true;
    s.verdict = { winner:null, needsHost:true,
      note:'Tied on legs, and there are no spare prompts left for another tie-breaker. Your call.' };
    go('saySummary');
    return;
  }
  const winner = s.wins[0] > s.wins[1] ? 0 : 1;
  s.done = true;
  s.verdict = { winner, needsHost:false,
    note:s.tieLegs ? 'Settled by ' + (s.tieLegs === 1 ? 'a tie-breaker leg' : s.tieLegs + ' tie-breaker legs') + '.' : '' };
  awardSaySame(winner);
  go('saySummary');
}
function awardSaySame(w){
  const g = G(), s = g.saySame;
  if(s.awarded) return;
  s.awarded = true;
  if(w === 'split'){
    const half = Math.floor(g.miniPts / 2);
    g.teams[0].score += half; g.teams[1].score += half;
    s.award = [half, half];
    s.verdict.note = 'Split — ' + half + ' point' + (half > 1 ? 's' : '') + ' each.';
    s.verdict.winner = null;
  } else {
    g.teams[w].score += g.miniPts;
    s.award = [w === 0 ? g.miniPts : 0, w === 1 ? g.miniPts : 0];
    s.verdict.winner = w;
  }
  s.verdict.needsHost = false;
  Snd.point();
}

/* ---------- end of game ---------- */
function endGame(){
  const g = G();
  if(g.teams[0].score === g.teams[1].score){ startSudden(); return; }
  g.winner = g.teams[0].score > g.teams[1].score ? 0 : 1;
  finalize();
}
/* Prefer the themes chosen for tonight; widen only when they run dry. */
function suddenPool(){
  const g = G();
  const inGame = new Set();
  g.rounds.forEach(r => r.q.forEach(q => inGame.add(q.id)));
  g.mini.qs.forEach(q => inGame.add(q.id));
  (g.sdUsed || []).forEach(id => inGame.add(id));
  const themes = g.cfg.themes || [];
  const free = (q) => q.type === 'standard' && !inGame.has(q.id);
  let pool = S.bank.filter(q => free(q) && themes.indexOf(q.theme) > -1 && isFresh(q));
  if(!pool.length) pool = S.bank.filter(q => free(q) && themes.indexOf(q.theme) > -1);
  if(!pool.length) pool = S.bank.filter(q => free(q) && isFresh(q));
  if(!pool.length) pool = S.bank.filter(free);
  return pool;
}
function startSudden(newLeg){
  const g = G();
  const pool = suddenPool();
  if(!pool.length){
    if(newLeg === false) return toast('No spare questions left to swap in.');
    g.winner = null; finalize(); return;
  }
  const q = shuffle(pool)[0];
  g.sdUsed = (g.sdUsed || []).concat([q.id]);
  if(newLeg !== false) g.sdRounds = (g.sdRounds || 0) + 1;
  const offTheme = (g.cfg.themes || []).indexOf(q.theme) < 0;
  g.sd = { q, n:g.sdRounds, shown:false, offTheme };
  markUsed(q);
  if(offTheme) toast('Tonight themes are out of spare questions — pulling from ' + q.theme + '.', 4200);
  go('sudden');
}
function finalize(){
  const g = G();
  const rec = {
    id:g.id, date:g.startedAt, rounds:g.rounds.length,
    difficulty:g.cfg.difficulty, themes:g.rounds.map(r => r.theme).filter((v, i, a) => a.indexOf(v) === i),
    teams:g.teams.map(t => ({ name:t.name, captain:t.captain, players:t.players, score:t.score })),
    winner:g.winner,
    mini:{ wins:g.mini.wins, award:g.mini.award || [0, 0] },
    battle:g.battle && g.battle.done ? { score:g.battle.score, award:g.battle.award, tb:g.battle.tbRounds } : null,
    sudden:g.sdRounds || 0
  };
  if(!S.history.some(h => h.id === rec.id)){ S.history.push(rec); saveHistory(); }
  go('final');
}

  soloN(e){ S.solo.n = +e.dataset.n; Snd.soft(); render(); },

  soloEnd(){ Timer.stop(); Snd.soft(); go(S.solo && S.solo.i ? 'soloDone' : 'soloSetup'); },

  },

  advToggle(){ S.tmp.advOpen = !S.tmp.advOpen; Snd.soft(); render(); },
  themeDiff(e){

    /* Pressing whatever is already lit hands the theme back to the house
       setting, so there is always a way out of an override — including out of

    else td[t] = d;

  },
  themeDiffReset(){ S.setup.themeDiff = {}; prunePicks(); Snd.soft(); render(); },

  pickOpen(){ prunePicks(); S.tmp.pickFilter = ''; openPicker(); },
  pickFilter(e){ S.tmp.pickFilter = e.dataset.t || ''; repaintPicker(); },
  pickToggle(e){

    else arr.push(id);

  miniPickClear(e){ S.setup[MINI_PICKS[e.dataset.k].store] = []; repaintPicker(); },
  pickThemeClear(e){ delete (S.setup.picks || {})[e.dataset.t]; repaintPicker(); },
  pickClearAll(){ S.setup.picks = {}; S.setup.pickClosest = []; S.setup.pickAuction = []; repaintPicker(); },
  pickClear(){ S.setup.picks = {}; S.setup.pickClosest = []; S.setup.pickAuction = []; render(); },
  pickDone(){ closeModal(); },
  setNum(e){ S.settings[e.dataset.k] = +e.value; saveSettings(); },
  toggle(e){ const k = e.dataset.k; S.settings[k] = !S.settings[k]; saveSettings(); render(); },
  vol(e){ S.settings.volume = (+e.value) / 100; saveSettings(); Snd.resume(); Snd.vol(S.settings.volume); Snd.soft(); },
  testAlarm(){ Snd.resume(); Snd.alarm(); },
  replayJingle(){ Snd.jingle(); },

  startGame(){
    const c = S.setup;
    if(!c.themes.length) return toast('Pick at least one theme.');
    c.teamA.name = (c.teamA.name || '').trim() || 'Team A';
    c.teamB.name = (c.teamB.name || '').trim() || 'Team B';
    const g = buildGame(c);
    if(g.rounds.length < c.rounds) toast('Only enough questions for ' + g.rounds.length + ' rounds — shortened.', 4500);
    if(!g.rounds.length) return toast('No usable questions. Widen the themes or difficulty.');
    S.game = g;
    g.rounds.forEach(r => r.q.forEach(markUsed));
    g.mini.qs.forEach(markUsed);
    g.saySame.qs.forEach(markUsed);
    Snd.resume();
    go('roundIntro');
  },

  /* ---- round ---- */
  armDbl(e){
    const i = +e.dataset.i, g = G(), rd = curRound();
    if(!g.teams[i].ll.dbl) return;
    rd.dbl[i] = !rd.dbl[i];
    Snd.soft();
    render();
  },
  beginRound(){
    const g = G(), rd = curRound();
    [0, 1].forEach(i => { if(rd.dbl[i]) g.teams[i].ll.dbl = false; });
    beginRound();
  },
  timerToggle(){ Timer.toggle(); },
  timerAdd(e){ Timer.add(+e.dataset.s); },
  timerSkip(){
    Timer.stop();
    /* On the auction this is the ONLY manual way to close a leg early now that
       "They are done" is gone, so it has to resolve rather than navigate. */
    if(S.screen === 'auctionRun') return auctionResolve();
    go(S.screen === 'steal'  ? 'stealReveal'
     : S.screen === 'miniQ'  ? 'miniEntry'
     : S.screen === 'sayQ'   ? 'sayJudge'
     : S.screen === 'soloQ'  ? 'soloA'      // solo has no steal and no host
     : 'reveal');
  },

  /* Walk the theme in bank order, one question per press, and do not offer the
     same one twice until the whole theme has been through.

     Two things used to break this. The pairing ticker was honoured, which left
     a pool of one or two; and the pool was recomputed from the live rounds each
     press, so the question you had just swapped AWAY from was instantly a
     candidate again. Between them the button ping-ponged over the same pair
     forever. The ticker is ignored here on purpose — it exists to match the two
     teams' questions when the round is built, and once the host is overriding
     by hand it is only getting in the way. */
  swapQ(){
    const g = G(), rd = curRound(), seat = g.seat;

    /* committed elsewhere: the other team's question this round, every other
       round, and the mini-game. The current slot is deliberately NOT excluded,
       so it can come back round at the end of the cycle. */
    const elsewhere = new Set();
    g.rounds.forEach((r, ri) => r.q.forEach((q, si) => { if(ri !== g.r || si !== seat) elsewhere.add(q.id); }));
    g.mini.qs.forEach(q => elsewhere.add(q.id));

    const list = S.bank.filter(q =>
      q.type === 'standard' && q.theme === rd.theme &&
      matchDiff(q, diffOf(g.cfg, rd.theme)) && !elsewhere.has(q.id));

    const none = () => toast('No other question left in ' + rd.theme + ' at this difficulty.', 4000);
    if(list.length < 2) return none();

    /* One list for the whole round, not one per team: a question the host has
       already skipped past on Team A should not come back on Team B either. */
    const cur = rd.q[seat];
    const seen = rd.swapSeen = rd.swapSeen || [];
    if(seen.indexOf(cur.id) < 0) seen.push(cur.id);

    let next = list.filter(q => seen.indexOf(q.id) < 0)[0];
    if(!next){                                    // whole theme exhausted — start again
      seen.length = 0; seen.push(cur.id);
      next = list.filter(q => q.id !== cur.id)[0];
    }
    if(!next) return none();

    seen.push(next.id);
    rd.q[seat] = next; markUsed(next);
    rd.strict = false;
    rd.picked = false;                 // no longer the pair the host chose by hand
    toast('New question.');
    go('ask');
  },

  useLL(e){

    if(!t.ll[key]) return;
    if(rd.dbl[i] && rd.llUsed[i].length >= 1) return toast('Double points is armed — one extra lifeline only.');

  },
  cdToggle(){ CD.toggle(); },

  judge(e){

  /* ---- mini ---- */
  miniStart(){ G().mini.i = 0; go('miniQ'); },
  /* Same escape hatch as "Swap this question" in a standard round: if the
     number doesn't suit the room, pull another. Prefers a theme this
     mini-game has not already used, to protect the one-per-theme spread. */
  miniSwap(){
    const g = G(), m = g.mini;
    const inPlay = new Set();
    g.rounds.forEach(r => r.q.forEach(q => inPlay.add(q.id)));
    m.qs.forEach(q => inPlay.add(q.id));
    (m.spare || []).forEach(q => inPlay.add(q.id));

    let pool = S.bank.filter(q => q.type === 'closest' && !inPlay.has(q.id) && isFresh(q));
    if(!pool.length) pool = S.bank.filter(q => q.type === 'closest' && !inPlay.has(q.id));
    if(!pool.length) return toast('No spare Closest To Wins question left in the bank.');

    const spent = new Set(m.qs.filter((q, i) => i !== m.i).map(q => q.theme));
    const offTheme = pool.filter(q => !spent.has(q.theme));
    const q = shuffle(offTheme.length ? offTheme : pool)[0];

    m.qs[m.i] = q; markUsed(q);
    toast('New number question — ' + q.theme + '.');
    go('miniQ');
  },
  toMiniEntry(){ Timer.stop(); go('miniEntry'); },
  calc(){
    const g = G(), m = g.mini, q = m.qs[m.i];
    const a = numFrom(el('gA').value), b = numFrom(el('gB').value);
    const out = el('calcOut');
    if(a == null || b == null){ out.innerHTML = 'Enter both to compare'; return; }
    const ans = Number(q.answer);
    const da = Math.abs(a - ans), db = Math.abs(b - ans);
    const w = da === db ? 'tie' : (da < db ? 0 : 1);
    out.innerHTML =
      '<div><div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)">Off by</div>' +
      '<div style="margin-top:6px"><span style="color:var(--a);font-weight:700">' + nf(Math.round(da)) + '</span>' +
      '<span class="dim"> vs </span><span style="color:var(--b);font-weight:700">' + nf(Math.round(db)) + '</span></div>' +
      '<div style="margin-top:8px">' + (w === 'tie' ? '<span class="badge line">Tie</span>' :
        '<span class="badge ' + (w === 0 ? 'a' : 'b') + '">' + esc(g.teams[w].name) + ' is closer</span>') + '</div></div>';
  },
  miniWin(e){
    const g = G(), m = g.mini, q = m.qs[m.i];
    const w = e.dataset.w === 'tie' ? 'tie' : +e.dataset.w;
    const a = el('gA') ? numFrom(el('gA').value) : null;
    const b = el('gB') ? numFrom(el('gB').value) : null;
    if(a != null && b != null){
      const ans = Number(q.answer);
      m.delta[0] += Math.abs(a - ans); m.delta[1] += Math.abs(b - ans);
      m.counted = true;
    }
    m.subs.push({ q, gA:a, gB:b, winner:w });
    if(w === 'tie'){ m.wins[0]++; m.wins[1]++; toast('Tie — a point each.'); }
    else { m.wins[w]++; Snd.correct(); toast(g.teams[w].name + ' takes leg ' + (m.i + 1) + '.'); }

function numFrom(v){
  if(v == null) return null;
  const s = String(v).replace(/[\s,'_]/g, '').replace(/[^0-9.\-]/g, '');
  if(!s || isNaN(Number(s))) return null;
  return Number(s);
}

/* ==========================================================================
   25. EVENT WIRING
   ========================================================================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
  const fn = ACT[t.dataset.act];
  if(fn){ e.preventDefault(); Snd.resume(); fn(t); }
});
document.addEventListener('input', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const fn = ACT[t.dataset.act];
  if(fn && ['tf','setNum','vol','bf','calc','qType','qThemeSel'].indexOf(t.dataset.act) > -1) fn(t);
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  if(['setNum','bf','qType','qThemeSel'].indexOf(t.dataset.act) > -1) ACT[t.dataset.act](t);
});
el('modal').addEventListener('click', e => {
  if(e.target.id !== 'modal') return;
  if(S.tmp.llModal) ACT.closeLL();   // a lifeline modal — put the clock back
  else closeModal();
});

document.addEventListener('keydown', e => {
  if(['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName) > -1) return;
  const k = e.key.toLowerCase();
  if(k === 'escape'){ if(S.tmp.llModal) ACT.closeLL(); else closeModal(); return; }
  if(S.screen === 'reveal'){
    if(k === 'y'){ e.preventDefault(); ACT.judge({ dataset:{ v:'1' } }); }
    if(k === 'n'){ e.preventDefault(); ACT.judge({ dataset:{ v:'0' } }); }
  }
  if(S.screen === 'stealReveal'){
    if(k === 'y'){ e.preventDefault(); ACT.judgeSteal({ dataset:{ v:'1' } }); }
    if(k === 'n'){ e.preventDefault(); ACT.judgeSteal({ dataset:{ v:'0' } }); }
  }
  /* seven seconds is no time to be hunting for a button — Y/N works here too */
  if(S.screen === 'battleQ' && S.game && S.game.battle.shown){
    if(k === 'y'){ e.preventDefault(); ACT.battleMark({ dataset:{ v:'1' } }); }
    if(k === 'n'){ e.preventDefault(); ACT.battleMark({ dataset:{ v:'0' } }); }
  }
  if(k === ' ' && (S.screen === 'ask' || S.screen === 'steal' || S.screen === 'miniQ' || S.screen === 'battleQ')){ e.preventDefault(); Timer.toggle(); }
  if(k === 'enter'){
    const main = $('.btn.gold.lg') || $('.btn.gold');
    if(main){ e.preventDefault(); main.click(); }
  }
});

window.addEventListener('beforeunload', e => {
  if(S.game && S.screen !== 'final'){ e.preventDefault(); e.returnValue = ''; }
});

/* iOS Safari ignores user-scalable=no and honours touch-action only patchily,
   but it does fire these three and it does respect preventDefault on them.
   This is the belt to the stylesheet's braces. No other browser fires them,
   and a mouse never can, so a laptop is unaffected. */
['gesturestart','gesturechange','gestureend'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault(), { passive:false }));

   on the home screen from Settings or from a finished game. No button, by
   design: it is the sound of the app starting up.

   Browsers refuse to make noise before the visitor has touched the page, so
   when the audio context comes up suspended the theme has to wait for a
   gesture. The trap is that on the home screen the host's first gesture is
   almost always "Start a new game" — which is how a startup sound ended up
   firing five seconds into the setup screen instead.

   So a gesture that lands on a CONTROL is treated as the host getting on with
   the night: it unlocks audio for the timers and the round jingles, and it
   cancels the opening theme outright rather than triggering it. Only an idle
   gesture — a tap on dead space, a scroll, a key — plays it, and only inside
   a short window after launch. Late is worse than never: a theme that starts
   ninety seconds in does not read as the app opening, it reads as a bug. */
(function openingTheme(){
  const GRACE = 12000;                 // after this, the moment has passed
  let armed = true;
  const disarm = () => {
    armed = false;
    window.removeEventListener('pointerdown', arm, true);
    window.removeEventListener('keydown', arm, true);
  };
  function arm(e){
    if(!armed) return;
    const t = e.target;
    const onControl = t && t.closest &&
      t.closest('button,a,input,select,textarea,label,[data-act]');
    disarm();                          // either way, this was the one chance
    Snd.resume();                      // and either way, audio is unlocked now
    if(onControl) return;              // deliberate press — unlock, stay quiet
    setTimeout(() => Snd.jingle(), 0); // let the gesture finish, then play
  }
  Snd.init();
  if(Snd.ctx && Snd.ctx.state === 'running'){ Snd.jingle(); return; }
  window.addEventListener('pointerdown', arm, true);
  window.addEventListener('keydown', arm, true);
  setTimeout(disarm, GRACE);
})();
</script>
</body>
</html>
