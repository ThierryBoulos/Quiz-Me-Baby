/* --------------------------------------------------------------------------
   BANK BOOTSTRAP — built-in questions vs. this browser's saved bank.

   The built-in bank above ships inside this HTML file. The first time the app
   runs in a browser it is copied into that browser's local storage, and from
   then on the saved copy is what the app reads.

   That means a newer version of this FILE would normally be invisible to a
   browser that already has a saved bank. SEED_VERSION fixes that: bump it
   whenever the built-in bank changes, and on next open any built-in questions
   this browser has never seen get merged in — without touching anything the
   host imported or wrote themselves, and without resurrecting ones they deleted.
   -------------------------------------------------------------------------- */
const SEED_VERSION = 14;   // bumped when the built-in bank changes
/* Seed prompts that shipped once and have since been retired outright — not
   corrected, removed. This is different from `killed`: `killed` is the HOST
   deleting a question, and the app must never bring it back. This is the
   CONTENT changing out from under a browser that never touched it — the seed
   list simply no longer has this prompt — and without an explicit retire
   list the row would sit there forever, since the merge below only adds and
   corrects, it never deletes what it does not recognise. Matched on the
   question text (equivalent to its id, easier to read here) and gated on
   `src:'seed'`, so anything the host built or imported on top of the same
   text is left alone. */
const RETIRED_SEED = [
  'Name a Great Lake',
  'Name a Star Wars character',
  'Name a US state on the Pacific coast'
];
(function bootBank(){
  /* Earlier banks were retired wholesale, not merged. Clear them out so a
     browser that ran an older copy of this file cannot resurrect those
     questions — this bank is the one everybody gets. */
  try{ ['qn.bank.v1','qn.seedv.v1','qn.killed.v1',
        'qn.bank.v2','qn.seedv.v2','qn.killed.v2',
        'qn.bank.v3','qn.seedv.v3','qn.killed.v3',
        'qn.bank.v4','qn.seedv.v4','qn.killed.v4',
        'qn.bank.v5','qn.seedv.v5','qn.killed.v5'].forEach(k => localStorage.removeItem(k)); }catch(e){}
  let stored  = DB.get(DB.k.bank, null);
  const killed  = DB.get(DB.k.killed, []);          // seed questions the host deleted
  const seenVer = DB.get(DB.k.seedv, 0);
  const seed    = buildSeedBank();

  if(!stored){ S.bank = seed; }
  else if(seenVer < SEED_VERSION){
    const beforeRetire = stored.length;
    stored = stored.filter(q => !(q.src === 'seed' && RETIRED_SEED.indexOf(q.question) > -1));
    const retired = beforeRetire - stored.length;

    const have = {};
    stored.forEach(q => have[q.id] = 1);
    killed.forEach(id => have[id] = 1);
    const fresh = seed.filter(q => !have[q.id]);

    /* Adding what is new is only half of it. A built-in question can also be
       CORRECTED — a misspelt answer, a question filed under the wrong theme —
       and the id is a hash of the question text, so a correction to any other
       field arrives under an id this browser already has. Adding-only silently
       dropped every one of those fixes, and the host kept reading the old
       answer off their own screen with no way to know.

       So a seed question is refreshed from the seed. Only a seed question:
       `src` marks where a row came from, and anything the host imported or
       typed themselves is left exactly as it is, even where it happens to sit
       on top of a built-in id. Deleted ones stay deleted — `killed` is checked
       before anything is written back. */
    const byId = {};
    seed.forEach(q => byId[q.id] = q);
    let fixed = 0;
    stored.forEach(q => {
      const s = byId[q.id];
      if(!s || q.src !== 'seed') return;
      /* pool is an array — a straight !== is always true between two distinct
         array references even when the contents match, which would report a
         false "correction" on every single load. Compare it by content. */
      const moved = ['question','answer','notes','theme','type','difficulty','use_with']
        .some(k => q[k] !== s[k])
        || JSON.stringify(q.pool || null) !== JSON.stringify(s.pool || null);
      if(moved){ Object.assign(q, s); fixed++; }
    });

    S.bank = stored.concat(fresh);
    if(fresh.length || fixed || retired) S.tmp.seedNews = { added:fresh.length, fixed, retired };
  } else {
    S.bank = stored;
  }
  DB.set(DB.k.bank, S.bank);
  DB.set(DB.k.seedv, SEED_VERSION);
  reconcileThemes();   // custom and imported themes rejoin the pickers
})();

/* ==========================================================================
   8. QUESTION SELECTION
   ========================================================================== */
const isFresh   = (q) => !S.settings.noRepeat || !S.used.has(q.id);
const matchDiff = (q, d) => d === 'mixed' || q.difficulty === d;

/* All valid PAIRS for a theme: two standard questions sharing a use_with key. */
function pairsFor(theme, diff, exclude){
  exclude = exclude || new Set();
  const pool = S.bank.filter(q =>
    q.type === 'standard' && q.theme === theme && matchDiff(q, diff) &&
    !exclude.has(q.id) && isFresh(q));
  /* Group by ticker AND difficulty — on "mixed" one team must never get an
     easy question while the other gets a hard one. */
  const groups = {};
  pool.forEach(q => {
    const k = ((q.use_with || '').trim() || '__solo__') + '||' + q.difficulty;
    (groups[k] = groups[k] || []).push(q);
  });
  const pairs = [], odd = {};
  Object.keys(groups).forEach(k => {
    const diff = k.split('||')[1];
    if(k.indexOf('__solo__||') === 0){ (odd[diff] = odd[diff] || []).push(...groups[k]); return; }
    const sh = shuffle(groups[k]);
    for(let i = 0; i + 1 < sh.length; i += 2) pairs.push({ key:k.split('||')[0], a:sh[i], b:sh[i+1], strict:true });
    if(sh.length % 2) (odd[diff] = odd[diff] || []).push(sh[sh.length-1]);
  });
  /* leftovers pair loosely, but still only within the same difficulty */
  Object.keys(odd).forEach(diff => {
    const lo = shuffle(odd[diff]);
    for(let i = 0; i + 1 < lo.length; i += 2) pairs.push({ key:'', a:lo[i], b:lo[i+1], strict:false });
  });
  return shuffle(pairs);
}

/* Closest To Wins draws from the WHOLE bank — it ignores difficulty (a number
   is a number) and it ignores tonight's themes too. Instead it deals the
   questions round-robin across every theme that has any: one Geography, one
   Food, one Music, and so on. Seven legs therefore means seven different
   themes, never seven Geography questions in a row. The theme order is
   re-shuffled on every pass, so a second lap through does not repeat the
   first lap's running order. */
function closestPool(){
  const byTheme = {};
  S.bank.forEach(q => {
    if(q.type !== 'closest' || !isFresh(q)) return;
    (byTheme[q.theme] = byTheme[q.theme] || []).push(q);
  });
  let decks = shuffle(Object.keys(byTheme)).map(t => shuffle(byTheme[t]));
  const out = [];
  while(decks.length){
    decks.forEach(d => out.push(d.shift()));
    decks = shuffle(decks.filter(d => d.length));
    /* a fresh lap must not open on the theme the last lap closed with */
    if(decks.length > 1 && out.length && decks[0][0].theme === out[out.length - 1].theme){
      const swap = decks[0]; decks[0] = decks[1]; decks[1] = swap;
    }
  }
  return out;
}

/* `diff` is either one difficulty for the lot, or a resolver (theme) =>
   difficulty — which is how a per-theme override reaches the count. */
function capacity(themes, diff){
  const at = typeof diff === 'function' ? diff : () => diff;
  let loose = 0, strict = 0;
  themes.forEach(t => { const p = pairsFor(t, at(t)); loose += p.length; strict += p.filter(x => x.strict).length; });
  return { rounds:loose, strict, closest:closestPool().length };
}


/* ==========================================================================
   8b. BATTLE OF THE CAPTAINS — the optional end-of-night bonus
   ==========================================================================
   Ten questions each, seven seconds a shot, captains only. Two rules shape
   the draw:
     - Three themes are barred. "Know the Host" has no answers in the bank,
       and Sexy Time and Lebanon are rooms-specific — under a seven-second
       clock a captain deserves something anyone at the table could know.
     - Both captains get the SAME difficulty shape, five easy and five
       medium in an identical order, but never the same question. Different
       sets, same shape, so nobody can claim they drew the harder ten.       */
const BATTLE_SKIP_THEMES = ['Know the Host','Sexy Time','Lebanon'];
const BATTLE_N    = 10;   // questions per captain
const BATTLE_SECS = 7;    // per question

/* Everything already used tonight is off the table — the rounds, both teams'
   questions, the mini-game including its unplayed spares, and sudden death. */
function battleSpent(){
  const g = G(), spent = new Set();
  g.rounds.forEach(r => r.q.forEach(q => spent.add(q.id)));
  (g.mini.qs || []).forEach(q => spent.add(q.id));
  (g.mini.spare || []).forEach(q => spent.add(q.id));
  (g.sdUsed || []).forEach(id => spent.add(id));
  const b = g.battle;
  if(b){
    b.qs.forEach(set => set.forEach(q => spent.add(q.id)));
    (b.tbUsed || []).forEach(id => spent.add(id));
    (b.dropped || []).forEach(id => spent.add(id));
  }
  return spent;
}
function battlePool(diff){
  const spent = battleSpent();
  const ok = (q) => q.type === 'standard' && !spent.has(q.id) &&
    BATTLE_SKIP_THEMES.indexOf(q.theme) < 0 &&
    (diff ? q.difficulty === diff : q.difficulty === 'easy' || q.difficulty === 'medium');
  const fresh = S.bank.filter(q => ok(q) && isFresh(q));
  /* "never reuse a question" is a nicety. Being able to run the Battle at all
     matters more, so fall back to the played ones rather than a short set. */
  return fresh.length >= BATTLE_N * 2 ? fresh : S.bank.filter(ok);
}
/* Don't offer the Battle at all if the bank can't fill both captains. */
function battleReady(){
  const p = battlePool();
  return p.filter(q => q.difficulty === 'easy').length >= 2 && p.length >= 8;
}

function buildBattle(){
  const pool = shuffle(battlePool());
  const by = { easy:pool.filter(q => q.difficulty === 'easy'),
               medium:pool.filter(q => q.difficulty === 'medium') };
  /* one shape, drawn once, used for both captains */
  const shape = shuffle(['easy','easy','easy','easy','easy','medium','medium','medium','medium','medium']);
  const taken = new Set();
  const draw = (want) => {
    /* the wanted difficulty first; the other one only to avoid a short set */
    for(const d of (want === 'easy' ? ['easy','medium'] : ['medium','easy'])){
      const q = by[d].find(x => !taken.has(x.id));
      if(q){ taken.add(q.id); return q; }
    }
    return null;
  };
  const sets = [[], []];
  for(let i = 0; i < BATTLE_N; i++){
    const a = draw(shape[i]), b = draw(shape[i]);
    if(!a || !b) break;                 // both captains or neither — always equal length
    sets[0].push(a); sets[1].push(b);
  }
  if(sets[0].length < 2) return null;
  return {
    n:sets[0].length, qs:sets, shape:shape.slice(0, sets[0].length),
    cap:0, i:0, shown:false, score:[0, 0],
    log:[[], []],                        // per captain: {q, got}
    stage:'run',                         // run → (tie) → done
    tb:null, tbUsed:[], tbRounds:0, dropped:[],
    winner:null, awarded:false, award:[0, 0], done:false
  };
}

const curBattleQ = () => { const b = G().battle; return b.stage === 'tie' ? b.tb.q : b.qs[b.cap][b.i]; };
const battleCapName = (c) => {
  const t = G().teams[c];
  return t.captain ? t.captain : t.name + "'s captain";
};

function battleFinish(){
  const g = G(), b = g.battle;
  if(b.score[0] === b.score[1]){ battleTieBreak(); return; }
  b.winner = b.score[0] > b.score[1] ? 0 : 1;
  battleAward();
}
/* Tie → a medium question, no clock, first captain in takes it. Still level
   (nobody got it) → another one, and another, until someone does. */
/* bump === false means "swap this tie-breaker for another", not "next one" */
function battleTieBreak(bump){
  const g = G(), b = g.battle;
  let pool = battlePool('medium');
  if(!pool.length) pool = battlePool();
  if(!pool.length){
    b.stage = 'done'; b.done = true; b.winner = null;
    b.note = 'Dead level, and the bank is out of questions. Your call, host.';
    go('battleSummary'); return;
  }
  const q = shuffle(pool)[0];
  b.tbUsed.push(q.id);
  if(bump !== false) b.tbRounds++;
  b.stage = 'tie';
  b.tb = { q, n:b.tbRounds, shown:false };
  markUsed(q);
  go('battleTie');
}
function battleAward(){
  const g = G(), b = g.battle;
  b.stage = 'done'; b.done = true;
  if(b.winner != null && !b.awarded){
    b.awarded = true;
    g.teams[b.winner].score += g.miniPts;
    b.award = [b.winner === 0 ? g.miniPts : 0, b.winner === 1 ? g.miniPts : 0];
    Snd.point();
  }
  go('battleSummary');
}
/* ==========================================================================
   8c. THE AUCTION — bid on how many you can name, then deliver it
   ==========================================================================
   Host reads the category. Team A opens with a number, B either raises or
   folds, back and forth. Whoever is left holding the bid has AUCTION_SECS to
   actually name that many. Make it and they take the points; fall short and
   the other team takes them for calling the bluff.

   Team A always opens. Opening is the marginally worse seat — you commit to a
   number with no information — and Team A won the toss at the top of the
   night, so it is the fair place to put it.
   ========================================================================== */
const AUCTION_SECS = 30;
const AUCTION_LEGS = 3;   // odd, so the legs can never finish level
const CLOSEST_LEGS = 7;   // legs in Closest To Wins

function auctionPool(){
  return S.bank.filter(q => q.type === 'auction' && isFresh(q));
}
/* The host's hand-picked categories first, in the order they ticked them, then
   whatever else the bank has to make the numbers up. */
function auctionDeck(cfg){
  const picked = ((cfg && cfg.pickAuction) || [])
    .map(id => S.bank.find(q => q.id === id)).filter(Boolean);
  const ids = new Set(picked.map(q => q.id));
  return picked.concat(shuffle(auctionPool().filter(q => !ids.has(q.id))));
}
function buildAuction(){
  const g = G();
  const deck = auctionDeck(g.cfg);
  if(!deck.length){ g.done.auction = true; toast('No auction categories left in the bank.'); return null; }
  g.auction = {
    deck,                            // everything still available, in draw order
    leg:0, n:Math.min(AUCTION_LEGS, deck.length),
    wins:[0, 0], legs:[],            // one record per finished leg
    q:null, bid:0, by:null, turn:0, count:0,
    winner:null, awarded:false, done:false
  };
  auctionDraw();
  return g.auction;
}
/* Take the next category off the deck and reset the leg around it. Also the
   Change-the-category button — the skipped one goes to the back, not the bin,
   so a long night cannot run the deck dry by skipping. */
function auctionDraw(skip){
  const a = G().auction;
  if(skip && a.q) a.deck.push(a.q);
  a.q = a.deck.shift() || a.q;
  if(a.q) markUsed(a.q);
  a.bid = 0; a.by = null; a.count = 0;
  a.turn = a.leg % 2;                // the open alternates leg by leg
}
/* ==========================================================================
   8d. DON'T SAY THE SAME AS ME
   ==========================================================================
   Host reads a prompt — "Name a cheese" — and starts a clock. Both teams call
   out an answer before it runs out. They can say the same as EACH OTHER, that
   costs nothing; the only thing that costs them is matching the host's own
   pre-loaded word, revealed only once the clock stops.

   Nine legs. Whoever avoided the host's word while the other team did not
   takes the leg; if both dodged it or both said it, that leg is a wash and
   splits like any other tie here. Most legs after nine wins the mini-game,
   with the same straight-into-a-tie-breaker rule Closest To Wins uses if the
   legs themselves end up level.

   The order is deliberate: legs are sorted by how WIDE the prompt is — how
   many different answers the pool holds — from vast down to tight. Round one
   might be "name a fast food chain", where the host's word is one of a dozen
   and dodging it is easy. Round nine might be a coin flip. The night is
   supposed to tighten.
   ========================================================================== */
const SAYSAME_SECS = 10;
const SAYSAME_LEGS = 9;

function saySamePool(){
  return S.bank.filter(q => q.type === 'saysame' && isFresh(q) && (q.pool || []).length >= 2);
}
/* One prompt from the bank -> one leg. `answer` is resolved HERE, freshly, so
   the same prompt reveals a different word most times it is played — the
   whole reason the bank stores a pool instead of a single fixed answer. */
function drawSaySame(q){
  const pool = q.pool || [];
  return Object.assign({}, q, { answer: pool[Math.floor(Math.random() * pool.length)] });
}
/* Hand-picks lead (which prompts play), then the vast-to-tight sort decides
   WHEN each one lands — a hand-pick does not skip the front of the queue by
   virtue of being chosen on purpose; it only guarantees it plays at all.

   That guarantee needs the primary set to be picked BEFORE it is sorted, not
   after. Sorting the whole candidate pile — hand-picks and filler together —
   and then slicing off the top SAYSAME_LEGS would let a host's own tight,
   small-pool pick (a coin flip, say) get outsorted into the spare-only tail
   by nothing more than other prompts happening to have bigger pools, which
   breaks the promise a hand-pick makes everywhere else in this app: chosen on
   purpose means it plays. */
function saySameDeck(cfg){
  const picked = ((cfg && cfg.pickSaySame) || [])
    .map(id => S.bank.find(q => q.id === id))
    .filter(q => q && (q.pool || []).length >= 2)
    .slice(0, SAYSAME_LEGS);
  const ids = new Set(picked.map(q => q.id));
  const rest = shuffle(saySamePool().filter(q => !ids.has(q.id)));

  const fillNeeded = Math.max(0, SAYSAME_LEGS - picked.length);
  const primary = picked.concat(rest.slice(0, fillNeeded))
    .sort((a, b) => b.pool.length - a.pool.length);   // vast-to-tight, within the chosen nine
  const spare = rest.slice(fillNeeded, fillNeeded + 6);   // held back for tie-breaker legs
  return primary.concat(spare);
}

const LL = {
  friend:{ key:'friend', name:'Call a Friend', icon:ICON.phone },
  dip:   { key:'dip',    name:'Double Dip',    icon:ICON.dip   },
  dbl:   { key:'dbl',    name:'Double Points', icon:ICON.x2    }
};

/* ==========================================================================
   9b. MINI-GAMES — which ones, where they land, what they are worth
   ==========================================================================
   Three of them, all optional, all chosen up front in Setup. Two get spread
   through the standard rounds; the Battle is always the closer.

   WHERE THEY LAND. Even spread, not fixed gaps: mini k of M goes after round
   round((k+1) x N / (M+1)). On a normal card that produces the two-round gap
   asked for — 8 rounds and 2 mini-games gives rounds 3 and 5 — and when the
   card is too tight for that it compresses to one round, and then to two
   mini-games back to back, rather than refusing. It can never open the night:
   at least one standard round is always played first, so the teams are warm
   before anything with a big number on it.

   WHAT THEY ARE WORTH. clamp(2, 4, round(0.35 x N / M)).
   A mini-game should be worth roughly the gap two decent teams open over two
   to four rounds — enough that a comeback is always live, never so much that
   the standard rounds stop mattering. The 0.35 keeps the pool near a third of
   the round score; dividing by M stops three mini-games from tripling it; the
   floor of 2 keeps any single one worth playing, and the ceiling of 4 stops
   one from deciding the night on its own.
   ========================================================================== */
const MINI_GAMES = {
  closest:{ key:'closest', name:'Closest To Wins',            blurb:'Seven numbers. Closest guess wins the leg.' },
  auction:{ key:'auction', name:'The Auction',                blurb:'Bid how many you can name, then deliver it.' },
  saysame:{ key:'saysame', name:"Don't Say the Same as Me",   blurb:'Ten seconds to answer without matching the host.' },
  battle: { key:'battle',  name:'Battle of the Captains',     blurb:'Ten each, captains only, 7s a shot.' }
};
/* the three that get spread through the rounds — the Battle is the finale */
const INTERLEAVED = ['closest', 'auction', 'saysame'];

function miniPointValue(N, M){
  if(!M) return 0;
  return Math.max(2, Math.min(4, Math.round(0.35 * N / M)));
}
/* -> [{key, after}] where `after` is the 0-based index of the round it follows.
   Equal `after` values mean two mini-games run back to back, which is what
   happens when there are more mini-games than the round count can space. */
function planMinis(N, keys){
  const M = keys.length;
  if(!M || !N) return [];
  const out = [];
  let last = -1;
  keys.forEach((k, i) => {
    let at = Math.round((i + 1) * N / (M + 1)) - 1;
    at = Math.max(0, Math.min(N - 1, at));   // never before round 1, never past the end
    if(at < last) at = last;                 // keep the chosen order; equal = back to back
    out.push({ key:k, after:at });
    last = at;
  });
  return out;
}

function buildGame(cfg){
  const N = cfg.rounds;
  const themes = shuffle(cfg.themes.slice());
  const taken = new Set();
  const rounds = [];

  for(let i = 0; i < N; i++){
    let pair = null, theme = null;
    // try each theme in rotation until one still has a usable pair
    const order = themes.slice(i % themes.length).concat(themes.slice(0, i % themes.length));
    for(const t of order){
      /* a hand-picked pair wins outright — the host chose those two on purpose */
      const hand = pickedPair(t, cfg.picks);
      if(hand && !taken.has(hand.a.id) && !taken.has(hand.b.id)){ pair = hand; theme = t; break; }
      const p = pairsFor(t, diffOf(cfg, t), taken);
      if(p.length){ pair = p[0]; theme = t; break; }
    }
    if(!pair) break;
    taken.add(pair.a.id); taken.add(pair.b.id);
    rounds.push({
      n:i + 1, theme, strict:pair.strict, picked:!!pair.picked, pairKey:pair.key,
      q:[pair.a, pair.b],                 // q[0] -> team that goes first slot 0
      dbl:[false, false], llUsed:[[], []],
      res:[null, null],                   // per seat: {correct, stolen}
      pts:[0, 0], done:false
    });
  }

  /* Hand-picked legs lead, in the order the host ticked them; the round-robin
     draw makes up whatever is short, skipping anything already picked. */
  const handClosest = (cfg.pickClosest || [])
    .map(id => S.bank.find(q => q.id === id))
    .filter(q => q && q.type === 'closest');
  const handIds = new Set(handClosest.map(q => q.id));
  const cpAll = handClosest.concat(closestPool().filter(q => !handIds.has(q.id)));
  const cp = cpAll.slice(0, CLOSEST_LEGS);
  const spare = cpAll.slice(CLOSEST_LEGS, CLOSEST_LEGS + 6);   // held back for tie-breaker legs

  /* Say-Same's legs are already sorted vast-to-tight by saySameDeck(); the
     first SAYSAME_LEGS play, the rest sit in reserve for a tie-break. Each
     leg's secret word is resolved now, once, via drawSaySame — not at render
     time, or a re-render mid-leg would change the answer under the host. */
  const ssDeck = saySameDeck(cfg);
  const ssLegs = ssDeck.slice(0, SAYSAME_LEGS).map(drawSaySame);
  const ssSpare = ssDeck.slice(SAYSAME_LEGS);   // resolved lazily, if a tie-break needs one

  const mk = (t, color) => ({
    name:t.name, captain:t.captain, players:t.players,
    score:0, ll:{ friend:true, dip:true, dbl:true }, color
  });

  /* Which mini-games the host actually asked for, in a fixed order so the
     plan is stable, minus any that cannot run on this bank. */
  const wanted = (cfg.minis || []).slice();
  const inter  = INTERLEAVED.filter(k => wanted.indexOf(k) > -1)
                            .filter(k => k !== 'closest' || cp.length)
                            .filter(k => k !== 'auction' || auctionPool().length)
                            .filter(k => k !== 'saysame' || ssLegs.length);
  const hasBattle = wanted.indexOf('battle') > -1;
  const plan = planMinis(rounds.length, inter);
  const M = inter.length + (hasBattle ? 1 : 0);

  return {
    id:uid(), startedAt:new Date().toISOString(), cfg,
    teams:[mk(cfg.teamA, 'a'), mk(cfg.teamB, 'b')],
    rounds,
    plan,                      // [{key, after}] for the interleaved ones
    hasBattle,
    miniPts: miniPointValue(rounds.length, M),
    done:{},                   // key -> true once that mini-game has finished
    mini:{ qs:cp, spare, base:cp.length, i:0, wins:[0, 0], subs:[], delta:[0, 0], done:false, awarded:false, tieLegs:0 },
    saySame:{ qs:ssLegs, spare:ssSpare, base:ssLegs.length, i:0, wins:[0, 0], subs:[], done:false, awarded:false, tieLegs:0 },
    auction:null,
    r:0, seat:0, sub:'intro', miniPlayed:false,
    battle:null,
    sd:null, screen:'roundIntro'
  };
}

/* every mini-game still owed after the round at index r finishes */
function minisAfter(r){
  const g = G();
  return (g.plan || []).filter(p => p.after === r && !g.done[p.key]);
}

const G = () => S.game;
const curRound = () => { const g = G(); return g.rounds[g.r]; };
/* which TEAM index sits in slot `seat` of this round */
function seatTeam(round, seat){
  const flip = S.settings.alternateFirst && (round.n % 2 === 0);
  return flip ? (seat === 0 ? 1 : 0) : seat;
}
const curTeam  = () => seatTeam(curRound(), G().seat);
const otherTeam = (t) => t === 0 ? 1 : 0;

function pointValue(round, ownerTeam){ return round.dbl[ownerTeam] ? 2 : 1; }

function award(teamIdx, pts, why){
  const g = G();
  g.teams[teamIdx].score += pts;
  Snd.point();
  toast(g.teams[teamIdx].name + ' +' + pts + ' ' + (pts === 1 ? 'point' : 'points') + (why ? ' — ' + why : ''));
}

/* schedule: pips for the HUD. standard rounds + one mini bar, and a second
   bar on the end once the Battle has actually been activated — it is a
   surprise, so it must not appear on the schedule before it is accepted. */
const BATTLE_SCREENS = ['battleIntro','battleQ','battleHandoff','battleTie','battleSummary'];
function schedule(){
  const g = G(); const out = [];
  for(let i = 0; i < g.rounds.length; i++){
    out.push({ kind:'std', i });
    (g.plan || []).forEach(p => { if(p.after === i) out.push({ kind:'mini', key:p.key }); });
  }
  /* The Battle is on the card from Setup, so it is on the schedule from the
     first pip — it is no longer a surprise the host springs at the end. */
  if(g.hasBattle) out.push({ kind:'mini', key:'battle' });
  return out;
}
const AUCTION_SCREENS = ['auctionIntro','auctionBid','auctionRun','auctionLeg','auctionResult'];
const CLOSEST_SCREENS = ['miniIntro','miniQ','miniEntry','miniSummary'];
const SAYSAME_SCREENS = ['sayIntro','sayQ','sayJudge','saySummary'];
/* which mini-game, if any, is on screen right now */
function liveMini(){
  if(CLOSEST_SCREENS.indexOf(S.screen) > -1) return 'closest';
  if(AUCTION_SCREENS.indexOf(S.screen) > -1) return 'auction';
  if(SAYSAME_SCREENS.indexOf(S.screen) > -1) return 'saysame';
  if(BATTLE_SCREENS.indexOf(S.screen) > -1) return 'battle';
  return null;
}
function pipState(){
  const g = G(); const sch = schedule();
  const live = liveMini();
  return sch.map(s => {
    if(s.kind === 'mini'){
      if(live === s.key) return 'now';
      return g.done[s.key] ? 'done' : 'todo';
    }
    /* Use the round's own done flag, not g.r — g.r stays parked on the
       last-played round for the whole of a mini-game, which would show a
       finished round as still to come. */
    if(s.i === g.r && !live) return 'now';
    return (g.rounds[s.i] && g.rounds[s.i].done) ? 'done' : 'todo';
  });
}

/* ==========================================================================
   10. RENDER
   ========================================================================== */
/* Re-render in place. Scroll position is held unless the caller navigates —
   toggling a setting must not throw you back to the top of the page. */
function render(){
  const app = el('app');
  const y = window.scrollY;

  /* Typing in a filter box re-renders the screen underneath the cursor, and
     replacing innerHTML throws the focused input away mid-word — which is why
     the bank search took one letter per click. Note who had focus and where
     the caret sat, then put both back on the rebuilt element. The data-act /
     data-k / data-side triple is what identifies an input across a rebuild;
     there are no ids on these fields. */
  const live = document.activeElement;
  const keep = live && live.dataset && app.contains(live) &&
               (live.tagName === 'INPUT' || live.tagName === 'TEXTAREA')
    ? { act:live.dataset.act, k:live.dataset.k, side:live.dataset.side,
        start:live.selectionStart, end:live.selectionEnd }
    : null;

  const fn = SCREENS[S.screen] || SCREENS.home;
  /* These two strip the page's 24/64px padding so a full-height screen really
     does fit the window. Any screen using .play or .fits MUST be in one of
     them — left out, it renders 88px of padding inside a box already sized to
     the viewport and the page scrolls by exactly that much. */
  document.body.classList.toggle('playmode', ['ask','steal','miniQ','battleQ','auctionBid','auctionRun','sayQ'].indexOf(S.screen) > -1);
  document.body.classList.toggle('fitmode', ['miniSummary','final','battleSummary','battleHandoff','auctionLeg','auctionResult','saySummary'].indexOf(S.screen) > -1);
  document.body.classList.toggle('homemode', S.screen === 'home');
  app.innerHTML = fn();
  if(keep && keep.act){
    const sel = '[data-act="' + keep.act + '"]' +
      (keep.k    ? '[data-k="'    + keep.k    + '"]' : '') +
      (keep.side ? '[data-side="' + keep.side + '"]' : '');
    const back = app.querySelector(sel);
    if(back){
      back.focus({ preventScroll:true });
      /* setSelectionRange throws on number/email inputs, where it also has
         nothing useful to do — the focus alone is the point there. */
      try{ back.setSelectionRange(keep.start, keep.end); }catch(e){}
    }
  }
  renderHUD();
  if(AFTER[S.screen]) AFTER[S.screen]();
  if(S.tmp.toTop){ S.tmp.toTop = false; window.scrollTo(0, 0); }
  else window.scrollTo(0, y);
}
function nav(screen){ S.tmp.toTop = true; S.screen = screen; render(); }

function renderHUD(){
  const h = el('hud');
  const g = G();
  const inGame = g && (['roundIntro','ask','reveal','steal','stealReveal','answer','roundScore','sudden','final'].indexOf(S.screen) > -1
    || CLOSEST_SCREENS.indexOf(S.screen) > -1
    || AUCTION_SCREENS.indexOf(S.screen) > -1
    || SAYSAME_SCREENS.indexOf(S.screen) > -1
    || BATTLE_SCREENS.indexOf(S.screen) > -1);
  if(!inGame){ h.hidden = true; h.innerHTML = ''; return; }
  h.hidden = false;

  const pips = pipState().map((st, i) => {
    const sch = schedule()[i];
    const title = sch.kind === 'mini' ? MINI_GAMES[sch.key].name
                : 'Round ' + (sch.i + 1);
    /* the .mini class is the wide bar — the Battle earns one too */
    return '<span class="pip ' + (sch.kind === 'std' ? '' : 'mini ') + (st === 'now' ? 'now' : st === 'done' ? 'done' : '') + '" title="' + title + '"></span>';
  }).join('');

  let label;
  if(CLOSEST_SCREENS.indexOf(S.screen) > -1){
    label = '<b>CLOSEST TO WINS</b> &nbsp;·&nbsp; ' + legLabel();
  } else if(AUCTION_SCREENS.indexOf(S.screen) > -1){
    const a = g.auction;
    label = '<b>THE AUCTION</b>' +
      (a && S.screen !== 'auctionResult' ? ' &nbsp;·&nbsp; Leg ' + Math.min(a.leg + 1, a.n) + '/' + a.n : '') +
      (S.screen === 'auctionRun' && a ? ' &nbsp;·&nbsp; ' + a.count + '/' + a.bid : '');
  } else if(SAYSAME_SCREENS.indexOf(S.screen) > -1){
    label = '<b>DON&rsquo;T SAY THE SAME AS ME</b> &nbsp;·&nbsp; ' + sayLegLabel();
  } else if(BATTLE_SCREENS.indexOf(S.screen) > -1){
    const b = g.battle;
    label = '<b>BATTLE OF THE CAPTAINS</b>' +
      (S.screen === 'battleQ' ? ' &nbsp;·&nbsp; ' + esc(battleCapName(b.cap)) + ' ' + (b.i + 1) + '/' + b.n
       : S.screen === 'battleTie' ? ' &nbsp;·&nbsp; Tie breaker ' + b.tb.n : '');
  } else if(S.screen === 'sudden'){
    label = '<b>SUDDEN DEATH</b>';
  } else if(S.screen === 'final'){
    label = '<b>FINAL RESULT</b>';
  } else {
    const rd = curRound();
    label = 'Round <b>' + (g.r + 1) + '</b> of ' + g.rounds.length + ' &nbsp;·&nbsp; <b>' + esc(rd ? rd.theme : '') + '</b>';
  }

  h.innerHTML =
    '<div class="hud-in">' +
      '<div class="hud-team a"><span class="dot"></span><div><div class="nm">' + esc(g.teams[0].name) + '</div></div><div class="sc num">' + g.teams[0].score + '</div></div>' +
      '<div class="hud-mid"><div class="hud-label">' + label + '</div><div class="pips">' + pips + '</div></div>' +
      '<div class="hud-team b"><div class="sc num">' + g.teams[1].score + '</div><div><div class="nm">' + esc(g.teams[1].name) + '</div></div><span class="dot"></span></div>' +
      '<div class="hud-actions"><button class="btn sm ghost" data-act="quit">Exit</button></div>' +
    '</div>';
}

SCREENS.home = function(){
  const st = { std:S.bank.filter(q => q.type === 'standard').length, cl:S.bank.filter(q => q.type === 'closest').length };
  return '' +
  '<section class="home">' +
    '<div class="home-main">' +
      '<div class="logo-wrap">' +
        /* He lives inside the logo block so phones can sit him beside the
           wordmark. On desktop he is position:absolute against .home — and
           neither .home-main nor .logo-wrap is a positioned ancestor — so
           moving him here leaves the desktop layout byte-for-byte identical. */
        '<img class="mascot" src="' + MASCOT + '" alt="Imad, your host" draggable="false">' +
        '<div class="logo">Quiz Me<br>Baby</div>' +
        '<div class="logo-sub">Host Control</div>' +
      '</div>' +
      '<div class="home-menu">' +
        '<button class="btn gold lg block" data-act="go" data-to="setup">Start a new game</button>' +
        '<button class="btn block" data-act="go" data-to="soloSetup">Play solo game</button>' +
        '<div class="grid2" style="gap:12px">' +
          '<button class="btn block" data-act="go" data-to="rules">Rules</button>' +
          '<button class="btn block" data-act="go" data-to="history">Game history</button>' +
        '</div>' +
        '<button class="btn ghost block" data-act="go" data-to="settings">Settings</button>' +
      '</div>' +
      '<div class="home-stats">' +
        '<span><b>' + st.std + '</b> standard questions</span>' +
        '<span><b>' + st.cl + '</b> closest-to questions</span>' +
        '<span><b>' + S.history.length + '</b> games played</span>' +
        '<span><b>' + S.used.size + '</b> questions burned</span>' +
      '</div>' +
      '<p class="dim" style="font-size:12px;max-width:52ch;line-height:1.6">Two teams. One captain each. Captains give the final answer — no phones.</p>' +
      '<p class="colophon" data-act="colophon" title="Version ' + BUILD.v + ', built ' + BUILD.date + '">' +
        'Built by ' + BUILD.author + ' <span class="sep">·</span> © ' + BUILD.year +
        ' <span class="sep">·</span> v' + BUILD.v + ' <span class="sep">·</span> ' + BUILD.date +
      '</p>' +
    '</div>' +
  '</section>';
};

/* ==========================================================================
   11b. SCREENS — RULES
   ========================================================================== */
function ruleBlock(n, title, body){
  return '<div class="card pad lit stack">' +
    '<div class="sec-head"><div class="eyebrow gold">' + n + '</div><h3 class="display">' + title + '</h3></div>' +
    body + '</div>';
}
SCREENS.rules = function(){
  const li = (s) => '<li style="margin-bottom:10px">' + s + '</li>';
  const ul = (items) => '<ul style="list-style:none;font-size:15px;line-height:1.6">' + items.join('') + '</ul>';
  const ol = (items) => '<ol class="rules-ol">' + items.map(s => '<li>' + s + '</li>').join('') + '</ol>';
  return '<div class="stack lg" style="padding-top:12px">' +
    '<div class="row between">' +
      '<div><div class="eyebrow gold">House rules</div><h2 class="display">How the night works</h2></div>' +
      '<button class="btn ghost sm" data-act="go" data-to="home">Back</button>' +
    '</div>' +

    ruleBlock('01', 'The setup', ol([
      '<strong>Two teams</strong>, as many players each as you like.',
      'Each team picks a <strong>captain</strong>. The captain gives the final answer. Nobody else. If the captain has not said it, it has not been said.',
      '<strong>Settle who goes first by chance, not by argument.</strong> Coin toss, rock paper scissors, highest card, closest guess to a number in the host&rsquo;s head — anything, as long as it is luck. <strong>The winner then chooses</strong> whether to be <span class="tn a">Team A</span>, who answers first every round, or <span class="tn b">Team B</span>, who gets the first steal.',
      '<strong>No phones.</strong> Not on the table, not in a lap.',
      'Between 4 and 14 standard rounds, one theme each, plus <strong>however many mini-games the host puts on the card</strong> — none, one, or any of the four.'
    ])) +

    ruleBlock('02', 'A standard round', ol([
      'One theme per round. One question for each team, and they are always the <strong>same kind</strong> of question at the <strong>same difficulty</strong> — never a capital city for one team and a mountain height for the other.',
      '<span class="tn a">Team A</span> gets their question. <strong>' + S.settings.tQuestion + ' seconds.</strong>',
      'Wrong or out of time? <span class="tn b">Team B</span> can <strong>steal it</strong> — but only <strong>' + S.settings.tSteal + ' seconds</strong>, and no lifelines on a steal.',
      'The answer stays hidden until the question is finished either way, so a stealing team can never read it off the screen.',
      'Then <span class="tn b">Team B</span> gets their own question, with <span class="tn a">Team A</span> stealing.',
      '<strong>One point</strong> per correct answer, whoever gets it.'
    ])) +

    ruleBlock('03', 'Lifelines — three each, once each, for the whole game', ul([
      li(ICON.phone + ' <strong>Call a Friend</strong> — ' + S.settings.tFriend + ' seconds. The host speaks to the friend first and tells them: no ChatGPT, no Google, no asking the room.'),
      li(ICON.dip + ' <strong>Double Dip</strong> — two attempts at the answer. Burned either way, even if the first attempt is right.'),
      li(ICON.x2 + ' <strong>Double Points</strong> — must be <strong>declared before the round starts</strong>. Once the question is read, it is too late.'),
      li('<span style="color:var(--warn)">If you arm Double Points you may use only <strong>one</strong> of the other two lifelines that round.</span>'),
      li('<span style="color:var(--warn)">If you arm Double Points and miss, the other team can steal it — and if they get it right it is worth <strong>2 points</strong> to them, even though they spent nothing.</span>'),
      li('No lifelines on a steal. <strong>No lifelines at all in the mini-games.</strong>')
    ])) +

    ruleBlock('04', 'The mini-games', ul([
      li('The host picks which ones are on tonight&rsquo;s card — <strong>none, one, or any of the four</strong>. They are announced at the start, not sprung on you.'),
      li('They drop in <strong>between the standard rounds</strong>, spaced out across the night. Where exactly depends on how many rounds you are playing.'),
      li('Each one is worth <strong>between 2 and 4 points</strong> to whoever wins it. The host can tell you which before you start.'),
      li('<span style="color:var(--warn)">No lifelines in any of them.</span>')
    ])) +

    ruleBlock('05', 'Closest To Wins', ul([
      li('<strong>Tonight&rsquo;s themes do not apply here.</strong> The legs are dealt across the whole bank, one theme at a time — a Geography number, a Food number, a Music number — so you never get the same theme twice in a row.'),
      li('Both teams get the same number question at the same time. <strong>' + S.settings.tMini + ' seconds</strong> to write one number down.'),
      li('Closest number takes the leg. Tie on a leg = <strong>a point each</strong>.'),
      li('Most legs takes the mini-game. Still level at the end? An <strong>extra tie-breaker question</strong> is pulled straight away, and again if needed.')
    ])) +

    ruleBlock('06', 'The Auction', ul([
      li('<strong>' + AUCTION_LEGS + ' categories.</strong> &ldquo;How many countries can you name?&rdquo; &ldquo;How many cocktails?&rdquo;'),
      li('One team opens with a number — how many they reckon they can name. The other team either <strong>bids higher</strong> or <strong>lets them take it</strong>. Back and forth until somebody folds. <strong>The open alternates</strong> each category, so nobody bids blind twice.'),
      li('Whoever is left holding the bid gets <strong>' + AUCTION_SECS + ' seconds</strong> to actually name that many. The host counts.'),
      li('Make it and you take the category. Fall short and <strong>the other team takes it</strong> for calling your bluff.'),
      li('Most categories out of ' + AUCTION_LEGS + ' wins the mini-game. Bid what you can deliver, not what sounds brave.')
    ])) +

    ruleBlock('07', "Don't Say the Same as Me", ul([
      li('Host reads a prompt — &ldquo;Name a cheese.&rdquo; <strong>' + SAYSAME_SECS + ' seconds</strong> for both teams to call out an answer.'),
      li('The host already has a word loaded. <strong>Saying the same as each other is fine</strong> — the only thing that costs you is matching the host.'),
      li('Time&rsquo;s up, the host reveals the word and rules on who said it. Dodged it while the other team did not? You take the leg.'),
      li('Both dodged it, or both said it? <strong>Tie — a point each.</strong>'),
      li('Most legs out of ' + SAYSAME_LEGS + ' wins the mini-game. The prompts get narrower as the night goes — the last one might be a coin flip.')
    ])) +

    ruleBlock('08', 'Battle of the Captains', ul([
      li('<strong>Captains only.</strong> The room says nothing — and that means nothing.'),
      li('Ten questions each, <strong>' + BATTLE_SECS + ' seconds</strong> a shot, one captain at a time.'),
      li('Both captains get the <strong>same shape</strong> — five easy, five medium, in the same order — but never the same questions. Different sets, same difficulty, so nobody can claim they drew the harder ten.'),
      li('<span style="color:var(--warn)">No lifelines, no conferring, no second guesses.</span>'),
      li('Best score wins it. Level after twenty questions? One more question, <strong>no clock</strong>, first captain in takes it.'),
      li('It always runs <strong>last</strong>, after the final standard round.')
    ])) +

    ruleBlock('09', 'Winning', ul([
      li('Highest score after the last round takes the night.'),
      li('Tie? <strong>Sudden death</strong> — one fresh question, both captains, first right answer wins. Repeats until somebody gets one.')
    ])) +

    '<div class="btn-row center"><button class="btn gold lg" data-act="go" data-to="setup">Right — start a game</button></div>' +
  '</div>';
};

/* ==========================================================================
   12. SCREENS — SETUP
   ========================================================================== */
/* themes that can actually field a matched pair at this difficulty */
function usableThemes(diff){
  return THEMES.filter(t => pairsFor(t, diff).length > 0);
}
function defaultSetup(){
  const rounds = 8;
  return {
    teamA:{ name:'Team A', captain:'', players:'' },
    teamB:{ name:'Team B', captain:'', players:'' },
    rounds,
    themes:shuffle(usableThemes('mixed')).slice(0, rounds),
    difficulty:'mixed',
    themeDiff:{},       // theme -> difficulty, overriding the house setting
    minis:['closest'],  // which mini-games are on tonight's card
    pickClosest:[], pickAuction:[], pickSaySame:[],   // hand-picked mini-game questions
    picks:{}            // theme -> [questionId, questionId] chosen by hand
  };
}

/* --------------------------------------------------------------------------
   DIFFICULTY, PER THEME
   `difficulty` is the house setting for the night. A theme may override it —
   hard Friends for the table who have seen it fifty times, easy Geography for
   everyone else — and that override is what every pool, count and warning in
   the app reads from. A theme with no entry simply inherits.
   -------------------------------------------------------------------------- */
function diffOf(cfg, theme){
  const d = cfg && cfg.themeDiff && cfg.themeDiff[theme];
  return d || (cfg ? cfg.difficulty : 'mixed');
}
function diffFor(theme){ return diffOf(S.setup, theme); }
/* themes actually running on something other than the house setting */
function overrideThemes(){
  const c = S.setup;
  if(!c || !c.themeDiff) return [];
  return c.themes.filter(t => c.themeDiff[t] && c.themeDiff[t] !== c.difficulty);
}
/* keep the theme count matched to the round count when the round count moves */
function syncThemes(){
  const c = S.setup;
  if(c.themes.length > c.rounds){ c.themes = c.themes.slice(0, c.rounds); prunePicks(); return; }
  const spare = shuffle(usableThemes(c.difficulty).filter(t => c.themes.indexOf(t) < 0));
  while(c.themes.length < c.rounds && spare.length) c.themes.push(spare.shift());
}

/* --------------------------------------------------------------------------
   HAND-PICKED QUESTIONS
   The host may nominate exactly two questions per theme — one for each team.
   Anything they do not touch is still matched automatically at build time.
   -------------------------------------------------------------------------- */
/* The theme's own difficulty is the default — pass one explicitly only to ask
   a what-if question, which nothing currently does. */
function pickPool(theme, diff){
  const d = diff || diffFor(theme);
  return S.bank.filter(q => q.type === 'standard' && q.theme === theme && matchDiff(q, d) && isFresh(q));
}
function picksFor(theme){ return ((S.setup && S.setup.picks) || {})[theme] || []; }
/* a pick stops being valid the moment its theme, difficulty or freshness moves */
function prunePicks(){
  const c = S.setup; if(!c) return;
  /* A difficulty override for a theme that is no longer in play is dead weight,
     and worse, it would come back silently if the host re-added the theme. */
  const td = c.themeDiff = c.themeDiff || {};
  Object.keys(td).forEach(t => { if(c.themes.indexOf(t) < 0) delete td[t]; });
  const p = c.picks = c.picks || {};
  Object.keys(p).forEach(t => {
    if(c.themes.indexOf(t) < 0){ delete p[t]; return; }
    const ok = {}; pickPool(t).forEach(q => ok[q.id] = 1);
    p[t] = p[t].filter(id => ok[id]);
    if(!p[t].length) delete p[t];
  });
  /* Turn a mini-game off and its hand-picked questions go with it — leaving
     them would silently reapply if the host switched it back on later. */
  Object.keys(MINI_PICKS).forEach(k => {
    const m = MINI_PICKS[k];
    if((c.minis || []).indexOf(k) < 0){ c[m.store] = []; return; }
    const ok = {}; S.bank.forEach(q => { if(q.type === m.type && isFresh(q)) ok[q.id] = 1; });
    c[m.store] = (c[m.store] || []).filter(id => ok[id]);
  });
}
function pickedPair(theme, picks){
  const ids = (picks || (S.setup && S.setup.picks) || {})[theme] || [];
  if(ids.length !== 2) return null;
  const a = S.bank.find(q => q.id === ids[0]), b = S.bank.find(q => q.id === ids[1]);
  if(!a || !b) return null;
  const key = (a.use_with || '').trim();
  return { key, a, b, strict:!!key && key === (b.use_with || '').trim(), picked:true };
}

SCREENS.setup = function(){
  const c = S.setup = S.setup || defaultSetup();
  prunePicks();
  const setThemes  = c.themes.filter(t => picksFor(t).length === 2);
  const halfThemes = c.themes.filter(t => picksFor(t).length === 1);
  const cap = capacity(c.themes, diffFor);   // resolver, so overrides count
  const enough = cap.rounds >= c.rounds;
  const enoughMini = cap.closest >= 7;
  /* the mini-game card: what is on the card, where it lands, what it is worth */
  c.minis = c.minis || [];
  const miniKeys   = Object.keys(MINI_GAMES).filter(k => c.minis.indexOf(k) > -1);
  const miniInter  = INTERLEAVED.filter(k => miniKeys.indexOf(k) > -1);
  const miniPlan   = planMinis(c.rounds, miniInter);
  const miniEach   = miniPointValue(c.rounds, miniKeys.length);
  const miniTotal  = miniEach * miniKeys.length;

  /* one theme per round — the counts have to match exactly */
  const themeGap = c.themes.length - c.rounds;
  const themesOK = themeGap === 0;
  const canStart = enough && themesOK;

  /* The count came off the face of the chip. On a phone it was the difference
     between two themes per row and three, and it was answering a question the
     host does not have — the capacity warning underneath already catches a
     theme that cannot field a round. A theme that is genuinely too thin is
     dimmed instead, which reads at a glance and costs no width. */
  const themeChips = THEMES.map(t => {
    const d = diffFor(t);
    const n = S.bank.filter(q => q.theme === t && q.type === 'standard' && matchDiff(q, d) && isFresh(q)).length;
    const on = c.themes.indexOf(t) > -1;
    return '<button class="chip' + (n < 2 ? ' thin' : '') + '" role="button" aria-pressed="' + on + '" data-act="theme" data-t="' + esc(t) + '"' +
      (n < 2 ? ' title="Not enough questions in ' + esc(t) + ' at ' + esc(Cap(d)) + ' difficulty"' : '') + '>' +
      esc(t) + '</button>';
  }).join('');

  const roundBtns = [];
  for(let i = 4; i <= 14; i++) roundBtns.push('<button data-act="rounds" data-n="' + i + '" aria-pressed="' + (c.rounds === i) + '" class="' + (c.rounds === i ? 'gold' : '') + '">' + i + '</button>');

  const diffBtns = ['easy','medium','hard','mixed'].map(d =>
    '<button data-act="diff" data-d="' + d + '" aria-pressed="' + (c.difficulty === d) + '" class="' + (c.difficulty === d ? 'gold' : '') + '">' + Cap(d) + '</button>').join('');

  /* ---- the advanced drawer ------------------------------------------------
     Three things the host almost never touches on a normal Tuesday, folded
     away behind one button so the setup screen stays a phone screen: the
     hand-picked questions, a difficulty per theme, and tonight's rules.
     Collapsed by default. The summary line under the button says what is
     configured in there, so nothing set can hide behind a closed drawer. */
  const adv  = !!S.tmp.advOpen;
  const ovr  = overrideThemes();
  const bits = [];
  if(setThemes.length)  bits.push(setThemes.length + ' theme' + (setThemes.length > 1 ? 's' : '') + ' hand-picked');
  if(halfThemes.length) bits.push(halfThemes.length + ' half-picked');
  if(ovr.length)        bits.push(ovr.length === 1 ? '1 theme on its own difficulty' : ovr.length + ' themes on their own difficulty');
  if(S.settings.noRepeat)       bits.push('no repeats');
  if(S.settings.alternateFirst) bits.push('alternating first answer');
  const advSummary = bits.length
    ? bits.join(' <span class="sep">·</span> ')
    : 'Hand-pick the questions, set a difficulty per theme, change tonight&rsquo;s rules.';

  function advBody(){
    /* A. hand-picked questions */
    const pickBlock = '<div class="stack">' +
      '<div class="sec-head"><div class="eyebrow gold">Hand-picked questions</div>' +
        '<span class="badge ' + (setThemes.length ? 'gold' : 'line') + '">' + setThemes.length + ' of ' + c.themes.length + ' themes set</span></div>' +
      '<p class="help">Optional. Tick exactly <strong>two</strong> questions in a theme — one for each team — and that round is locked to the pair you chose. Leave a theme alone and the app matches a pair itself, as always.</p>' +
      (halfThemes.length
        ? '<div class="warnbox"><strong>' + esc(halfThemes.join(', ')) + '</strong> ' + (halfThemes.length > 1 ? 'have' : 'has') + ' only one question ticked. A round needs two — tick a second one or clear it, otherwise that theme falls back to a random pair.</div>'
        : '') +
      '<div class="btn-row">' +
        '<button class="btn gold" data-act="pickOpen"' + (c.themes.length ? '' : ' disabled') + '>Choose questions</button>' +
        (setThemes.length || halfThemes.length ? '<button class="btn ghost" data-act="pickClear">Clear all picks</button>' : '') +
      '</div>' +
      (setThemes.length
        ? '<div class="chips">' + setThemes.map(t => '<span class="chip" aria-pressed="true" style="pointer-events:none">' + esc(t) + '<span class="ct">2</span></span>').join('') + '</div>'
        : '') +
    '</div>';

    /* B. a difficulty per theme.
       No Mixed here. Mixed is a statement about a SPREAD of rounds — some easy,
       some hard — which is a thing a whole game can be and a single theme
       cannot. A theme is one round, and one round is one difficulty.
       Mixed can still be the HOUSE setting, and a theme nobody has touched
       inherits it; that is the case where no pill is lit. */
    const rows = c.themes.length
      ? c.themes.map(t => {
          const own = (c.themeDiff || {})[t] || '';
          const eff = own || c.difficulty;
          const dead = !pairsFor(t, eff).length;
          return '<div class="tdrow' + (own ? ' set' : '') + (dead ? ' dead' : '') + '"' +
            (dead ? ' title="No pair left in ' + esc(t) + ' at ' + esc(Cap(eff)) + '"' : '') + '>' +
            '<div class="tdname">' + esc(t) + '</div>' +
            '<div class="seg tiny">' + DIFFS.map(d =>
              '<button data-act="themeDiff" data-t="' + esc(t) + '" data-d="' + d + '" aria-pressed="' + (eff === d) + '"' +
                ' class="' + (eff === d ? (own ? 'gold' : 'inherit') : '') + '">' + Cap(d) + '</button>').join('') +
            '</div>' +
          '</div>';
        }).join('')
      : '<div class="empty">Pick tonight&rsquo;s themes first.</div>';

    const diffBlock = '<div class="stack">' +
      '<div class="sec-head"><div class="eyebrow gold">Difficulty per theme</div>' +
        '<span class="badge ' + (ovr.length ? 'gold' : 'line') + '">' +
          (ovr.length ? ovr.length + ' overridden' : 'all on ' + Cap(c.difficulty)) + '</span>' +
        (ovr.length ? '<button class="btn sm ghost" data-act="themeDiffReset">Reset all</button>' : '') +
      '</div>' +
      '<div class="tdlist">' + rows + '</div>' +
    '</div>';

    /* C. tonight's rules */
    const rulesBlock = '<div class="stack">' +
      '<div class="sec-head"><div class="eyebrow gold">Rules for tonight</div></div>' +
      toggleRow('noRepeat', 'Never reuse a question I&rsquo;ve already played', 'Same group can play again next week with zero repeats.') +
      toggleRow('alternateFirst', 'Alternate which team answers first each round', 'Off = Team A always goes first, as in the classic format.') +
      '<p class="help">Timers live in <strong>Settings</strong> — change them there and they hold for every game.</p>' +
    '</div>';

    return '<div class="stack lg">' + pickBlock + '<hr class="hair">' + diffBlock + '<hr class="hair">' + rulesBlock + '</div>';
  }

  return '' +
  '<div class="stack lg" style="padding-top:12px">' +
    '<div class="row between">' +
      '<div><div class="eyebrow gold">Setup</div><h2 class="display">Build tonight&rsquo;s game</h2></div>' +
      '<button class="btn ghost sm" data-act="go" data-to="home">Back</button>' +
    '</div>' +

    '<div class="grid2">' +
      teamSetupCard('a', c.teamA) +
      teamSetupCard('b', c.teamB) +
    '</div>' +

    '<div class="card pad lit stack">' +
      '<div class="sec-head"><div class="eyebrow gold">01</div><h3 class="display">How many standard rounds?</h3></div>' +
      '<div class="seg" style="flex-wrap:wrap">' + roundBtns.join('') + '</div>' +
      '<p class="help">Each round = one theme, one question per team, plus steal chances.</p>' +
    '</div>' +

    '<div class="card pad lit stack">' +
      '<div class="sec-head"><div class="eyebrow gold">02</div><h3 class="display">Difficulty</h3></div>' +
      '<div class="seg">' + diffBtns + '</div>' +
    '</div>' +

    '<div class="card pad lit stack">' +
      '<div class="sec-head"><div class="eyebrow gold">03</div><h3 class="display">Themes in play</h3>' +
        '<span class="badge ' + (themesOK ? 'ok' : 'no') + '">' + c.themes.length + ' of ' + c.rounds + ' picked</span>' +
        '<button class="btn sm ghost" data-act="themeNone">Clear</button></div>' +
      '<div class="chips theme-chips">' + themeChips + '</div>' +
      '<p class="help">One theme per round — pick exactly <strong>' + c.rounds + '</strong>. Dimmed themes are too thin at this difficulty.</p>' +
      (themesOK ? '' : '<div class="warnbox"><strong>' +
        (themeGap > 0
          ? themeGap + ' theme' + (themeGap > 1 ? 's' : '') + ' too many.</strong> You have ' + c.rounds + ' rounds and ' + c.themes.length + ' themes — drop ' + themeGap + '.'
          : (-themeGap) + ' more theme' + (themeGap < -1 ? 's' : '') + ' needed.</strong> You have ' + c.rounds + ' rounds and only ' + c.themes.length + ' theme' + (c.themes.length === 1 ? '' : 's') + ' — add ' + (-themeGap) + ', or drop the round count to ' + c.themes.length + '.') +
        '</div>') +
    '</div>' +

    '<div class="card pad stack">' +
    '<div class="card pad lit stack">' +
      '<div class="sec-head"><div class="eyebrow gold">04</div><h3 class="display">Mini-games</h3>' +
        '<span class="badge ' + (miniKeys.length ? 'gold' : 'line') + '">' +
          (miniKeys.length ? miniTotal + ' points on the table' : 'None') + '</span></div>' +
      '<div class="stack mini-list">' +
      Object.keys(MINI_GAMES).map(k => {
        const m = MINI_GAMES[k], on = c.minis.indexOf(k) > -1;
        const slot = k === 'battle' ? 'last'
          : (() => { const p = miniPlan.find(x => x.key === k);
                     return p ? 'after R' + (p.after + 1) : ''; })();
        return '<button class="tgl mini-row" data-act="miniToggle" data-k="' + k + '" aria-pressed="' + on + '">' +
          '<span><span class="tl">' + m.name + '</span>' +
          '<span class="help">' + m.blurb +
            (on ? ' <strong style="color:var(--gold)">' + miniEach + ' pts' + (slot ? ' · ' + slot : '') + '</strong>' : '') +
          '</span></span>' +
          '<span class="sw"></span></button>';
      }).join('') +
      '</div>' +
      /* No paragraph under here. The badge at the top of the card already
         carries the total, each row carries its own value and slot, and the
         maths does not need spelling out at the cost of a screen of scroll. */
    '</div>' +

      '<button class="advbtn" data-act="advToggle" aria-pressed="' + adv + '" aria-expanded="' + adv + '">' +
        '<span><span class="tl">Advanced Game Configuration</span><br>' +
          '<span class="help">' + advSummary + '</span></span>' +
        '<span class="chev" aria-hidden="true"></span>' +
      '</button>' +
      (adv ? '<hr class="hair">' + advBody() : '') +
    '</div>' +

    (enough ? ''
      : '<div class="warnbox"><strong>Not enough questions.</strong> Only ' + cap.rounds + ' matched pair(s) available for ' + c.rounds + ' rounds. Add themes, change difficulty, lower the round count, or turn off &ldquo;never reuse&rdquo; in Settings.</div>') +
    (enoughMini ? '' : '<div class="warnbox">Only ' + cap.closest + ' of 7 Closest To Wins questions available — that leg will be shortened to ' + cap.closest + ' leg(s).</div>') +

    '<div class="btn-row end">' +
      '<button class="btn ghost" data-act="go" data-to="home">Cancel</button>' +
      '<button class="btn gold lg" data-act="startGame"' + (canStart ? '' : ' disabled') + '>Start the game</button>' +
    '</div>' +
  '</div>';
};

function teamSetupCard(side, t){
  const L = side === 'a' ? 'Team A' : 'Team B';
  return '<div class="team-card ' + side + ' stack">' +
    '<div class="team-tag">' + L + '</div>' +
    '<label class="fld">Team name<input type="text" data-act="tf" data-side="' + side + '" data-k="name" value="' + esc(t.name) + '" placeholder="' + L + '"></label>' +
    '<label class="fld">Captain <span class="help" style="text-transform:none;letter-spacing:0">— the only voice you accept</span>' +
      '<input type="text" data-act="tf" data-side="' + side + '" data-k="captain" value="' + esc(t.captain) + '" placeholder="Captain name"></label>' +
    '<label class="fld">Players<textarea rows="2" data-act="tf" data-side="' + side + '" data-k="players" placeholder="Comma separated">' + esc(t.players) + '</textarea></label>' +
  '</div>';
}
function timerField(key, label, opts){
  return '<label class="fld">' + label +
    '<select data-act="setNum" data-k="' + key + '">' +
      opts.map(o => '<option value="' + o + '"' + (S.settings[key] === o ? ' selected' : '') + '>' + o + ' seconds</option>').join('') +
    '</select></label>';
}
function toggleRow(key, label, help){
  return '<button class="tgl" data-act="toggle" data-k="' + key + '" aria-pressed="' + !!S.settings[key] + '">' +
    '<span><span class="tl">' + label + '</span><br><span class="help">' + help + '</span></span>' +
    '<span class="sw"></span></button>';
}

/* ---------- the question picker (lives in a modal over the setup screen) ---------- */
function pickerHTML(){
  const c = S.setup;
  const filter = c.themes.indexOf(S.tmp.pickFilter) > -1 ? S.tmp.pickFilter : '';
  const shown = filter ? [filter] : c.themes;
  const done = c.themes.filter(t => picksFor(t).length === 2).length;

  const filterChips =
    '<button class="chip" role="button" aria-pressed="' + (!filter) + '" data-act="pickFilter" data-t="">All themes<span class="ct">' + c.themes.length + '</span></button>' +
    c.themes.map(t => '<button class="chip" role="button" aria-pressed="' + (filter === t) + '" data-act="pickFilter" data-t="' + esc(t) + '">' +
      esc(t) + '<span class="ct">' + picksFor(t).length + '/2</span></button>').join('');

  const blocks = shown.map(t => {
    const sel = picksFor(t), pool = pickPool(t), full = sel.length >= 2, td = diffFor(t);
    const rows = pool.map(q => {
      const on = sel.indexOf(q.id) > -1;
      return '<button class="pickrow" role="button" aria-pressed="' + on + '"' + (!on && full ? ' disabled' : '') +
        ' data-act="pickToggle" data-t="' + esc(t) + '" data-id="' + q.id + '">' +
        '<span class="tick" aria-hidden="true"></span>' +
        '<span class="pq"><span class="qq">' + esc(q.question) + '</span>' +
        '<span class="qa">' + esc(q.answer) + ' <span class="dim">· ' + esc(Cap(q.difficulty)) +
          (q.use_with ? ' · pairs with “' + esc(q.use_with) + '”' : '') + '</span></span></span></button>';
    }).join('');
    return '<div class="stack" style="gap:8px">' +
      '<div class="row between">' +
        '<div class="eyebrow gold">' + esc(t) + ' <span class="dim">· ' + esc(Cap(td)) + '</span></div>' +
        '<div class="row" style="gap:8px">' +
          '<span class="badge ' + (full ? 'ok' : sel.length ? 'no' : 'line') + '">' + sel.length + ' of 2 ticked</span>' +
          (sel.length ? '<button class="btn sm ghost" data-act="pickThemeClear" data-t="' + esc(t) + '">Clear</button>' : '') +
        '</div>' +
      '</div>' +
      (pool.length
        ? '<div class="picklist">' + rows + '</div>'
        : '<div class="empty">Nothing in this theme at ' + esc(Cap(td)) + ' difficulty' + (S.settings.noRepeat ? ' that has not been played' : '') + '.</div>') +
    '</div>';
  }).join('<hr class="hair">');

  return '<div class="stack">' +
    '<div class="row between">' +
      '<div><div class="eyebrow gold">Optional</div><h3 class="display">Pick tonight&rsquo;s questions</h3></div>' +
      '<div class="row" style="gap:10px">' +
        '<span class="badge ' + (done ? 'gold' : 'line') + '">' + done + ' of ' + c.themes.length + ' themes set</span>' +
        /* Done is at the foot of a long modal — after fifty questions that is a
           long way to scroll to get out. Same action, reachable from the top. */
        '<button class="xbtn" data-act="pickDone" aria-label="Close">&times;</button>' +
      '</div>' +
    '</div>' +
    /* No single difficulty to quote any more — a theme can be running on its
       own, so each theme heading carries its own and the list under it obeys
       that one. */
    '<p class="help">Two per theme — one for each team. Each theme shows only questions at <strong>its own difficulty</strong>' +
      (S.settings.noRepeat ? ', minus anything already played' : '') + '. Themes you leave empty get a matched pair picked for them.</p>' +
    /* NOT sticky. Pinned to the top it was fine with four themes and a wall
       with fourteen — ten wrapped rows of chips covering most of the modal and
       sitting over the questions. It scrolls away with everything else now. */
    '<div class="chips pickfilter">' + filterChips + '</div>' +
    '<hr class="hair" style="margin:2px 0 0">' +
    blocks +
    miniPickBlocks() +
    '<hr class="hair">' +
    '<div class="btn-row end">' +
      '<button class="btn ghost" data-act="pickClearAll">Clear everything</button>' +
      '<button class="btn gold" data-act="pickDone">Done</button>' +
    '</div>' +
  '</div>';
}
/* --------------------------------------------------------------------------
   HAND-PICKING THE MINI-GAMES
   Same idea as the themes, and same rule: only what is actually on tonight's
   card is offered. Picking questions for a mini-game the host has not selected
   would be work thrown away, so those blocks simply are not drawn.
   Under-filling is fine — pick two auction categories out of three and the
   third is drawn for you. Picks lead, the bank makes the numbers up.
   -------------------------------------------------------------------------- */
const MINI_PICKS = {
  closest:{ store:'pickClosest', type:'closest', cap:CLOSEST_LEGS, label:'Closest To Wins',
            help:'Number questions, in the order you tick them. Anything short is dealt from the bank as usual.' },
  auction:{ store:'pickAuction', type:'auction', cap:AUCTION_LEGS, label:'The Auction',
            help:'Categories, in the order you tick them. Anything short is drawn from the bank.' },
  saysame:{ store:'pickSaySame', type:'saysame', cap:SAYSAME_LEGS, label:"Don't Say the Same as Me",
            help:'Prompts, in the order you tick them. Anything short is dealt from the bank as usual — vast prompts play first, tight ones last.' }
};
function miniPicksFor(key){ return (S.setup && S.setup[MINI_PICKS[key].store]) || []; }
function miniPickBlocks(){
  const c = S.setup;
  return Object.keys(MINI_PICKS).filter(k => (c.minis || []).indexOf(k) > -1).map(k => {
    const m = MINI_PICKS[k];
    const sel = miniPicksFor(k), full = sel.length >= m.cap;
    const pool = S.bank.filter(q => q.type === m.type && isFresh(q) &&
      (m.type !== 'saysame' || (q.pool || []).length >= 2));
    const rows = pool.map(q => {
      const on = sel.indexOf(q.id) > -1;
      return '<button class="pickrow" role="button" aria-pressed="' + on + '"' + (!on && full ? ' disabled' : '') +
        ' data-act="miniPickToggle" data-k="' + k + '" data-id="' + q.id + '">' +
        '<span class="tick" aria-hidden="true"></span>' +
        '<span class="pq"><span class="qq">' + esc(q.question) + '</span>' +
        /* Closest To Wins is a number — the answer IS the useful line, and its
           note is a source citation nobody picks a question on. The auction has
           no answer worth printing ("Host counts"), so it shows its ruling. A
           Say-Same prompt has no FIXED answer to show — one is drawn fresh
           each time it is played — so it shows the pool instead, which is the
           thing the host is actually choosing between prompts on. */
        (m.type === 'closest' ? '<span class="qa">' + esc(q.answer) + '</span>'
         : m.type === 'saysame' ? '<span class="qa dim">' + esc(q.pool.join(' · ')) + '</span>'
         : q.notes ? '<span class="qa dim">' + esc(q.notes) + '</span>' : '') +
        '</span></button>';
    }).join('');
    return '<hr class="hair">' +
      '<div class="stack" style="gap:8px">' +
        '<div class="row between">' +
          '<div class="eyebrow gold">' + m.label + '</div>' +
          '<div class="row" style="gap:8px">' +
            '<span class="badge ' + (full ? 'ok' : sel.length ? 'gold' : 'line') + '">' + sel.length + ' of ' + m.cap + ' ticked</span>' +

/* standalone pausable countdown for modals (Call a Friend) */
var cdId = null;
const CD = {
  left:0, base:0, t0:0, running:false, node:'', lastWhole:null,
  start(sec, nodeId){
    this.stop();
    this.left = sec; this.base = sec; this.node = nodeId; this.lastWhole = Math.ceil(sec);
    this.t0 = performance.now(); this.running = true;
    this.paint(); this.loop();
  },
  loop(){
    const self = this;
    cdId = setInterval(function(){
      self.left = Math.max(0, self.base - (performance.now() - self.t0) / 1000);
      const w = Math.ceil(self.left);
      if(w !== self.lastWhole){
        self.lastWhole = w;
        if(w <= 10 && w > 0 && S.settings.tick && S.settings.sound) Snd.tick();
      }
      self.paint();
      if(self.left <= 0){ self.stop(); Snd.alarm(); }
    }, 80);
  },
  toggle(){
    if(this.left <= 0) return;
    if(this.running){ clearInterval(cdId); cdId = null; this.running = false; }
    else { this.base = this.left; this.t0 = performance.now(); this.running = true; this.loop(); }
    this.paint();
  },
  add(s){ if(this.left <= 0) return; this.left += s; this.base += s; this.paint(); },
  stop(){ clearInterval(cdId); cdId = null; this.running = false; },
  paint(){
    const n = el(this.node); if(n) n.textContent = Math.ceil(this.left);
    const b = $('[data-act="cdToggle"]');
    if(b) b.textContent = this.left <= 0 ? 'Time up' : (this.running ? 'Pause' : 'Resume');
  }
};

    '<div class="v num">' + b.score[c] + '</div>' +

/* one tick per question — filled for a hit, hollow for a miss */
function battleTrack(c){
  const b = G().battle;

/* End of ONE leg. The bidder either delivered or they did not; the other team
   takes it if they did not. A leg always has exactly one winner, and with an
   odd number of legs the auction can never finish level. */
function auctionResolve(){
  const g = G(), a = g.auction;
  Timer.stop();
  const made = a.count >= a.bid;
  const won  = made ? a.by : otherTeam(a.by);
  a.wins[won]++;
  a.legs.push({ q:a.q, bid:a.bid, by:a.by, count:a.count, made, won });
  Snd[made ? 'correct' : 'wrong']();
  go('auctionLeg');
}
/* All legs played — the auction itself is what pays, not the individual legs */
function auctionFinish(){
  const g = G(), a = g.auction;
  a.done = true;
  a.winner = a.wins[0] > a.wins[1] ? 0 : 1;
  if(!a.awarded){
    a.awarded = true;
    a.award = [a.winner === 0 ? g.miniPts : 0, a.winner === 1 ? g.miniPts : 0];
    g.teams[a.winner].score += g.miniPts;
    Snd.point();
  }
  go('auctionResult');
}

/* one leg down — who took it, and what is still to play */
SCREENS.auctionLeg = function(){
  const g = G(), a = g.auction;
  const L = a.legs[a.legs.length - 1];
  const bidder = g.teams[L.by], win = g.teams[L.won];
  const more = a.leg + 1 < a.n;
  /* A between-legs card, not a results page — it is on screen for four seconds

function sayLegLabel(){
  const s = G().saySame;
  const i = Math.min(s.i, s.qs.length - 1);
  return i >= s.base ? 'Tie-breaker leg ' + (i - s.base + 1) : 'Leg ' + (i + 1) + ' of ' + s.base;
}
function sayDots(){
  const s = G().saySame;

}

function confetti(){
  const c = document.createElement('div');
  c.className = 'confetti';
  const cols = ['#F5C518','#FFE58A','#31C9F7','#FF4D82','#FFFFFF'];
  for(let i = 0; i < 90; i++){
    const s = document.createElement('i');
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.background = cols[i % cols.length];
    s.style.animationDuration = (2.6 + Math.random() * 2.4) + 's';
    s.style.animationDelay = (Math.random() * 1.6) + 's';
    s.style.opacity = String(0.55 + Math.random() * 0.45);
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 7000);
}

/* ==========================================================================
   19b. SOLO — practice on your own
   ==========================================================================
   A different shape of thing to the party game, and deliberately so. There is
   no second team, so there are no pairs, no steals and no lifelines; there is
   no host, so nobody can judge an answer but the player.

   Three consequences worth stating, because each one was a choice:

   1. YOU MARK YOURSELF. Question, ten seconds, answer, "Got it / Missed it".
      Multiple choice would be firmer, but the bank holds no wrong options and
      inventing them from other answers gives you "Canberra / a pride / Khalil
      Gibran" — a giveaway, not a question. Honest-system beats a fake one.

   2. SOLO NEVER BURNS A QUESTION. It does not read the played-question memory
      and it does not write to it. Practising on a Tuesday must not empty the
      good material out of Friday's party game, which is exactly what would
      happen if solo shared that memory.

   3. NOTHING IS RECORDED. Game history is a two-team format — names, scores,
      a winner. A solo run has none of those, so it stays out rather than
      arriving there malformed. The result lives on the last screen.
   ========================================================================== */
const SOLO_SECS   = 10;                       // fixed. Not the host's timers.
const SOLO_COUNTS = [10, 20, 30, 40, 50];

/* Barred outright, never offered. Every "Know the Host" answer in the bank is
   the literal string "Host knows this one" — the answer lives in the host's
   head, not in the file. That is fine with a host in the room and useless
   without one: solo would reveal "Host knows this one" and ask you to mark
   yourself against it. BATTLE_SKIP_THEMES bars it for the same reason. */
const SOLO_SKIP_THEMES = ['Know the Host'];
const soloThemes = () => THEMES.filter(t => SOLO_SKIP_THEMES.indexOf(t) < 0);

function defaultSolo(){
  return { diff:'mixed', themes:[], n:10, qs:[], i:0, got:0 };
}
/* An empty themes list means every theme SOLO ALLOWS — the "All themes" chip.
   The skip list is applied here as well as in the chips, so a barred theme
   cannot reach the pool even if it somehow lands in s.themes. Note the absence
   of isFresh(): see (2) above. */
function soloPool(cfg){
  const s = cfg || S.solo;
  return S.bank.filter(q =>
    q.type === 'standard' &&
    SOLO_SKIP_THEMES.indexOf(q.theme) < 0 &&
    (s.diff === 'mixed' || q.difficulty === s.diff) &&
    (!s.themes.length || s.themes.indexOf(q.theme) > -1));
}

SCREENS.soloSetup = function(){
  const s = S.solo = S.solo || defaultSolo();
  const avail = soloPool().length;

  const diffBtns = ['easy','medium','hard','mixed'].map(d =>
    '<button data-act="soloDiff" data-d="' + d + '" aria-pressed="' + (s.diff === d) + '" class="' +
      (s.diff === d ? 'gold' : '') + '">' + Cap(d) + '</button>').join('');

  const themeChips =
    '<button class="chip" role="button" aria-pressed="' + (!s.themes.length) + '" data-act="soloAll">All themes</button>' +
    soloThemes().map(t => {
      const n = soloPool({ diff:s.diff, themes:[t] }).length;
      const on = s.themes.indexOf(t) > -1;
      return '<button class="chip' + (n ? '' : ' thin') + '" role="button" aria-pressed="' + on +
        '" data-act="soloTheme" data-t="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('');

  /* A count you cannot fill is dead, not hidden — seeing 50 greyed out tells
     you the bank is the limit far better than 50 quietly missing would. */
  const nBtns = SOLO_COUNTS.map(n =>
    '<button data-act="soloN" data-n="' + n + '" aria-pressed="' + (s.n === n) + '"' +
      (avail < n ? ' disabled title="Only ' + avail + ' questions match"' : '') +
      ' class="' + (s.n === n ? 'gold' : '') + '">' + n + '</button>').join('');

  const ok = avail >= s.n && avail > 0;

  return '<div class="stack lg" style="padding-top:12px">' +
    '<div class="row between">' +
      '<div><div class="eyebrow gold">Solo</div><h2 class="display">Play on your own</h2></div>' +
      '<button class="btn ghost sm" data-act="go" data-to="home">Back</button>' +
    '</div>' +

    '<div class="card pad lit stack">' +
      '<div class="sec-head"><div class="eyebrow gold">01</div><h3 class="display">Difficulty</h3></div>' +
      '<div class="seg">' + diffBtns + '</div>' +
    '</div>' +

    '<div class="card pad lit stack">' +
      '<div class="sec-head"><div class="eyebrow gold">02</div><h3 class="display">Themes</h3>' +
        '<span class="badge line">' + (s.themes.length ? s.themes.length + ' picked' : 'All') + '</span></div>' +
      '<div class="chips theme-chips">' + themeChips + '</div>' +
    '</div>' +

    '<div class="card pad lit stack">' +
      '<div class="sec-head"><div class="eyebrow gold">03</div><h3 class="display">How many questions?</h3>' +
        '<span class="badge ' + (ok ? 'ok' : 'no') + '">' + avail + ' available</span></div>' +
      '<div class="seg" style="flex-wrap:wrap">' + nBtns + '</div>' +
    '</div>' +

    (ok ? '' : '<div class="warnbox"><strong>' +
      (avail ? 'Only ' + avail + ' questions match.</strong> Add themes, or drop to a smaller round.'
             : 'Nothing matches.</strong> Widen the themes or the difficulty.') + '</div>') +

    '<p class="help">Ten seconds a question. You mark your own answer — there is no host to argue with. Nothing here touches your party game: solo never uses up a question and never lands in your game history.</p>' +

    '<div class="btn-row end">' +
