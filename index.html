<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale + user-scalable: no accidental pinch-zoom mid-game. Nothing
     here is small enough to need magnifying, and a stray two-finger drag used
     to leave the host panning around a zoomed board looking for the buttons. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>QUIZ ME BABY</title>

<!-- HOME-SCREEN WEB CLIP ----------------------------------------------------
     Without an apple-touch-icon iOS invents a tile from the first letter of
     the title, which is why everyone who saved this got a grey "Q".
     apple-mobile-web-app-title is what iOS pre-fills the name field with, so
     the tile reads "Quiz Me Baby" instead of the title's "QUIZMEBABY...".
     Icon path stays RELATIVE — this is a project page under /<repo>/, so a
     leading slash would resolve to the wrong root and bring the Q back.
     Status bar is "black", not "black-translucent": nothing in the layout
     pads for env(safe-area-inset-top), so translucent would run the logo up
     under the notch.
     ------------------------------------------------------------------------->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Quiz Me Baby">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#04050e">

<!-- Tell Safari not to sit on a stale copy. Belt and braces next to the
     version check further down, which is what actually forces the update. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM — "Stage Gold"
   Theater/Cinema palette (dramatic dark + spotlight gold)
   × OLED dark base × Aurora spotlight gradients
   ============================================================ */
:root{
  --bg:#04050e;
  --bg-2:#0b0e24;
  --stage:#12163a;

  --ink:#F4F6FF;
  --ink-2:#B9C0DE;
  --ink-3:#7A83AA;

  --gold:#F5C518;
  --gold-2:#FFE58A;
  --gold-dim:rgba(245,197,24,.14);

  --a:#31C9F7;          /* Team A */
  --a-dim:rgba(49,201,247,.14);
  --b:#FF4D82;          /* Team B */
  --b-dim:rgba(255,77,130,.14);

  --ok:#3DDC97;
  --no:#FF5566;
  --warn:#FFA23A;

  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.18);

  --r-s:10px; --r:16px; --r-l:24px; --r-xl:32px;
  --sp-1:8px; --sp-2:12px; --sp-3:16px; --sp-4:24px; --sp-5:32px; --sp-6:48px; --sp-7:64px;

  --shadow:0 30px 70px -24px rgba(0,0,0,.95);
  --shadow-gold:0 0 0 1px rgba(245,197,24,.35), 0 18px 50px -14px rgba(245,197,24,.28);

  --font-d:'Anton','Arial Black','Haettenschweiler',Impact,sans-serif;
  --font:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  --ease:cubic-bezier(.22,1,.36,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* pan-x pan-y allows scrolling and nothing else — it rules out pinch-zoom and
   double-tap-zoom, which is what the meta tag asks for and some browsers
   ignore. A mouse never generates these gestures, so laptops are untouched. */
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  touch-action:pan-x pan-y;
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100svh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
::selection{background:var(--gold);color:#000}

/* ---------- STAGE BACKDROP ---------- */
#stage{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg)}
#stage::before{
  content:'';position:absolute;inset:-30%;
  background:
    radial-gradient(48% 42% at 50% -6%, rgba(245,197,24,.16), transparent 62%),
    radial-gradient(42% 40% at 8% 22%, rgba(49,201,247,.13), transparent 60%),
    radial-gradient(46% 44% at 94% 30%, rgba(255,77,130,.12), transparent 62%),
    radial-gradient(70% 60% at 50% 105%, rgba(24,30,86,.85), transparent 70%);
  animation:drift 22s var(--ease) infinite alternate;
}
#stage::after{ /* vignette + floor line */
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.55), transparent 22%, transparent 62%, rgba(0,0,0,.75)),
    radial-gradient(120% 80% at 50% 50%, transparent 40%, rgba(0,0,0,.7));
}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(0,-3%,0) scale(1.07)}
}
#grid{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(100% 70% at 50% 30%,#000,transparent 75%);
}
@media (prefers-reduced-motion:reduce){
  #stage::before{animation:none}
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ---------- SHELL ---------- */
#shell{position:relative;min-height:100svh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:var(--sp-4) var(--sp-4) var(--sp-7)}
@media(max-width:640px){ main{padding:var(--sp-3) var(--sp-3) var(--sp-6)} }

/* ---------- TYPE ---------- */
.display{font-family:var(--font-d);font-weight:400;letter-spacing:.01em;line-height:.92;text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow.gold{color:var(--gold)}
h1.display{font-size:clamp(38px,7vw,86px)}
h2.display{font-size:clamp(26px,4.4vw,48px)}
h3.display{font-size:clamp(20px,3vw,30px)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* ---------- SURFACES ---------- */
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.022));
  border:1px solid var(--line);
  border-radius:var(--r-l);
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.card.pad{padding:var(--sp-4)}
.card.tight{padding:var(--sp-3);border-radius:var(--r)}
.hair{height:1px;background:var(--line);border:0;margin:var(--sp-3) 0}

/* gold top-lit card */
.lit{position:relative;overflow:hidden}
.lit::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.9}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:0 22px;border-radius:var(--r);
  background:var(--glass);border:1px solid var(--line-2);
  font-weight:600;font-size:15px;letter-spacing:.02em;
  transition:transform .16s var(--ease),background .16s,border-color .16s,box-shadow .16s;
}
.btn:hover{background:var(--glass-2);border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled]{opacity:.34;pointer-events:none}
.btn.lg{min-height:64px;font-size:17px;padding:0 34px;border-radius:var(--r-l)}
.btn.sm{min-height:40px;font-size:13px;padding:0 14px;border-radius:var(--r-s)}
.btn.block{width:100%}
.btn.gold{
  background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1A1400;border-color:transparent;
  box-shadow:var(--shadow-gold);font-weight:800;
}
.btn.gold:hover{filter:brightness(1.07)}
.btn.ok{background:linear-gradient(180deg,rgba(61,220,151,.95),rgba(38,180,120,.95));color:#04240f;border-color:transparent;font-weight:800}
.btn.no{background:linear-gradient(180deg,rgba(255,85,102,.95),rgba(214,52,70,.95));color:#2b0206;border-color:transparent;font-weight:800}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,85,102,.45);color:#FF8A96}
.btn.teamA{border-color:rgba(49,201,247,.5);background:var(--a-dim);color:#BDECFF}
.btn.teamB{border-color:rgba(255,77,130,.5);background:var(--b-dim);color:#FFC7D8}

.btn-row{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.btn-row.end{justify-content:flex-end}
.btn-row.center{justify-content:center}

/* ---------- HUD (always-on tracker) ---------- */
#hud{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(4,5,14,.92),rgba(4,5,14,.62) 70%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  padding:10px max(var(--sp-4),env(safe-area-inset-left)) 14px;
}
.hud-in{max-width:1240px;margin:0 auto;padding-right:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--sp-3)}
.hud-team{display:flex;align-items:center;gap:10px;min-width:0}
.hud-team.b{justify-content:flex-end}
.hud-team .dot{width:10px;height:10px;border-radius:50%;flex:none}
.hud-team .nm{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.hud-team .sc{font-family:var(--font-d);font-size:30px;line-height:1;letter-spacing:.02em}
.hud-team.a .sc{color:var(--a)} .hud-team.a .dot{background:var(--a);box-shadow:0 0 12px var(--a)}
.hud-team.b .sc{color:var(--b)} .hud-team.b .dot{background:var(--b);box-shadow:0 0 12px var(--b)}
.hud-mid{min-width:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.hud-label{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.hud-label b{color:var(--gold);font-weight:700}

/* progress pips: ● standard  ▬ closest-to */
.pips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}
.pip{height:8px;width:8px;border-radius:50%;background:rgba(255,255,255,.16);transition:all .3s var(--ease)}
.pip.mini{width:26px;border-radius:5px;background:rgba(255,255,255,.16)}
.pip.done{background:var(--ink-2)}
.pip.done.mini{background:var(--ink-2)}
.pip.now{background:var(--gold);box-shadow:0 0 0 4px var(--gold-dim),0 0 14px var(--gold);animation:pulse 1.8s ease-in-out infinite}
.pip.now.mini{width:30px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.hud-actions{position:absolute;top:50%;right:10px;transform:translateY(-50%)}
@media(max-width:900px){
  .hud-in{grid-template-columns:1fr 1fr;row-gap:10px}
  .hud-mid{grid-column:1 / -1;grid-row:2}
  .hud-team .nm{max-width:96px;font-size:11px}
  .hud-team .sc{font-size:26px}
  .hud-actions{top:14px;transform:none}
}

/* ---------- HOME ---------- */
.home{position:relative;min-height:calc(100svh - 40px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:clamp(18px,3vh,32px);padding:clamp(16px,3vh,40px) 0}
.home-main{display:flex;flex-direction:column;align-items:center;gap:inherit;width:min(460px,100%)}
/* The host stands beside the menu, not in the row with it — he is taken out of
   the flow so the logo and buttons stay dead centre on the screen. */
.mascot{position:absolute;top:50%;right:calc(50% + 250px);transform:translateY(-50%);
  width:min(320px,calc(50vw - 280px));max-height:76svh;object-fit:contain;
  filter:drop-shadow(0 26px 44px rgba(0,0,0,.65)) drop-shadow(0 0 48px rgba(245,197,24,.16));
  animation:mascotIn .7s var(--ease) both;pointer-events:none;user-select:none;-webkit-user-drag:none}
@keyframes mascotIn{from{opacity:0;transform:translate(0,calc(-50% + 20px)) scale(.95)}
  to{opacity:1;transform:translateY(-50%)}}
.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{
  font-family:var(--font-d);font-size:clamp(44px,7vw + 2vh,116px);line-height:.86;text-transform:uppercase;
  background:linear-gradient(180deg,#FFF7DA 6%,var(--gold-2) 34%,var(--gold) 62%,#B98A05 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 10px 30px rgba(245,197,24,.28));
  letter-spacing:.01em;
}
/* Phones: same idea as desktop, just tighter — the wordmark keeps its exact
   centred position and he stands in the gutter beside it. He is NOT put into
   the flow next to the logo; that would push the wordmark off centre.

   The width trick: .logo-wrap is shrink-to-fit and centred in the viewport,
   so the free space on each side of it is exactly (100vw - 100%)/2, where
   100% is .logo-wrap's own width. That is the gutter, measured for us by the
   layout engine at whatever size the logo happens to render. He fills it,
   less a 10px breathing gap from the wordmark and 8px from the screen edge,
   so he is as large as he can be without ever touching the logo.

   The 200px ceiling only bites on wide tablets near the 920px breakpoint,
   where the gutter grows faster than the wordmark and he would otherwise
   tower over the menu. He stays absolute, so mascotInSm must preserve the
   translateY(-50%) that centres him. */
@media(max-width:920px){
  .logo-wrap{position:relative}
  .mascot{
    position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);
    width:min(calc((100vw - 100%) / 2 - 14px), 150px);
    max-height:none;
    animation:mascotInSm .6s var(--ease) both;
    filter:drop-shadow(0 12px 22px rgba(0,0,0,.62)) drop-shadow(0 0 26px rgba(245,197,24,.16))}
}
@keyframes mascotInSm{from{opacity:0;transform:translate(0,calc(-50% + 10px)) scale(.94)}
  to{opacity:1;transform:translateY(-50%)}}
.home-menu{display:grid;gap:var(--sp-2);width:min(420px,100%)}
/* "How to Play": a link, not a fourth button — the rules are for the first
   night, not every night, so they sit quietly under the menu */
.howto{justify-self:center;margin-top:2px;padding:6px 10px;font-size:13px;font-weight:600;letter-spacing:.02em;
  color:var(--ink-2);text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(245,197,24,.6);
  background:none;border:0;cursor:pointer;transition:color .2s var(--ease)}
.howto:hover{color:var(--gold)}
/* the colophon. Meant to be findable, not readable — it sits at the threshold
   of noticing across the room, and comes up to legible when you go looking for
   it — on hover with a mouse, on a tap with a thumb. */
.colophon{
  margin-top:6px;font-size:10px;letter-spacing:.1em;line-height:1.5;
  color:var(--ink-3);opacity:.38;transition:opacity .35s var(--ease);cursor:default;
}
.colophon:hover,.colophon.lit{opacity:.92}
.colophon .sep{opacity:.5;margin:0 2px}
/* a phone has no hover, so it starts a shade up and reveals on tap instead */
@media(hover:none){.colophon{opacity:.5}}
@media(prefers-reduced-motion:reduce){.colophon{transition:none}}
body.homemode main{padding-top:8px;padding-bottom:8px}
.home{min-height:calc(100svh - 20px)}
/* keep the home screen inside one browser window on short displays */
@media(max-height:820px){
  .home{padding:10px 0}
  .home-main{gap:clamp(12px,2vh,20px)}
  .home .btn{min-height:46px;font-size:14px}
  .home .btn.lg{min-height:54px;font-size:16px}
  .home-menu{gap:9px}
}

/* ---------- LAYOUT HELPERS ---------- */
.stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.stack.lg{gap:var(--sp-4)}
.row{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.center{text-align:center}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:var(--sp-3);flex-wrap:wrap}

/* ---------- FORM ---------- */
label.fld{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=number],select,textarea{
  color:var(--ink);          /* don't inherit the dim label colour */
  background:rgba(0,0,0,.35);border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:13px 14px;font-size:15px;font-weight:500;width:100%;
  transition:border-color .16s,background .16s;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:rgba(0,0,0,.5);outline:none}
input::placeholder{color:var(--ink-3)}
/* The two hint placeholders in the team cards. The rule above only reaches
   <input>, so "Comma separated" in the Players <textarea> was falling back to
   whatever grey the browser fancied and never matched "Captain name" beside
   it. Both are set here, and set quieter than a real value — smaller and
   italic, so an empty field reads as a prompt rather than as something
   already filled in. */
[data-act="tf"][data-k="captain"]::placeholder,
[data-act="tf"][data-k="players"]::placeholder{
  color:var(--ink-3);font-size:13px;font-style:italic;font-weight:400;
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
.help{font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-3);line-height:1.5}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--glass);font-size:13px;font-weight:600;letter-spacing:.02em;
  transition:all .16s var(--ease);
}
.chip:hover{border-color:rgba(255,255,255,.32)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1A1400;border-color:transparent;font-weight:800;box-shadow:0 8px 24px -10px rgba(245,197,24,.6)}
.chip .ct{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
/* a theme that cannot field a round at the difficulty it is on. Still
   pressable — the host may be about to change the difficulty. */
.chip.thin{opacity:.42}
.chip.thin[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 1px var(--warn) inset,0 8px 24px -10px rgba(245,197,24,.6)}

/* segmented */
.seg{display:inline-flex;background:rgba(0,0,0,.4);border:1px solid var(--line-2);border-radius:var(--r);padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 16px;border-radius:11px;font-size:13px;font-weight:600;color:var(--ink-2);transition:all .16s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button[aria-pressed="true"].gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1A1400;font-weight:800;box-shadow:none}

/* toggle */
.tgl{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px;padding:8px 4px;cursor:pointer;text-align:left;width:100%}
.tgl .tl{font-size:14px;font-weight:600}
.tgl .sw{width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s var(--ease)}
.tgl .sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .22s var(--ease)}
.tgl[aria-pressed="true"] .sw{background:var(--gold)}
.tgl[aria-pressed="true"] .sw::after{transform:translateX(22px)}

/* Add-a-question: one form, three shapes. Every field is in the markup once
   and the container's data-type picks which are relevant, so switching type
   does not rebuild the dialog or lose what is already typed. */
.qadd .q-only,.qadd .q-newtheme{display:none}
.qadd[data-type="standard"] .q-std,
.qadd[data-type="closest"]  .q-clo,
.qadd[data-type="auction"]  .q-auc,
.qadd[data-type="saysame"]  .q-say,
.qadd[data-type="map"]      .q-map{display:flex}
.qadd[data-type="standard"] p.q-std,
.qadd[data-type="closest"]  p.q-clo,
.qadd[data-type="auction"]  p.q-auc,
.qadd[data-type="saysame"]  p.q-say,
.qadd[data-type="map"]      p.q-map{display:block}
.qadd .q-lab-map,.qadd[data-type="map"] .q-lab-std{display:none}
.qadd[data-type="map"] .q-lab-map{display:inline}
.qadd .map-prev{flex-direction:column;align-items:center;gap:6px}
.qadd .map-prev:empty{display:none}
.qadd .map-prev img{max-width:100%;max-height:180px;border-radius:var(--r-s);border:1px solid var(--line)}
.qadd input[type=file]{font-size:13px;color:var(--ink-2)}
.qadd[data-newtheme="1"] .q-newtheme{display:flex}
.qadd[data-newtheme="1"] p.q-newtheme{display:block}
/* the theme fields live in a grid; a hidden one must not hold its column open */
.qadd .grid2 .q-only{margin:0}

/* the small round close on a modal header */
.xbtn{flex:none;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;
  color:var(--ink-2);background:var(--glass);border:1px solid var(--line-2);
  display:grid;place-items:center;transition:all .16s var(--ease)}
.xbtn:hover{color:var(--ink);border-color:rgba(255,255,255,.32)}

/* the auction — the host's tally while a team is naming against the clock */
.auc-count{display:flex;align-items:baseline;justify-content:center;gap:10px;
  margin:clamp(4px,1.4vh,14px) 0;line-height:1}
.auc-count .n{font-size:clamp(48px,11vh,86px);font-weight:800;color:var(--ink);
  font-variant-numeric:tabular-nums;transition:color .18s var(--ease)}
.auc-count .of{font-size:clamp(20px,4vh,32px);font-weight:700;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.auc-count.hit .n{color:var(--gold)}
/* a thumb target, not a button — it gets hit twenty-odd times in 30 seconds */
.auc-tap{min-height:clamp(54px,8vh,68px);font-size:clamp(15px,2.2vh,18px)}

/* solo — the bar across the top of the question and the answer */
.solo-top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;max-width:760px;margin:0 auto 4px;padding:0 2px}
.solo-track{text-align:center;line-height:1.15;flex:1;min-width:0}
.solo-track .tv{display:block;font-size:clamp(20px,3.4vw,26px);font-weight:800;color:var(--gold);
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.solo-track .tv .sl{opacity:.45;margin:0 2px;font-weight:600}
.solo-track .tc{display:block;font-size:10px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin-top:1px}
.solo-count{flex:none;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* mini-game picker — three rows the host reads once and then leaves alone, so
   they get the tight treatment rather than the full 52px toggle height */
.mini-list{gap:2px}
.tgl.mini-row{min-height:0;padding:7px 4px;gap:12px;align-items:center}
.tgl.mini-row .tl{font-size:13.5px;line-height:1.25}
.tgl.mini-row .help{display:block;font-size:11.5px;line-height:1.35;margin-top:2px}
.std-tgl{border:0;padding:2px 2px 6px}
.std-tgl .tl{font-family:var(--font-d);font-weight:400;font-size:clamp(20px,2.6vw,28px);letter-spacing:.01em;line-height:1;text-transform:uppercase}
.flag-lvl{display:flex;flex-wrap:wrap;gap:4px;margin:-2px 0 6px 4px}
.flag-lvl button{min-height:26px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--ink-3);border:1px solid var(--line)}
.flag-lvl button[aria-pressed="true"]{color:#1A1400;background:var(--gold);border-color:var(--gold)}
.tgl.mini-row .sw{width:44px;height:26px}
.tgl.mini-row .sw::after{width:20px;height:20px}
.tgl.mini-row[aria-pressed="true"] .sw::after{transform:translateX(18px)}

/* advanced game configuration — one button, three sections behind it */
.advbtn{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px;padding:8px 4px;cursor:pointer;text-align:left;width:100%}
.advbtn .tl{font-size:14px;font-weight:600}
.advbtn .help{margin:0}
.advbtn .chev{flex:none;width:28px;height:28px;border-radius:50%;background:var(--glass);border:1px solid var(--line-2);position:relative;transition:transform .22s var(--ease),border-color .16s var(--ease)}
.advbtn .chev::after{content:'';position:absolute;top:9px;left:9px;width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg)}
.advbtn[aria-pressed="true"] .chev{transform:rotate(180deg);border-color:var(--gold)}
.advbtn[aria-pressed="true"] .chev::after{border-color:var(--gold)}

/* difficulty, one row per theme. Name on the left, three pills on the right,
   and nothing else — the row is a control, not a paragraph. */
.tdlist{display:flex;flex-direction:column;gap:4px}
.tdrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:4px 8px;border-radius:var(--r-s);border:1px solid transparent}
.tdrow.set{border-color:rgba(245,197,24,.28);background:rgba(245,197,24,.05)}
/* nothing can be drawn for this theme at the difficulty it is on. The capacity
   warning at the foot of the screen says so in words; this just points at it. */
.tdrow.dead{border-color:rgba(255,162,58,.45)}
.tdname{font-size:13.5px;font-weight:600;min-width:0}
.seg.tiny{padding:3px;gap:3px}
.seg.tiny button{min-height:29px;padding:0 10px;font-size:12px;border-radius:8px}
/* the difficulty this theme has because nobody changed it — lit, but hollow,
   so a glance separates "I chose this" from "this is just the house setting" */
.seg button[aria-pressed="true"].inherit{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:rgba(255,255,255,.14);padding:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,var(--gold-2),var(--gold));cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:var(--gold);cursor:pointer}

/* ---------- TEAM PANELS ---------- */
.team-card{border-radius:var(--r-l);padding:var(--sp-4);border:1px solid var(--line);position:relative;overflow:hidden}
.team-card.a{background:linear-gradient(180deg,rgba(49,201,247,.10),rgba(255,255,255,.02));border-color:rgba(49,201,247,.3)}
.team-card.b{background:linear-gradient(180deg,rgba(255,77,130,.10),rgba(255,255,255,.02));border-color:rgba(255,77,130,.3)}
.team-tag{font-family:var(--font-d);font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.team-card.a .team-tag{color:var(--a)} .team-card.b .team-tag{color:var(--b)}

/* ---------- QUESTION STAGE ---------- */
.spot{position:relative;text-align:center;padding:var(--sp-5) var(--sp-4);border-radius:var(--r-xl);overflow:hidden}
.spot.a{background:radial-gradient(80% 120% at 50% -20%,rgba(49,201,247,.20),transparent 65%)}
.spot.b{background:radial-gradient(80% 120% at 50% -20%,rgba(255,77,130,.20),transparent 65%)}
.q-theme{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;border:1px solid var(--line-2);background:rgba(0,0,0,.4);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.q-text{
  font-size:clamp(20px,1.9vw + .5vh,32px);font-weight:700;line-height:1.22;letter-spacing:-.01em;
  max-width:30ch;margin:clamp(8px,1.5vh,18px) auto;text-wrap:balance;
}
/* who the question belongs to — must be unmissable at a glance */
.whofor{
  margin-top:clamp(8px,1.4vh,16px);
  font-family:var(--font-d);font-size:clamp(15px,2.2vh,22px);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.whofor b{color:var(--gold);font-weight:400;letter-spacing:.1em;font-size:1.35em;
  text-shadow:0 0 26px rgba(245,197,24,.5)}
.whofor.a b{color:var(--a);text-shadow:0 0 26px rgba(49,201,247,.55)}
.whofor.b b{color:var(--b);text-shadow:0 0 26px rgba(255,77,130,.55)}
/* team name inline in a sentence */
.tn.a{color:var(--a)} .tn.b{color:var(--b)}

/* host-only answer peek — deliberately small and quiet so it reads as a
   utility, not as part of the show */
.peek{border:1px dashed var(--line-2);border-radius:var(--r-s);background:rgba(0,0,0,.35);
  max-width:520px;margin:14px auto 0;text-align:left;overflow:hidden}
.peek summary{cursor:pointer;list-style:none;padding:10px 14px;font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);user-select:none}
.peek summary::-webkit-details-marker{display:none}
.peek summary::before{content:'▸ ';color:var(--gold)}
.peek[open] summary::before{content:'▾ '}
.peek summary:hover{color:var(--ink-2)}
.peek-body{padding:0 14px 14px;font-size:17px;color:var(--gold)}
.row > .peek{margin:0;flex:1}

/* compact vertical rhythm for dense result screens */
.compact{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px)}
.compact .spot{padding:clamp(10px,1.8vh,20px) var(--sp-3)}
.compact .q-answer{font-size:clamp(28px,5vh,52px)}
.compact .q-note{font-size:13px;margin-top:8px;line-height:1.5}
.compact .card.pad{padding:clamp(12px,1.8vh,18px)}
.compact .fld{gap:5px}
.compact input[type=text]{padding:10px 12px;font-size:15px}
.compact .calc-out{min-height:44px;padding:8px 10px;font-size:12px}
.compact .hair{margin:10px 0}
.compact .q-text{font-size:clamp(17px,3.1vh,26px);margin:clamp(6px,1.1vh,12px) auto}
.compact .q-theme{font-size:clamp(10px,1.5vh,12px);padding:6px 14px}
.compact .reader{font-size:clamp(12px,1.7vh,14px);margin-top:clamp(6px,1vh,12px)}
.compact .btn.lg{min-height:52px;font-size:15px}

/* ---- ONE-SCREEN PLAY MODE ----
   The ask / steal / mini question screens must fit a laptop without scrolling. */
body.playmode main{padding-top:4px;padding-bottom:6px}
.play{min-height:calc(100svh - 96px);display:flex;flex-direction:column;gap:clamp(6px,1.1vh,14px)}
.play .spot{justify-content:safe center}
.play .spot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(12px,2vh,28px) var(--sp-3);gap:clamp(6px,1vh,12px)}
.play .q-theme{font-size:clamp(10px,1.5vh,12px);padding:6px 14px}
.play .timer{width:min(200px,26svh)}
.play .timer .val{font-size:min(68px,11svh)}
.play .card.pad{padding:clamp(10px,1.6vh,18px)}
/* lifelines collapse to a compact 3-across strip so the round always fits */
.play .ll-grid{grid-template-columns:repeat(3,1fr)}
.play .ll{flex-direction:row;min-height:50px;padding:8px 10px;gap:8px;justify-content:center}
.play .ll .ic{width:19px;height:19px}
.play .ll .nm{font-size:11px;letter-spacing:.05em;text-align:left}
.play .ll.spent::after{position:static;margin-left:4px}
body.playmode #hud{padding-top:6px;padding-bottom:8px}
@media(max-height:760px){
  .play .timer{width:min(196px,27svh)}
  .play .spot{padding:8px var(--sp-2)}
  .play .reader{display:none}
  /* The two intro screens carry a five-line rules list, which makes them the
     tallest fixed blocks in the app. On a 720p laptop lid that was 23px more
     than the window. Keyed on height, not on phone-vs-laptop, because a short
     screen is a short screen — the phone tiers below tighten it further. */
  .intro-screen{gap:14px}
  .intro-head{gap:6px!important}
  .intro-head .mini-band{margin:4px auto!important}
  .intro-screen .card.pad{padding:16px}
  .intro-rules{gap:9px!important;line-height:1.5!important}
}
/* Shorter again — a laptop window dragged small, or a netbook lid. Still no
   width test: 1366x640 is as short as 375x640 and needs the same answer. The
   display type stops scaling with the WIDTH here and starts scaling with the
   height, which is what actually ran out. */
@media(max-height:660px){
  .intro-screen{gap:11px;padding-top:8px!important}
  .intro-head h1.display{font-size:clamp(26px,7vh,44px)}
  .intro-head .reader{font-size:12.5px;line-height:1.4}
  .intro-screen .card.pad{padding:12px}
  .intro-rules{gap:6px!important;font-size:12.5px!important;line-height:1.4!important}
  .intro-screen .btn.lg{min-height:46px}
}
.q-answer{
  font-family:var(--font-d);font-size:clamp(30px,5.4vw,64px);line-height:1;text-transform:uppercase;
  background:linear-gradient(180deg,#FFF7DA,var(--gold) 70%,#C79306);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:reveal .5s var(--ease) both;
}
@keyframes reveal{from{opacity:0;transform:translateY(14px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.q-note{max-width:56ch;margin:var(--sp-3) auto 0;font-size:15px;line-height:1.6;color:var(--ink-2);animation:reveal .5s .1s var(--ease) both}
.reader{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- TIMER ---------- */
.timer{position:relative;width:min(260px,62vw);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer .trk{fill:none;stroke:rgba(255,255,255,.09);stroke-width:9}
.timer .bar{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;
  stroke-dasharray:565.487;transition:stroke-dashoffset .25s linear,stroke .4s}
.timer.warn .bar{stroke:var(--warn)}
.timer.crit .bar{stroke:var(--no)}
.timer .val{font-family:var(--font-d);font-size:clamp(52px,11vw,86px);line-height:1;color:var(--ink);letter-spacing:.02em}
.timer.crit .val{color:var(--no);animation:tick 1s steps(1) infinite}
.timer .cap{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
@keyframes tick{0%,60%{opacity:1}61%,100%{opacity:.55}}
.timer.done .val{color:var(--no)}

/* ---------- LIFELINES ---------- */
.ll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.ll-grid{grid-template-columns:1fr}}
.ll{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 12px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--glass);text-align:center;min-height:104px;justify-content:center;
  transition:all .18s var(--ease);position:relative;overflow:hidden;
}
.ll:hover:not([disabled]){border-color:var(--gold);background:var(--gold-dim);transform:translateY(-2px)}
.ll[disabled]{opacity:.3;pointer-events:none}
.ll.spent{opacity:.28;pointer-events:none}
.ll.spent::after{content:'USED';position:absolute;inset:auto 0 8px;font-size:10px;letter-spacing:.24em;color:var(--no);font-weight:800}
.ll .ic{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ll .nm{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
/* spent Double Points — struck through in red, same language as the strip below */
.ll.usedup{opacity:1;border-color:rgba(255,85,102,.35);background:rgba(255,85,102,.07)}
.ll.usedup .ic{stroke:rgba(255,85,102,.5)}
.ll.usedup .nm{color:var(--no);text-decoration:line-through;text-decoration-thickness:2px}
/* remaining-lifeline strip — sits flush under the Double Points box */
.ll-inv{display:grid;gap:8px}
.ll-inv .badge{justify-content:center;width:100%;min-height:36px;font-size:11.5px}
.ll.armed{border-color:var(--gold);background:linear-gradient(180deg,rgba(245,197,24,.25),rgba(245,197,24,.08));box-shadow:var(--shadow-gold)}
.ll.armed .ic{fill:var(--gold);filter:drop-shadow(0 0 12px rgba(245,197,24,.8));transform:scale(1.14)}
.ll .ic{transition:fill .25s var(--ease),transform .25s var(--ease)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.badge.gold{background:var(--gold);color:#1A1400}
.badge.a{background:var(--a-dim);color:var(--a);border:1px solid rgba(49,201,247,.4)}
.badge.b{background:var(--b-dim);color:var(--b);border:1px solid rgba(255,77,130,.4)}
.badge.ok{background:rgba(61,220,151,.16);color:var(--ok);border:1px solid rgba(61,220,151,.4)}
.badge.no{background:rgba(255,85,102,.16);color:var(--no);border:1px solid rgba(255,85,102,.4)}
.badge.line{background:transparent;color:var(--ink-3);border:1px solid var(--line-2)}

/* ---------- SCOREBOARD ---------- */
.score-big{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--sp-4);align-items:center}
@media(max-width:640px){.score-big{grid-template-columns:1fr;gap:var(--sp-2)}.vs{text-align:center}}
.score-cell{text-align:center;padding:var(--sp-4) var(--sp-3);border-radius:var(--r-l);border:1px solid var(--line)}
.score-cell.a{background:radial-gradient(70% 100% at 50% 0%,rgba(49,201,247,.16),transparent);border-color:rgba(49,201,247,.28)}
.score-cell.b{background:radial-gradient(70% 100% at 50% 0%,rgba(255,77,130,.16),transparent);border-color:rgba(255,77,130,.28)}
.score-cell .v{font-family:var(--font-d);font-size:clamp(56px,12vw,104px);line-height:.9}
.score-cell.a .v{color:var(--a)} .score-cell.b .v{color:var(--b)}
.score-cell .n{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin-top:8px}
.vs{font-family:var(--font-d);font-size:22px;color:var(--ink-3);letter-spacing:.1em}
.delta{font-size:12px;color:var(--ok);font-weight:700;letter-spacing:.1em}

/* ---------- MINI GAME ---------- */
.mini-band{
  display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 20px;border-radius:999px;
  background:linear-gradient(90deg,rgba(245,197,24,.12),rgba(245,197,24,.24),rgba(245,197,24,.12));
  border:1px solid rgba(245,197,24,.35);
}
/* the auction runs one of these on every screen, so it gets a slimmer build */
.mini-band.tight{gap:8px;padding:7px 14px;margin:4px auto;flex-wrap:wrap}
.mini-band.tight .eyebrow{font-size:11px;letter-spacing:.14em}
/* team colours on an eyebrow — .tn.a/.tn.b already do this for inline names */
.eyebrow.a{color:var(--a)} .eyebrow.b{color:var(--b)}
.mini-band{flex-wrap:wrap;max-width:100%;row-gap:6px}
.mini-band .eyebrow{white-space:nowrap}
.mini-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-width:0}
@media(max-width:520px){ .mini-dots{gap:4px} .mini-dots i{width:16px} .mini-band{padding:10px 14px} }
.mini-dots i{width:24px;height:6px;border-radius:3px;background:rgba(255,255,255,.16)}
.mini-dots i.a{background:var(--a)} .mini-dots i.b{background:var(--b)} .mini-dots i.t{background:var(--gold)}
/* ---------- BATTLE OF THE CAPTAINS ----------
   A slim always-on scoreline. Unlike .score-big it stays three-across on a
   phone — the whole point is seeing both captains at a glance, and stacking
   it would push the question off a 390px screen. */
.bt-counter{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--sp-3);align-items:center}
.bt-cell{text-align:center;padding:10px var(--sp-2);border-radius:var(--r-l);
  border:1px solid var(--line);background:rgba(255,255,255,.02);transition:all .3s var(--ease)}
.bt-cell.a{border-color:rgba(49,201,247,.24)} .bt-cell.b{border-color:rgba(255,77,130,.24)}
/* the captain who is actually answering right now */
.bt-cell.live.a{background:radial-gradient(70% 100% at 50% 0%,rgba(49,201,247,.18),transparent);
  border-color:var(--a);box-shadow:0 0 0 1px rgba(49,201,247,.25)}
.bt-cell.live.b{background:radial-gradient(70% 100% at 50% 0%,rgba(255,77,130,.18),transparent);
  border-color:var(--b);box-shadow:0 0 0 1px rgba(255,77,130,.25)}
.bt-cell .v{font-family:var(--font-d);font-size:clamp(30px,5.4vw,46px);line-height:.95}
.bt-cell.a .v{color:var(--a)} .bt-cell.b .v{color:var(--b)}
.bt-cell .n{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-top:5px}
.bt-cell .t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.bt-track{display:flex;gap:4px}
.bt-track i{width:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.16)}
.bt-track i.y{background:var(--ok)} .bt-track i.n{background:rgba(255,255,255,.32)}
.eyebrow.ta{color:var(--a)} .eyebrow.tb{color:var(--b)}

.calc{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--sp-3);align-items:end}
@media(max-width:640px){.calc{grid-template-columns:1fr}}
.calc-out{text-align:center;padding:var(--sp-3);border-radius:var(--r);border:1px dashed var(--line-2);font-size:13px;color:var(--ink-2);min-height:56px;display:grid;place-items:center}

/* ---------- TABLE ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
/* Solid, not translucent: the header is sticky, and a see-through one let the
   rows scroll up underneath it and print on top of the column names. */
th{text-align:left;padding:12px 14px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);background:#080a1a;position:sticky;top:0;z-index:1}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
tr:hover td{background:rgba(255,255,255,.025)}

/* ---- ONE-SCREEN SUMMARY MODE ----
   Closest To Wins final + Winner of the night both carry a results table.
   They size themselves to the window instead of running off the bottom: the
   type scales with viewport height, and the table is the one element allowed
   to scroll inside itself when a 14-round game simply has too many rows. */
body.fitmode main{padding-top:4px;padding-bottom:10px}
.fits{display:flex;flex-direction:column;justify-content:center;
  height:calc(100svh - 96px);gap:clamp(6px,1.3vh,16px);padding:clamp(4px,.8vh,12px) 0}
/* nothing squashes except the results table, which is the one thing that can
   afford to scroll inside itself when a 14-round game has too many rows */
.fits > *{flex:none}
.fits > .card.pad,.fits > .tbl-wrap{flex:0 1 auto;min-height:0}
/* ...except the "Your call, host" card. It holds the award buttons, and with a
   long tie-break table under it, it was the thing that got squashed — buttons
   clipped away, text printed over the scoreboard. The table scrolls instead. */
.fits > .card.pad.center{flex:none}
.fits h1.display{font-size:clamp(28px,7.2vh,72px)}
.fits h2.display{font-size:clamp(22px,4.6vh,44px)}
.fits .winner{padding:clamp(2px,1vh,14px) var(--sp-3)}
.fits .winner .crown{font-size:clamp(32px,6.6vh,86px)}
.fits .winner .name{font-size:clamp(34px,9.2vh,104px);margin:clamp(2px,.9vh,12px) 0}
.fits .score-big{gap:clamp(10px,2vh,24px)}
.fits .score-cell{padding:clamp(8px,1.6vh,20px) var(--sp-3)}
.fits .score-cell .v{font-size:clamp(34px,8.4vh,92px)}
.fits .score-cell .n{font-size:12px;margin-top:4px}
.fits .card.pad{padding:clamp(8px,1.5vh,18px);min-height:0;display:flex;flex-direction:column;gap:8px}
.fits .tbl-wrap{flex:0 1 auto;min-height:0;overflow:auto}
.fits table th,.fits table td{padding:clamp(4px,.85vh,12px) 12px}
.fits table{font-size:clamp(11px,1.45vh,13px)}
.fits .badge{padding:4px 10px;font-size:10.5px}
.fits .btn{min-height:clamp(40px,5.2vh,52px)}
.fits .btn.lg{min-height:clamp(42px,5.6vh,60px);font-size:15px}
.fits .help,.fits .muted{font-size:clamp(11px,1.5vh,13px)}
.fits .mini-band{padding:8px 16px}

/* ---- auction overrides. These MUST sit after the .fits block above: they are
   the same specificity as `.fits .winner .name`, so ordering is the only thing
   deciding them, and up with the other winner styles they simply lost. ---- */

/* The winner name is a gradient clipped to the text. Swap the FILL only —
   `background:` shorthand resets background-clip to border-box, which paints
   the gradient across the whole element and gives you a solid colour bar
   instead of coloured letters. background-image leaves the clip alone. */
.winner .name.tint-a{background-image:linear-gradient(180deg,#D8F5FF 4%,var(--a) 46%,#0C6E90 100%);
  filter:drop-shadow(0 10px 26px rgba(49,201,247,.32))}
.winner .name.tint-b{background-image:linear-gradient(180deg,#FFDCE7 4%,var(--b) 46%,#9C0E45 100%);
  filter:drop-shadow(0 10px 26px rgba(255,77,130,.32))}

/* a between-legs winner block: same shape as the end-of-game one, a third the
   height, because it is a beat between categories and not a results page */
.winner.tight{padding:clamp(4px,1vh,12px) var(--sp-3)}
.fits .winner.tight .name{font-size:clamp(26px,5.6vh,54px);margin:2px 0;line-height:1}
.fits .winner.tight .crown{font-size:clamp(24px,3.4vh,40px)}
.winner.tight .muted{font-size:13px;margin-top:2px}
.auction-leg{gap:clamp(6px,1.4vh,14px)}

/* The bidding and naming screens are .play, which has no height ceiling — on a
   laptop the category, the tally, the standing bid and the card ran past the
   fold. Cap them the way .fits caps the result screens. */
.play.auction-bid,.play.auction-run{justify-content:safe center}
/* Short phones (and an installed app under the notch, where the score bar is
   taller): the count, the clock and the tap button all shrink rather than
   pushing the category off the top. Centring is "safe", so if it still does
   not fit it scrolls instead of clipping. */
@media(max-height:900px){
  .auction-run .auc-count .n{font-size:clamp(40px,8vh,70px)}
  .auction-run .timer{width:min(160px,20svh)}
  .auction-run .timer .val{font-size:min(52px,8svh)}
  .auction-run .timer .cap{display:none}
  .auction-run .auc-tap{min-height:52px}
  .auction-run .card.pad{padding:10px}
}
@media(max-height:620px){
  .auction-run .timer{width:min(120px,17svh)}
  .auction-run .auc-count .n{font-size:40px}
  .auction-run .help{display:none}
}
.auction-bid .q-text,.auction-run .q-theme{margin-top:0}
.auction-bid .spot,.auction-run .spot{padding-top:0}
.fits .bt-counter{gap:clamp(8px,1.8vh,22px)}
.fits .bt-cell{padding:clamp(6px,1.2vh,14px) var(--sp-2)}
.fits .bt-cell .v{font-size:clamp(26px,5.8vh,46px)}

/* ---------- GUESS THE MAP ----------
   The map is the show, so it takes every pixel the screen can spare: beside
   the clock on a laptop, above it on a phone. The question screen is .play and
   capped at the window like the auction's, so nothing runs past the fold. */
.mini-dots i.n{background:rgba(255,255,255,.42)}
.play.map-play{max-height:calc(100svh - 96px)}
.map-stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(230px,24vw,300px);gap:clamp(10px,1.6vw,22px);align-items:center}
/* the frame hugs the drawing, so the Enlarge chip sits on the map's corner */
.map-frame{position:relative;min-height:0;align-self:center;display:flex;align-items:center;justify-content:center;cursor:zoom-in;border-radius:var(--r)}
.map-svg,.map-img{display:block;width:100%;height:auto;max-height:calc(100svh - 230px);border-radius:var(--r);
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.45))}
.map-svg{width:min(100%,calc((100svh - 230px) * var(--ar,2)))}
.map-frame:has(> .map-img){justify-self:center}
.map-img{object-fit:contain;width:auto;max-width:100%}
.map-svg .msea{fill:#0B1030}
.map-svg .mland path{stroke:#0B1030;stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.map-svg .mdots circle{stroke:#0B1030;stroke-width:1px;vector-effect:non-scaling-stroke}
/* gold, not pink — pink is Team B's colour everywhere else on screen */
.map-svg .mpts circle{fill:var(--gold);stroke:#fff;stroke-width:1.6px;vector-effect:non-scaling-stroke}
.map-svg .mlead line{stroke:rgba(255,255,255,.75);stroke-width:.8px;vector-effect:non-scaling-stroke}
.map-svg .mline{fill:none;stroke:#fff;stroke-width:1.4px;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.map-svg text{fill:#fff;stroke:#0B1030;paint-order:stroke;stroke-linejoin:round;font-family:var(--font);font-weight:800;letter-spacing:.01em}
.map-zoomhint{position:absolute;right:8px;bottom:8px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);
  border:1px solid var(--line-2);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);pointer-events:none}
.map-wait{padding:40px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.map-side{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.1vh,12px);min-width:0;text-align:center}
.map-side .peek{margin:0;width:100%}
.map-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.map-legend i{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
/* A flag is a picture with its own proportions (Qatar is 11:28, Switzerland
   square), so it gets a fixed-height box and object-fit, never a stretch. The
   drop-shadows follow the flag's own edge — a white flag (Japan) still reads. */
.flag-frame{cursor:default;width:100%;justify-self:stretch}
.pick-flag{width:44px;height:30px;object-fit:contain;flex:none;align-self:center;filter:drop-shadow(0 0 1px rgba(255,255,255,.4))}
.bank-flag{width:60px;height:40px;object-fit:contain;background:none;filter:drop-shadow(0 0 1px rgba(255,255,255,.4))}
.flag-frame .flag-img{width:100%;height:clamp(120px,46svh,480px);max-height:none;object-fit:contain;border-radius:0;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 10px 26px rgba(0,0,0,.5))}
.flag-judge .flag-frame .flag-img{height:clamp(110px,40svh,420px)}
@media (max-width:760px){
  .flag-frame .flag-img{height:clamp(110px,30svh,300px)}
  .flag-judge .flag-frame .flag-img{height:clamp(100px,26svh,260px)}
}
/* Guess the Cocktail or Dish: every row is drawn from the start and lit as it
   comes due, so the list never jumps; an unlit row is an empty slot */
.play.map-play.dish-play{max-height:none}
.dish-frame{min-width:0;align-self:center;width:100%}
.ings{list-style:none;display:grid;gap:clamp(4px,.8vh,8px);width:100%;max-width:760px;margin:0 auto;padding:0}
.ing{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:clamp(6px,1.1vh,11px) 16px;border-radius:12px;
  border:1px dashed var(--line);background:rgba(255,255,255,.02);min-height:clamp(32px,5.4vh,50px)}
.ing > *{visibility:hidden}
.ing.on{border-style:solid;border-color:var(--line-2);background:rgba(255,255,255,.06);animation:reveal .5s var(--ease) both}
.ing.on > *{visibility:visible}
.ing-n{font-weight:700;font-size:clamp(15px,2.5vh,23px);color:var(--ink);line-height:1.2}
.ing-q{flex:none;color:var(--gold);font-weight:700;font-size:clamp(12px,1.9vh,16px);text-align:right;white-space:nowrap}
.ings.long .ing{min-height:clamp(28px,4.4vh,44px);padding-block:clamp(4px,.8vh,9px)}
.ings.long .ing-n{font-size:clamp(14px,2.2vh,21px)}
.dish-count{font-size:13px;color:var(--ink-2);font-weight:600}
.dish-count b{color:var(--gold);font-size:16px}
.dish-buzz{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dish-buzz .btn{min-height:clamp(52px,8vh,72px);font-size:clamp(14px,2.2vh,18px)}
.dish-buzz .btn.out{opacity:.35;text-decoration:line-through}
.dish-buzz .btn.done{opacity:.6}
.map-judge.dish-judge > .card h3{display:block}
.flag-lvl .lvl-tag{align-self:center;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);flex:none;width:84px}
.flag-lvl.dish-lvl{margin-top:4px}
.flag-lvl.dish-lvl .lvl-tag{flex-basis:100%;width:auto;margin:0 0 2px 2px}
.dish-judge .q-note{text-align:left;margin:0;max-width:none;font-size:15px}
@media(max-width:760px){
  .ing{padding:6px 12px;min-height:0;gap:10px;border-radius:10px}
  .ing-n{font-size:15px}
  .ings.long .ing-n{font-size:14px}
  .ing-q{font-size:12.5px;white-space:normal;max-width:45%}
  .ings{gap:5px}
  .dish-play .map-side .dish-count{grid-area:l;justify-self:start}
}
.map-hint{font-size:14px;color:var(--ink-2);text-align:center}
.map-hint strong{color:var(--gold);letter-spacing:.04em}
.map-hint-btn{align-self:center}
.map-legend i.pt{border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #fff inset}
.map-title{font-family:var(--font-d);font-size:clamp(22px,3.4vh,34px);line-height:1.08;text-transform:uppercase;letter-spacing:.01em;
  background:linear-gradient(180deg,#FFF7DA,var(--gold) 70%,#C79306);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:reveal .5s var(--ease) both;text-wrap:balance}
.map-judge .map-stage{grid-template-columns:minmax(0,1.8fr) minmax(240px,1fr)}
.map-judge .map-svg,.map-judge .map-img{max-height:calc(100svh - 330px)}
.map-judge .map-svg{width:min(100%,calc((100svh - 330px) * var(--ar,2)))}
.map-judge .q-note{font-size:13px;line-height:1.5;margin-top:2px;text-align:left}
.map-judge .map-side{align-items:stretch;text-align:left}
.map-judge .map-legend{justify-content:flex-start}
.bank-thumb{display:block;max-width:120px;max-height:60px;border-radius:6px;border:1px solid var(--line)}
@media(max-width:760px){
  .map-stage,.map-judge .map-stage{grid-template-columns:1fr;grid-template-rows:auto auto;align-items:start;align-content:center}
  .map-play .map-side .q-theme{font-size:10px;letter-spacing:.12em;padding:6px 12px;white-space:nowrap}
  .map-svg,.map-img{max-height:none}
  .map-judge .map-svg,.map-judge .map-img{max-height:none}
  .map-svg,.map-judge .map-svg{width:100%}
  /* the reveal carries a map, a title and a fact to read out — on a phone that
     runs past the fold, so the verdict buttons ride along at the bottom
     instead of making the host scroll for them */
  .map-judge > .card{position:sticky;bottom:6px;z-index:5;background:rgba(12,14,32,.97);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
  .map-judge > .card h3,.map-judge > .card .help{display:none}
  .map-judge > .card .btn-row{gap:8px!important}
  .map-judge > .card .btn{min-height:44px;padding-inline:14px}
  /* phone: the clock goes small and sits beside the legend under the map */
  .map-play .map-side{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"t q" "t l" "c c" "p p";
    column-gap:12px;row-gap:6px;align-items:center;text-align:left}
  .map-play .map-side .q-theme{grid-area:q;justify-self:start}
  .map-play .map-side .map-legend{grid-area:l;justify-content:flex-start}
  .map-play .map-side .timer{grid-area:t;width:92px}
  .map-play .map-side .timer .val{font-size:34px}
  .map-play .map-side .timer .cap{display:none}
  .map-play .map-side .btn-row{grid-area:c}
  .map-play .map-side .peek{grid-area:p}
}

/* the enlarged map — over everything, timer still running underneath */
#mapzoom{position:fixed;inset:0;z-index:120;background:rgba(5,7,20,.96);display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));gap:8px;animation:fade .2s var(--ease)}
#mapzoom .mz-top{display:flex;align-items:center;gap:12px}
#mapzoom .mz-top .eyebrow{flex:1;min-width:0}
#mapzoom .mz-t{font-family:var(--font-d);font-size:24px;color:var(--gold)}
#mapzoom .mz-stage{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;border-radius:var(--r)}
#mapzoom .mz-stage svg,#mapzoom .mz-stage img{width:100%;height:100%;max-height:100%;object-fit:contain;transition:transform .25s var(--ease);cursor:zoom-in}
#mapzoom .mz-help{text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:var(--sp-3);
  background:rgba(2,3,10,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#modal.on{display:grid;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{width:min(620px,100%);max-height:88svh;overflow:auto;animation:pop .3s var(--ease)}
.modal-box.wide{width:min(860px,100%)}
.modal-box.narrow{width:min(420px,100%)}

/* ---------- QUESTION PICKER ---------- */
.picklist{display:grid;gap:6px;max-height:42vh;overflow:auto;padding-right:4px}
.pickrow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--r-s);background:var(--glass);
  transition:border-color .14s var(--ease),background .14s var(--ease)}
.pickrow:hover:not([disabled]){border-color:rgba(255,255,255,.3);background:var(--glass-2)}
.pickrow[disabled]{opacity:.3;pointer-events:none}
.pickrow[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-dim)}
.pickrow .tick{flex:none;width:20px;height:20px;margin-top:2px;border-radius:6px;position:relative;
  border:1px solid var(--line-2);background:rgba(0,0,0,.35)}
.pickrow[aria-pressed="true"] .tick{background:var(--gold);border-color:transparent}
.pickrow[aria-pressed="true"] .tick::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid #1A1400;border-width:0 2px 2px 0;transform:rotate(42deg)}
.pickrow .pq{display:flex;flex-direction:column;gap:3px;min-width:0}
.pickrow .qq{font-size:14px;font-weight:600;line-height:1.35}
.pickrow .qa{font-size:12px;font-weight:700;color:var(--gold)}
.pickrow .qa .dim{font-weight:400;color:var(--ink-3)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- WINNER ---------- */
.winner{text-align:center;padding:var(--sp-6) var(--sp-3);position:relative}
.winner .crown{font-size:clamp(56px,12vw,110px);line-height:1;display:grid;place-items:center;filter:drop-shadow(0 10px 30px rgba(245,197,24,.35))}
.winner .name{
  font-family:var(--font-d);font-size:clamp(46px,11vw,120px);line-height:.9;text-transform:uppercase;margin:var(--sp-3) 0;
  background:linear-gradient(180deg,#FFF9E4 4%,var(--gold-2) 36%,var(--gold) 66%,#A87B04 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 14px 40px rgba(245,197,24,.35));
  animation:reveal .7s var(--ease) both;
}
/* ---- Imad's speech bubble: up top, over the content, never in the way of a tap ---- */
#hostBubble{position:fixed;z-index:90;top:62px;right:16px;max-width:min(440px,calc(100vw - 32px));display:flex;align-items:flex-end;gap:10px;
  pointer-events:none;opacity:0;transform:translateY(-12px) scale(.96);transition:opacity .25s,transform .25s var(--ease)}
#hostBubble.on{opacity:1;transform:none}
#hostBubble img{width:76px;height:76px;object-fit:contain;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));order:2}
#hostBubble .hb-text{position:relative;padding:12px 16px;border-radius:18px 18px 4px 18px;background:#FFF7DA;color:#1A1400;
  font-weight:700;font-size:15px;line-height:1.35;box-shadow:0 14px 34px rgba(0,0,0,.55)}
#hostBubble.on .hb-text{animation:hbPop .45s var(--ease) both}
@keyframes hbPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:none}}
@media(max-width:760px){
  #hostBubble{top:96px;right:12px;left:12px;max-width:none}
  #hostBubble img{width:46px;height:46px}
  #hostBubble .hb-text{font-size:14px;padding:10px 14px}
}
/* ---- the show ---- */
h1.display.slam{animation:slam .7s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes slam{0%{opacity:0;transform:scale(2.4);filter:blur(12px)}55%{opacity:1;transform:scale(.93);filter:none}75%{transform:scale(1.04)}100%{transform:none}}
#hud .sc.pop{animation:scPop .7s var(--ease)}
@keyframes scPop{0%{transform:scale(1)}30%{transform:scale(1.55);text-shadow:0 0 24px currentColor}100%{transform:scale(1)}}
.lead-banner{position:fixed;z-index:95;left:0;right:0;top:38%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 16px;
  pointer-events:none;text-transform:uppercase;font-family:var(--font-d);animation:leadIn 2.3s var(--ease) both}
.lead-banner.a{background:linear-gradient(90deg,transparent,rgba(49,201,247,.92) 20%,rgba(49,201,247,.92) 80%,transparent)}
.lead-banner.b{background:linear-gradient(90deg,transparent,rgba(255,77,130,.92) 20%,rgba(255,77,130,.92) 80%,transparent)}
.lead-banner span{font-size:clamp(14px,2.4vw,20px);letter-spacing:.3em;color:#0B1030}
.lead-banner b{font-weight:400;font-size:clamp(34px,7vw,72px);line-height:1;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.35)}
@keyframes leadIn{0%{opacity:0;transform:translateX(-60%) skewX(-12deg)}15%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateX(60%) skewX(-12deg)}}
#app.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){h1.display.slam,#hud .sc.pop,#app.shake,.lead-banner{animation:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12vh;width:9px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:.15}}

/* the Call a Friend countdown — a class, not an inline style, so the phone
   block below can give the Anton glyphs the room they need */
.cd-num{font-family:var(--font-d);font-size:74px;line-height:1;color:var(--gold)}

/* ============================================================
   PHONE ONLY — everything below this line is inside this query
   and cannot reach a laptop.

   max-width:640px  — an iPhone 13 reports 390 CSS pixels wide,
     the widest iPhone is 430, a laptop is 1280+. 640 sits safely
     between them. This is the portrait case.
   max-height:560px AND pointer:coarse — a phone turned sideways
     is 844 wide, so the width test misses it. pointer:coarse
     means the primary input is a finger; a laptop reports
     pointer:fine even with a touchscreen, so this cannot fire
     on one however small the window is dragged.
   ============================================================ */
@media(max-width:640px),(max-height:560px) and (pointer:coarse){

  /* --- the tracker sat 29px left of centre: .hud-in reserved 58px on the
         right for the Exit button, which offsets the whole grid including the
         centred row underneath. Reserve that space on the Team B cell only,
         and pin Exit into the true corner. --- */
  .hud-in{padding-right:0}
  .hud-team.b{padding-right:60px}
  .hud-actions{top:8px;right:max(6px,env(safe-area-inset-right));transform:none}
  .hud-actions .btn{min-height:34px;padding:0 12px;font-size:12px;border-radius:var(--r-s)}

  /* --- the strobing header. A sticky bar with backdrop-filter sitting over a
         permanently animating background makes iOS re-composite the frosted
         layer every frame, and it flickers. Solid bar, and hold the backdrop
         still — neither is noticeable at this size. --- */
  #hud{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  #stage::before{animation:none}
  .pip.now{animation:none}

  /* --- blurry answer notes. @keyframes reveal starts at filter:blur(6px);
         iOS rasterises the element to apply it and can leave it soft forever.
         Same entrance, no blur. --- */
  @keyframes revealFlat{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .q-answer,.q-note{animation-name:revealFlat}

  /* --- text spilling out of the Call a Friend boxes. Anton overflows a tight
         line-height: the 74px counter needed 92px of room inside a 74px box. --- */
  .cd-num{font-size:clamp(46px,15vw,64px);line-height:1.5}
  .modal-box .display{line-height:1.3}
  .modal-box{width:100%}

  /* --- the two recap screens. On a laptop these lock to the window height and
         let the table scroll inside itself. On a phone that left 9 rows sharing
         an 85px window, 640px wide, inside a 356px screen. Unlock the height,
         let the PAGE scroll, and redraw every row as a stacked card. --- */
  .fits{height:auto;justify-content:flex-start}
  .fits > .card.pad,.fits > .tbl-wrap{flex:none}
  .fits .tbl-wrap{max-height:none;overflow:visible;border:0;background:none;border-radius:0}
  .fits table{min-width:0;display:block;font-size:13px}
  .fits thead{display:none}                       /* the labels move onto each cell */
  .fits tbody,.fits tr,.fits td{display:block;width:100%}
  .fits tr{border:1px solid var(--line);border-radius:var(--r);background:var(--glass);
    padding:10px 14px;margin-bottom:8px}
  .fits tr:hover td{background:none}
  .fits td{border:0;padding:4px 0;color:var(--ink);
    display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .fits td::before{content:attr(data-l);flex:none;font-size:10px;font-weight:800;
    letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  .fits td:empty{display:none}                    /* e.g. a round with no lifelines */
  /* the first cell becomes the card's title bar */
  .fits td.rowhead{display:block;font-family:var(--font-d);font-size:16px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--gold);padding:0 0 7px;margin-bottom:7px;
    border-bottom:1px solid var(--line)}
  .fits td.rowhead::before{content:attr(data-l) ' ';display:inline;font-size:inherit;
    letter-spacing:inherit;color:inherit;font-weight:inherit}
  /* the mini-game's points row heads on its label, not on a "—" */
  .fits tr.sumrow td:first-child{display:none}
  /* the leg question runs full width with its label above it */
  .fits td.qcell{display:block;font-weight:600;line-height:1.4;padding:2px 0 8px}
  .fits td.qcell::before{display:block;margin-bottom:4px}

  /* --- Battle of the Captains. The counter stays three-across on purpose —
         both captains at a glance is the whole point of it — so everything in
         it shrinks instead. The band above wraps rather than squeezing the
         captain's name, and only the Battle's band does: the mini-game's is
         two short chips and has never needed it. --- */
  .bt-band{flex-wrap:wrap;gap:8px;padding:10px 14px}
  /* sized in vh, not px: a phone is not one height. An SE is 667, a 17 Pro Max
     is 956, and Safari's own toolbar takes ~90 off whatever the number is. */
  .bt-counter{gap:8px}
  .bt-cell{padding:clamp(5px,.95vh,9px) 6px;border-radius:var(--r)}
  .bt-cell .v{font-size:clamp(20px,3.3vh,28px)}
  .bt-cell .n{font-size:clamp(9px,1.35vh,11px);letter-spacing:.06em;margin-top:3px}
  .bt-cell .t{font-size:clamp(8px,1.15vh,10px);letter-spacing:.08em}
  .bt-track i{width:8px}
  /* the tie-breaker verdict. Three buttons stacked is 180px of a 812px phone
     and it was the one thing pushing a long question off the bottom. The two
     captains go side by side; "neither" spans underneath them. */
  .bt-verdict{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bt-verdict > :nth-child(1){order:1}
  .bt-verdict > :nth-child(3){order:2}
  .bt-verdict > :nth-child(2){order:3;grid-column:1/-1}
  .compact .q-text{font-size:clamp(16px,2.5vh,21px)}

  /* --- the hand-picker. Fourteen themes wrapped to ten rows of chips, eating
         most of the modal before a single question was visible. One row that
         swipes sideways instead, and no scroll boxes inside a scroll box —
         nested scrollers are miserable to drive with a thumb, so the whole
         modal becomes one surface. --- */
  #modal .pickfilter{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    padding-bottom:8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  #modal .pickfilter .chip{flex:none;scroll-snap-align:start;min-height:40px;font-size:12.5px}
  #modal .picklist{max-height:none;overflow:visible;padding-right:0}

  /* --- the theme wall. Twenty-two chips at 44px tall with a count badge on each
         ran two per row and pushed the Start button a long way down. The count
         is gone from the markup; these numbers are what turns the leftover
         width into three per row. A 390px iPhone leaves about 326px inside the
         card, so three chips plus two 6px gaps have to live inside 314 — a
         104px budget each, which covers everything up to "Pop Culture". The
         long names ("Internet & Memes") still take a row of their own, and
         that is fine: they wrap, they do not clip. --- */
  .chips.theme-chips{gap:6px}
  .theme-chips .chip{min-height:36px;padding:0 11px;font-size:12px;letter-spacing:0;gap:6px}

  /* --- difficulty per theme. Three pills and a theme name DO share 326px —
         it was the fourth pill (Mixed) that forced the name onto its own line
         and doubled the height of every row. One line each now. --- */
  .tdrow{gap:8px;padding:3px 6px;flex-wrap:nowrap}
  .tdrow .tdname{font-size:12.5px;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tdrow .seg.tiny{flex:none;flex-wrap:nowrap}
  .tdrow .seg.tiny button{padding:0 7px;font-size:11px;min-height:28px}
}

/* ============================================================
   SHORT VIEWPORT — a phone that is not tall enough for the
   two intro screens, whose five-line rules list is the tallest
   fixed block in the app.

   This is NOT only the small phones. Safari draws its address
   bar and toolbar over the viewport, so a 390x844 iPhone 13
   reports about 750 with the chrome showing, and a 375x667 SE
   reports about 570. Keying on height rather than on a device
   catches both, and catches whatever Apple ships next.
   ============================================================ */
@media(max-width:640px) and (max-height:780px),(max-height:560px) and (pointer:coarse){
  .intro-screen{gap:12px;padding-top:10px!important}
  .intro-head{gap:6px!important}
  .intro-head h1.display{font-size:clamp(28px,6.2vh,42px)}
  .intro-head .reader{font-size:12.5px;line-height:1.4;margin:0 auto}
  .intro-head .mini-band{margin:4px auto!important;padding:8px 14px}
  .intro-screen .card.pad{padding:13px}
  .intro-rules{gap:7px!important;font-size:12.3px!important;line-height:1.42!important}
  .intro-screen .btn.lg{min-height:48px}

  /* the tie-breaker and the mini-game entry screen, same treatment */
  .compact{gap:8px}
  .compact .spot{padding:10px var(--sp-3)}
  .compact .card.pad{padding:11px}
  .compact .q-answer{font-size:clamp(24px,4.6vh,34px)}
  .compact .btn.lg{min-height:46px}
  .compact .display{font-size:clamp(16px,2.9vh,22px)}
  .bt-counter{gap:6px}

  /* Change-question / Show-answer wrapped to two rows at 375px and cost
     50px doing it. Let them share one row and shrink instead. */
  .play .row.between{gap:6px}
  .play .row.between .btn{min-height:44px;padding:0 12px;font-size:13px}
  .compact .q-note{font-size:12px;margin-top:6px}
  .compact .spot{gap:4px}
}

/* The tie-breaker carries the most in one screen — question, answer, note,
   counter and three verdict buttons — so it runs out of room before anything
   else does. It gets its own step between the two tiers. */
@media(max-width:640px) and (max-height:760px),(max-height:560px) and (pointer:coarse){
  .compact{gap:7px}
  .compact .q-answer{font-size:clamp(22px,4.4vh,30px)}
  .compact .q-note{font-size:11px;line-height:1.4;margin-top:4px}
  .compact .card.pad{padding:10px}
  .compact .btn.lg{min-height:44px}
  .compact .q-text{font-size:clamp(15px,2.3vh,19px);line-height:1.2}
    .compact .spot{padding:9px var(--sp-3)}
  .bt-verdict .btn{min-height:44px;font-size:13.5px}
}

/* Tighter still: an SE with the Safari chrome showing is 375x570, and there
   is a floor below which a question, its answer, a counter and three buttons
   simply do not fit. Everything expendable goes — the flavour line under the
   title, the team name under each captain's — before anything load-bearing. */
@media(max-width:640px) and (max-height:640px),(max-height:560px) and (pointer:coarse){
  .intro-head h1.display{font-size:clamp(24px,5.6vh,32px)}
  .intro-head .reader{display:none}
  .intro-rules{gap:5px!important;font-size:11.5px!important;line-height:1.34!important}
  .intro-screen .card.pad{padding:10px}
  .intro-screen .btn.lg{min-height:44px}
  .bt-cell .t{display:none}
  .compact .q-answer{font-size:clamp(20px,4.2vh,28px)}
  .compact .q-note{font-size:11px;margin-top:4px}
  .compact .card.pad{padding:9px}
  .compact .btn.lg{min-height:42px}
  .play .timer{width:min(150px,21svh)}
  .play .timer .val{font-size:min(46px,8svh)}
  .q-text{font-size:clamp(15px,2.5vh,19px)}
  .q-answer{font-size:clamp(22px,4.4vh,30px)}
  .compact .q-text{font-size:clamp(14px,2.3vh,17px)}
  .compact .spot{padding:7px var(--sp-2)}
  .compact{gap:6px}
  .bt-cell .v{font-size:clamp(18px,3vh,23px)}
  .bt-cell{padding:4px 5px}
  .bt-verdict{gap:6px}
  .bt-verdict .btn{min-height:40px;font-size:13px}
  .intro-rules{font-size:11px!important;gap:4px!important}
  .intro-head .mini-band{padding:6px 12px}
}

/* ---------- MISC ---------- */
.kbd{display:inline-block;min-width:22px;padding:2px 6px;border-radius:5px;border:1px solid var(--line-2);background:rgba(0,0,0,.4);font-size:11px;font-weight:700;text-align:center;color:var(--ink-2);font-variant-numeric:tabular-nums}
.toast{pointer-events:none;position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;padding:13px 22px;border-radius:999px;
  background:rgba(10,12,28,.96);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:14px;font-weight:600;
  animation:toastIn .3s var(--ease);max-width:min(560px,92vw);text-align:center}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.empty{text-align:center;padding:var(--sp-6) var(--sp-3);color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.88em;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--gold-2)}
svg.ic{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px;flex:none}
.rules-ol{list-style:none;font-size:15px;line-height:1.6;counter-reset:r}
.rules-ol li{counter-increment:r;margin-bottom:12px;padding-left:36px;position:relative}
.rules-ol li::before{content:counter(r);position:absolute;left:0;top:-1px;width:24px;height:24px;border-radius:50%;
  background:var(--gold-dim);border:1px solid rgba(245,197,24,.45);color:var(--gold);
  font-family:var(--font-d);font-size:13px;display:grid;place-items:center}
.warnbox{border:1px solid rgba(255,162,58,.4);background:rgba(255,162,58,.09);border-radius:var(--r);padding:14px 16px;font-size:13px;line-height:1.6;color:#FFD9A8}
.okbox{border:1px solid rgba(61,220,151,.35);background:rgba(61,220,151,.08);border-radius:var(--r);padding:14px 16px;font-size:13px;line-height:1.6;color:#B6F2D6}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--glass);flex-wrap:wrap}
