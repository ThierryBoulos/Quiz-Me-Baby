      '</div>' +
    '</div>' +
  '</div>';
};

/* THE reveal — everyone sees this, and only once the question is fully settled. */
SCREENS.answer = function(){
  const g = G(), rd = curRound(), ti = curTeam(), q = rd.q[g.seat], r = rd.res[g.seat] || {};
  let verdict;
  if(r.correct)      verdict = '<span class="badge ok">' + esc(g.teams[ti].name) + ' got it</span>';
  else if(r.stolen)  verdict = '<span class="badge ok">' + esc(g.teams[otherTeam(ti)].name) + ' stole it</span>';
  else               verdict = '<span class="badge no">Nobody got it</span>';
  const last = g.seat === 1;
  return '<div class="stack lg">' +
    '<div class="spot" style="background:radial-gradient(80% 120% at 50% -20%,rgba(245,197,24,.18),transparent 65%)">' +
      '<p class="q-text" style="font-size:clamp(16px,1.9vw,22px);font-weight:500;color:var(--ink-2);max-width:42ch;margin:0 auto 14px">' + esc(q.question) + '</p>' +
      '<div class="eyebrow gold">The answer</div>' +
      '<div class="q-answer">' + esc(q.answer) + '</div>' +
      (q.notes ? '<p class="q-note">' + esc(q.notes) + '</p>' : '') +
      '<div style="margin-top:20px">' + verdict + '</div>' +
    '</div>' +
    '<div class="btn-row center">' +
      '<button class="btn gold lg" data-act="afterAnswer">' +
        (last ? 'Round scoreboard' : 'Next — question for ' + esc(g.teams[seatTeam(rd, 1)].name)) +
      '</button>' +
    '</div>' +
  '</div>';
};
AFTER.answer = function(){ const r = curRound().res[G().seat]; if(r && (r.correct || r.stolen)) Snd.correct(); };

/* ==========================================================================
   16. ROUND SCOREBOARD
   ========================================================================== */
SCREENS.roundScore = function(){
  const g = G(), rd = curRound();
  const nextIsMini = (g.r + 1 === g.miniAfter) && !g.miniPlayed;
  const last = g.r + 1 >= g.rounds.length;
  /* don't promise a tie breaker if the Battle is about to be offered — it may
     well settle the thing, and the button must give nothing away either way */
  const heading = last && g.teams[0].score === g.teams[1].score && (g.battleOffered || !battleReady());
  const lines = [0, 1].map(seat => {
    const ti = seatTeam(rd, seat), r = rd.res[seat];
    if(!r) return '';
    const who = g.teams[ti].name;
    let txt;
    if(r.correct) txt = '<span class="badge ok">' + esc(who) + ' answered it</span>';
    else if(r.stolen) txt = '<span class="badge ok">' + esc(g.teams[otherTeam(ti)].name) + ' stole it</span>';
    else txt = '<span class="badge no">Nobody got it</span>';
    return '<div class="list-row"><div><div class="eyebrow">Question for ' + esc(who) + (rd.dbl[ti] ? ' · 2×' : '') + '</div>' +
      '<div style="font-weight:600;margin-top:4px;font-size:14px">' + esc(rd.q[seat].question) + '</div>' +
      '<div class="help" style="margin-top:4px">Answer: <strong style="color:var(--gold)">' + esc(rd.q[seat].answer) + '</strong></div></div>' + txt + '</div>';
  }).join('');

  return '<div class="stack lg" style="padding-top:14px">' +
    '<div class="center"><div class="eyebrow gold">End of round ' + rd.n + ' — ' + esc(rd.theme) + '</div></div>' +
    scoreBig() +
    '<div class="stack">' + lines + '</div>' +
    '<div class="btn-row center">' +
      '<button class="btn ghost" data-act="quit">End game</button>' +
      '<button class="btn gold lg" data-act="nextRound">' +
        (nextIsMini ? 'Next — Closest To Wins' : heading ? 'Scores tied — tie breaker' : last ? 'Finish the game' : 'Next round') +
      '</button>' +
    '</div>' +
    '<p class="center help">Take a break here. The game holds until you press next.</p>' +
  '</div>';
};

function scoreBig(delta){
  const g = G();
  const cell = (i) => '<div class="score-cell ' + (i === 0 ? 'a' : 'b') + '">' +
    '<div class="v num">' + g.teams[i].score + '</div>' +
    '<div class="n">' + esc(g.teams[i].name) + '</div>' +
    (delta && delta[i] ? '<div class="delta">+' + delta[i] + ' this round</div>' : '') +
  '</div>';
  return '<div class="score-big">' + cell(0) + '<div class="vs">VS</div>' + cell(1) + '</div>';
}

/* Years must not get a thousands separator — "1,961" reads as nonsense. */
function fmtAns(q){
  const n = Number(q.answer);
  if(!isFinite(n) || q.answer === '') return esc(q.answer);
  if(/\byears?\b/i.test(q.question) && n >= 1000 && n <= 2999) return String(n);
  return nf(n);
}
function legLabel(){
  const m = G().mini;
  const i = Math.min(m.i, m.qs.length - 1);
  return i >= m.base ? 'Tie-breaker leg ' + (i - m.base + 1) : 'Leg ' + (i + 1) + ' of ' + m.base;
}
function miniDots(){
  const m = G().mini;
  let out = '<span class="mini-dots">';
  for(let i = 0; i < m.qs.length; i++){
    const s = m.subs[i];
    out += '<i class="' + (!s ? '' : s.winner === 'tie' ? 't' : s.winner === 0 ? 'a' : 'b') + '"></i>';
  }
  return out + '</span>';
}

SCREENS.miniEntry = function(){
  const g = G(), m = g.mini, q = m.qs[m.i];
  return '<div class="compact">' +
    '<div class="center"><div class="mini-band"><span class="eyebrow gold">' + legLabel() + '</span>' + miniDots() + '</div></div>' +
    '<div class="spot" style="background:radial-gradient(80% 120% at 50% -20%,rgba(245,197,24,.16),transparent 65%)">' +
      '<p class="q-text" style="font-size:clamp(15px,1.8vw,20px);font-weight:500;color:var(--ink-2);max-width:46ch;margin:0 auto 8px">' + esc(q.question) + '</p>' +
      '<div class="eyebrow gold">The number</div>' +

    '</div>' +
    '<div class="card pad lit stack" style="gap:10px">' +
      '<div class="calc">' +
        '<label class="fld" style="color:var(--a)">' + esc(g.teams[0].name) + ' guessed' +
          '<input type="text" inputmode="numeric" id="gA" data-act="calc" placeholder="optional"></label>' +
        '<div class="calc-out" id="calcOut">Enter both to compare</div>' +
        '<label class="fld" style="color:var(--b)">' + esc(g.teams[1].name) + ' guessed' +

AFTER.miniEntry = function(){ const a = el('gA'); if(a) a.focus(); };

SCREENS.miniSummary = function(){
  const g = G(), m = g.mini;
  /* data-l / the cell classes are inert on a laptop — the phone stylesheet uses
     them to re-draw each row as a stacked card instead of a table row. */
  const rows = m.subs.map((s, i) =>
    '<tr><td class="rowhead" data-l="Leg">' + (i + 1) + '</td>' +
    '<td class="qcell" data-l="Question">' + esc(s.q.question) + '</td>' +

    '<td class="num" data-l="' + esc(g.teams[1].name) + '" style="color:var(--b)">' + (s.gB == null ? '—' : nf(s.gB)) + '</td>' +
    '<td data-l="Winner">' + (s.winner === 'tie' ? '<span class="badge line">Tie</span>' : '<span class="badge ' + (s.winner === 0 ? 'a' : 'b') + '">' + esc(g.teams[s.winner].name) + '</span>') + '</td></tr>'
  ).join('');

  const verdict = m.verdict || {};
  return '<div class="fits">' +
    '<div class="center stack" style="gap:6px">' +
      '<div class="eyebrow gold">Closest to wins — final</div>' +
      '<h2 class="display">' + (verdict.winner == null ? 'Tie' : esc(g.teams[verdict.winner].name) + ' takes it') + '</h2>' +
      '<div class="row center" style="justify-content:center;gap:20px">' +
        '<span class="badge a">' + esc(g.teams[0].name) + ' — ' + m.wins[0] + '</span>' +
        '<span class="badge b">' + esc(g.teams[1].name) + ' — ' + m.wins[1] + '</span>' +
      '</div>' +
      (verdict.note ? '<p class="help" style="max-width:52ch;margin:0 auto">' + verdict.note + '</p>' : '') +
      (m.awarded && m.award ? '<p class="help">Points awarded: <strong style="color:var(--a)">' + m.award[0] + '</strong> / <strong style="color:var(--b)">' + m.award[1] + '</strong></p>' : '') +
    '</div>' +
    (verdict.needsHost
      ? '<div class="card pad lit center stack"><h3 class="display">Your call, host</h3>' +
        '<p class="help">Legs are tied and there is nothing to separate them. Award the ' + g.miniPts + ' points however you see fit.</p>' +
        '<div class="btn-row center">' +
          '<button class="btn teamA lg" data-act="miniAward" data-w="0">' + esc(g.teams[0].name) + ' takes it</button>' +
          '<button class="btn ghost" data-act="miniAward" data-w="split">Split ' + Math.floor(g.miniPts / 2) + ' each</button>' +
          '<button class="btn teamB lg" data-act="miniAward" data-w="1">' + esc(g.teams[1].name) + ' takes it</button>' +
        '</div></div>'
      : '') +
    scoreBig() +
    '<div class="tbl-wrap"><table><thead><tr><th>Leg</th><th>Question</th><th>Answer</th><th>' + esc(g.teams[0].name) + '</th><th>' + esc(g.teams[1].name) + '</th><th>Winner</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="btn-row center">' +
      '<button class="btn ghost" data-act="quit">End game</button>' +
      '<button class="btn gold lg" data-act="afterMini">Back to the standard rounds</button>' +
    '</div>' +
  '</div>';
};

/* ==========================================================================

/* the live counter, on every Battle screen so nobody has to ask the score */
function battleCounter(){
  const g = G(), b = g.battle;
  const cell = (c) => '<div class="bt-cell ' + (c === 0 ? 'a' : 'b') + (b.stage === 'run' && b.cap === c ? ' live' : '') + '">' +
    '<div class="v num">' + b.score[c] + '</div>' +
    '<div class="n">' + esc(battleCapName(c)) + '</div>' +

/* ---------- CSV / XLSX ---------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  const delim = (text.split('\n')[0].split('\t').length > text.split('\n')[0].split(',').length) ? '\t' : ',';
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else {
      if(c === '"') q = true;
      else if(c === delim){ row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if(c === '\r'){ /* skip */ }
      else cell += c;
    }
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
function rowsToQuestions(rows){
  if(!rows.length) throw new Error('Empty file.');
  const head = rows[0].map(norm);
  const find = (...names) => { for(const n of names){ const i = head.indexOf(n); if(i > -1) return i; } return -1; };
  const iQ = find('question','questions','q');
  const iA = find('answer','answers','a');
  if(iQ < 0 || iA < 0) throw new Error('Could not find a "question" and an "answer" column in the header row.');
  const iN = find('notes','note','info');
  const iT = find('theme','topic','category');
  const iY = find('type','typeofgame','gametype','typeofquestion');
  const iD = find('difficulty','diff','level');
  const iU = find('usequestionwith','usewith','pair','ticker','pairing','group');

  const out = [];
  for(let r = 1; r < rows.length; r++){
    const row = rows[r];
    const question = String(row[iQ] || '').trim();
    const answer = String(row[iA] || '').trim();
    if(!question || !answer) continue;
    const rawType = norm(iY > -1 ? row[iY] : '');
    const type = /clos|estim|numb|guess|mini/.test(rawType) ? 'closest' : 'standard';
    let d = norm(iD > -1 ? row[iD] : '');
    if(/^(1|e|easy|low)/.test(d)) d = 'easy';
    else if(/^(3|h|hard|difficult|high)/.test(d)) d = 'hard';
    else d = 'medium';
    let theme = String(iT > -1 ? row[iT] : '').trim() || 'General';
    const known = THEMES.find(t => norm(t) === norm(theme));
    if(known) theme = known; else if(THEMES.indexOf(theme) < 0) THEMES.push(theme);
    out.push({
      id:hash(question), question, answer,
      notes:String(iN > -1 ? row[iN] : '').trim(),
      theme, type, difficulty:d,
      use_with:String(iU > -1 ? row[iU] : '').trim(),
      src:'import'
    });
  }
  if(!out.length) throw new Error('No usable rows found.');
  return out;
}
function mergeBank(list){
  const byId = {}; S.bank.forEach(q => byId[q.id] = q);
  let added = 0, dup = 0;
  list.forEach(q => { if(byId[q.id]) { dup++; Object.assign(byId[q.id], q); } else { byId[q.id] = q; added++; } });
  S.bank = Object.values(byId);
  saveBank();
  toast(added + ' added, ' + dup + ' updated. Bank now holds ' + S.bank.length + '.', 4200);
  render();
}
function importFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext === 'xlsx' || ext === 'xls') return importXLSX(file);
  const fr = new FileReader();
  fr.onload = () => { try{ mergeBank(rowsToQuestions(parseCSV(fr.result))); } catch(e){ toast('Import failed: ' + e.message, 6000); } };
  fr.readAsText(file);
}
function importXLSX(file){
  const run = () => {
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const wb = XLSX.read(new Uint8Array(fr.result), { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:'' });
        mergeBank(rowsToQuestions(rows));
      }catch(e){ toast('Import failed: ' + e.message, 6000); }
    };
    fr.readAsArrayBuffer(file);
  };
  if(window.XLSX) return run();
  toast('Loading the spreadsheet reader…');
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.onload = run;
  s.onerror = () => toast('No internet — save the file as CSV in Excel and import that instead.', 7000);
  document.head.appendChild(s);
}
function download(name, text, mime){
  const b = new Blob([text], { type:(mime || 'text/plain') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
const csvCell = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
function bankToCSV(list){
  const head = ['question','answer','notes','theme','type','difficulty','use_question_with'];
  return head.join(',') + '\n' + list.map(q =>
    [q.question, q.answer, q.notes, q.theme, q.type, q.difficulty, q.use_with].map(csvCell).join(',')).join('\n');
}

function go(screen){
  Timer.stop();
  S.tmp.tKey = null;          // a real navigation always restarts the clock
  S.tmp.toTop = true;
  S.screen = screen;
  if(S.game) S.game.screen = screen;
  render();
}
/* Start a timer only on a genuine navigation. A plain re-render (arming a
   lifeline, closing a modal) must not reset the clock. */
function armTimer(key, secs, onEnd){
  if(S.tmp.tKey === key){ Timer.paint(); return; }
  S.tmp.tKey = key;
  Timer.start(secs, onEnd);
}
function markUsed(q){ if(q){ S.used.add(q.id); saveUsed(); } }

function beginRound(){
  const g = G();
  g.seat = 0;
  go('ask');
}
function afterSeat(){
  const g = G(), rd = curRound();
  if(g.seat === 0){ g.seat = 1; go('ask'); }
  else { rd.done = true; go('roundScore'); }
}
function nextRound(){
  const g = G();
  if(g.r + 1 === g.miniAfter && !g.miniPlayed && g.mini.qs.length){ go('miniIntro'); return; }
  advanceRound();
}
function advanceRound(){
  const g = G();
  /* clamped: the Battle pop-up can be dismissed with Esc and the host can then
     press the button again — that must not walk g.r off the end of the list */
  g.r = Math.min(g.r + 1, g.rounds.length);
  if(g.r < g.rounds.length){ g.seat = 0; go('roundIntro'); return; }
  if(!g.battleOffered && battleReady()){ offerBattle(); return; }
  endGame();
}
/* The pop-up over the last round's scoreboard. Deliberately flat — no pitch,
   no "would you like to", nothing that hints the host is fishing for a way to
   rescue the losing team. It reads as a fixture that was always on the card. */
function offerBattle(){
  openModal(
    '<div class="center stack" style="gap:14px">' +
      '<h3 class="display" style="line-height:1.12;font-size:clamp(22px,4.4vw,34px)">Activate Battle<br>of the Captains</h3>' +
      '<div class="btn-row center" style="gap:12px">' +
        '<button class="btn gold lg" data-act="battleYes" style="min-width:100px">Yes</button>' +
        '<button class="btn ghost lg" data-act="battleNo" style="min-width:100px">No</button>' +
      '</div>' +
    '</div>', 'narrow');
}

/* ---------- mini ---------- */
function miniFinish(){
  const g = G(), m = g.mini;
  /* Tied on legs → straight into an extra tie-breaker question. */
  if(m.wins[0] === m.wins[1]){
    if(m.spare && m.spare.length){
      const q = m.spare.shift();
      m.qs.push(q); markUsed(q);
      m.tieLegs++;
      toast('Tied after ' + (m.qs.length - 1) + ' legs — tie-breaker question.', 3600);
      go('miniQ');            // m.i already points at the new question
      return;
    }
    m.done = true;
    m.verdict = { winner:null, needsHost:true,
      note:'Tied on legs, and there are no spare Closest To questions left for another tie-breaker. Your call.' };
    go('miniSummary');
    return;
  }
  const winner = m.wins[0] > m.wins[1] ? 0 : 1;
  m.done = true;
  m.verdict = { winner, needsHost:false,
    note:m.tieLegs ? 'Settled by ' + (m.tieLegs === 1 ? 'a tie-breaker leg' : m.tieLegs + ' tie-breaker legs') + '.' : '' };
  awardMini(winner);
  go('miniSummary');
}
function awardMini(w){
  const g = G(), m = g.mini;
  if(m.awarded) return;
  m.awarded = true;
  if(w === 'split'){
    const half = Math.floor(g.miniPts / 2);
    g.teams[0].score += half; g.teams[1].score += half;
    m.award = [half, half];
    m.verdict.note = 'Split — ' + half + ' point' + (half > 1 ? 's' : '') + ' each.';
    m.verdict.winner = null;
  } else {
    g.teams[w].score += g.miniPts;
    m.award = [w === 0 ? g.miniPts : 0, w === 1 ? g.miniPts : 0];
    m.verdict.winner = w;
  }
  m.verdict.needsHost = false;
  Snd.point();
}

/* ---------- end of game ---------- */
function endGame(){
  const g = G();
  if(g.teams[0].score === g.teams[1].score){ startSudden(); return; }
  g.winner = g.teams[0].score > g.teams[1].score ? 0 : 1;
  finalize();
}
/* Prefer the themes chosen for tonight; widen only when they run dry. */
function suddenPool(){
  const g = G();
  const inGame = new Set();
  g.rounds.forEach(r => r.q.forEach(q => inGame.add(q.id)));
  g.mini.qs.forEach(q => inGame.add(q.id));
  (g.sdUsed || []).forEach(id => inGame.add(id));
  const themes = g.cfg.themes || [];
  const free = (q) => q.type === 'standard' && !inGame.has(q.id);
  let pool = S.bank.filter(q => free(q) && themes.indexOf(q.theme) > -1 && isFresh(q));
  if(!pool.length) pool = S.bank.filter(q => free(q) && themes.indexOf(q.theme) > -1);
  if(!pool.length) pool = S.bank.filter(q => free(q) && isFresh(q));
  if(!pool.length) pool = S.bank.filter(free);
  return pool;
}
function startSudden(newLeg){
  const g = G();
  const pool = suddenPool();
  if(!pool.length){
    if(newLeg === false) return toast('No spare questions left to swap in.');
    g.winner = null; finalize(); return;
  }
  const q = shuffle(pool)[0];
  g.sdUsed = (g.sdUsed || []).concat([q.id]);
  if(newLeg !== false) g.sdRounds = (g.sdRounds || 0) + 1;
  const offTheme = (g.cfg.themes || []).indexOf(q.theme) < 0;
  g.sd = { q, n:g.sdRounds, shown:false, offTheme };
  markUsed(q);
  if(offTheme) toast('Tonight themes are out of spare questions — pulling from ' + q.theme + '.', 4200);
  go('sudden');
}
function finalize(){
  const g = G();
  const rec = {
    id:g.id, date:g.startedAt, rounds:g.rounds.length,
    difficulty:g.cfg.difficulty, themes:g.rounds.map(r => r.theme).filter((v, i, a) => a.indexOf(v) === i),
    teams:g.teams.map(t => ({ name:t.name, captain:t.captain, players:t.players, score:t.score })),
    winner:g.winner,
    mini:{ wins:g.mini.wins, award:g.mini.award || [0, 0] },
    battle:g.battle && g.battle.done ? { score:g.battle.score, award:g.battle.award, tb:g.battle.tbRounds } : null,
    sudden:g.sdRounds || 0
  };
  if(!S.history.some(h => h.id === rec.id)){ S.history.push(rec); saveHistory(); }
  go('final');
}

/* ==========================================================================
   24. ACTIONS
   ========================================================================== */
const ACT = {
  go(e){ Snd.soft(); if(e.dataset.to === 'setup' && !S.setup) S.setup = defaultSetup(); nav(e.dataset.to); },

  /* ---- setup ---- */
  tf(e){ S.setup['team' + e.dataset.side.toUpperCase()][e.dataset.k] = e.value; },
  rounds(e){ S.setup.rounds = +e.dataset.n; syncThemes(); prunePicks(); render(); },
  diff(e){ S.setup.difficulty = e.dataset.d; prunePicks(); render(); },
  theme(e){
    const c = S.setup, t = e.dataset.t, i = c.themes.indexOf(t);
    if(i > -1){ c.themes.splice(i, 1); delete (c.picks || {})[t]; }
    else {
      if(c.themes.length >= c.rounds){
        toast('That is ' + c.rounds + ' themes already — one per round. Drop one first, or add a round.', 3600);
        return;
      }
      c.themes.push(t);
    }
    render();
  },
  themeNone(){ S.setup.themes = []; S.setup.picks = {}; render(); },

  /* ---- hand-picked questions ---- */
  pickOpen(){ prunePicks(); S.tmp.pickFilter = ''; openPicker(); },
  pickFilter(e){ S.tmp.pickFilter = e.dataset.t || ''; repaintPicker(); },
  pickToggle(e){
    const t = e.dataset.t, id = e.dataset.id;
    const p = S.setup.picks = S.setup.picks || {};
    const arr = p[t] = p[t] || [];
    const i = arr.indexOf(id);
    if(i > -1) arr.splice(i, 1);
    else if(arr.length >= 2) return toast('Two per theme — one question for each team. Untick one first.', 3200);
    else arr.push(id);
    if(!arr.length) delete p[t];
    Snd.soft();
    repaintPicker();
  },
  pickThemeClear(e){ delete (S.setup.picks || {})[e.dataset.t]; repaintPicker(); },
  pickClearAll(){ S.setup.picks = {}; repaintPicker(); },
  pickClear(){ S.setup.picks = {}; render(); },
  pickDone(){ closeModal(); },
  setNum(e){ S.settings[e.dataset.k] = +e.value; saveSettings(); },
  toggle(e){ const k = e.dataset.k; S.settings[k] = !S.settings[k]; saveSettings(); render(); },
  vol(e){ S.settings.volume = (+e.value) / 100; saveSettings(); Snd.resume(); Snd.vol(S.settings.volume); Snd.soft(); },
  testAlarm(){ Snd.resume(); Snd.alarm(); },
  replayJingle(){ Snd.jingle(); },

  startGame(){
    const c = S.setup;
    if(!c.themes.length) return toast('Pick at least one theme.');
    c.teamA.name = (c.teamA.name || '').trim() || 'Team A';
    c.teamB.name = (c.teamB.name || '').trim() || 'Team B';
    const g = buildGame(c);
    if(g.rounds.length < c.rounds) toast('Only enough questions for ' + g.rounds.length + ' rounds — shortened.', 4500);
    if(!g.rounds.length) return toast('No usable questions. Widen the themes or difficulty.');
    S.game = g;
    g.rounds.forEach(r => r.q.forEach(markUsed));
    g.mini.qs.forEach(markUsed);
    Snd.resume();
    go('roundIntro');
  },

  /* ---- round ---- */
  armDbl(e){
    const i = +e.dataset.i, g = G(), rd = curRound();
    if(!g.teams[i].ll.dbl) return;
    rd.dbl[i] = !rd.dbl[i];
    Snd.soft();
    render();
  },
  beginRound(){
    const g = G(), rd = curRound();
    [0, 1].forEach(i => { if(rd.dbl[i]) g.teams[i].ll.dbl = false; });
    beginRound();
  },
  timerToggle(){ Timer.toggle(); },
  timerAdd(e){ Timer.add(+e.dataset.s); },
  timerSkip(){ Timer.stop(); go(S.screen === 'steal' ? 'stealReveal' : S.screen === 'miniQ' ? 'miniEntry' : 'reveal'); },

  /* Walk the theme in bank order, one question per press, and do not offer the
     same one twice until the whole theme has been through.

     Two things used to break this. The pairing ticker was honoured, which left
     a pool of one or two; and the pool was recomputed from the live rounds each
     press, so the question you had just swapped AWAY from was instantly a
     candidate again. Between them the button ping-ponged over the same pair
     forever. The ticker is ignored here on purpose — it exists to match the two
     teams' questions when the round is built, and once the host is overriding
     by hand it is only getting in the way. */
  swapQ(){
    const g = G(), rd = curRound(), seat = g.seat;

    /* committed elsewhere: the other team's question this round, every other
       round, and the mini-game. The current slot is deliberately NOT excluded,
       so it can come back round at the end of the cycle. */
    const elsewhere = new Set();
    g.rounds.forEach((r, ri) => r.q.forEach((q, si) => { if(ri !== g.r || si !== seat) elsewhere.add(q.id); }));
    g.mini.qs.forEach(q => elsewhere.add(q.id));

    const list = S.bank.filter(q =>
      q.type === 'standard' && q.theme === rd.theme &&
      matchDiff(q, g.cfg.difficulty) && !elsewhere.has(q.id));

    const none = () => toast('No other question left in ' + rd.theme + ' at this difficulty.', 4000);
    if(list.length < 2) return none();

    /* One list for the whole round, not one per team: a question the host has
       already skipped past on Team A should not come back on Team B either. */
    const cur = rd.q[seat];
    const seen = rd.swapSeen = rd.swapSeen || [];
    if(seen.indexOf(cur.id) < 0) seen.push(cur.id);

    let next = list.filter(q => seen.indexOf(q.id) < 0)[0];
    if(!next){                                    // whole theme exhausted — start again
      seen.length = 0; seen.push(cur.id);
      next = list.filter(q => q.id !== cur.id)[0];
    }
    if(!next) return none();

    seen.push(next.id);
    rd.q[seat] = next; markUsed(next);
    rd.strict = false;
    rd.picked = false;                 // no longer the pair the host chose by hand
    toast('New question.');
    go('ask');
  },

  useLL(e){
    const key = e.dataset.k, i = +e.dataset.i, g = G(), rd = curRound(), t = g.teams[i];
    if(!t.ll[key]) return;
    if(rd.dbl[i] && rd.llUsed[i].length >= 1) return toast('Double points is armed — one extra lifeline only.');
    S.tmp.llModal = true;
    if(key === 'friend'){
      Timer.pause();
      openModal(
        '<div class="center stack">' +
          '<div class="eyebrow gold">Lifeline</div><h3 class="display">Call a Friend</h3>' +
          '<div class="warnbox" style="text-align:left">Before the captain says a word, <strong>you</strong> speak to the friend:<br>' +
          '&ldquo;Hi — quick quiz question. No ChatGPT, no Google, no asking anyone else. Straight off the top of your head. Ready?&rdquo;</div>' +
          '<div class="card tight" style="text-align:left">' +
            '<div class="eyebrow gold">The question</div>' +
            '<p style="margin-top:8px;font-size:19px;font-weight:700;line-height:1.35">' + esc(rd.q[G().seat].question) + '</p>' +
          '</div>' +
          '<div class="cd-num" id="cdNum">' + S.settings.tFriend + '</div>' +
          '<div class="eyebrow">seconds on the call</div>' +
          '<div class="btn-row center">' +
            '<button class="btn sm" data-act="cdToggle">Pause</button>' +
            '<button class="btn sm ghost" data-act="cdAdd" data-s="10">+10s</button>' +
          '</div>' +
          '<div class="btn-row center"><button class="btn gold" data-act="closeLL">Done — back to the question</button></div>' +
        '</div>');
      CD.start(S.settings.tFriend, 'cdNum');
    } else {
      Timer.pause();
      openModal(
        '<div class="center stack">' +
          '<div class="eyebrow gold">Lifeline</div><h3 class="display">Double Dip</h3>' +
          '<p class="muted" style="max-width:44ch;margin:0 auto">The captain gets <strong>two</strong> goes at this one. First answer right? Still counts — and the lifeline is gone either way.</p>' +
          '<div class="btn-row center"><button class="btn gold" data-act="closeLL">Back to the question</button></div>' +
        '</div>');
    }
    t.ll[key] = false;
    rd.llUsed[i].push(key);
    toast(t.name + ' used ' + LL[key].name + '.');
  },
  cdToggle(){ CD.toggle(); },
  cdAdd(e){ CD.add(+e.dataset.s); },
  closeLL(){ CD.stop(); S.tmp.llModal = false; closeModal(); render(); Timer.resumeT(); },

  toReveal(){ Timer.stop(); go('reveal'); },
  judge(e){
    const v = e.dataset.v === '1', g = G(), rd = curRound(), ti = curTeam();
    rd.res[g.seat] = { correct:v, stolen:false };
    if(v){
      const p = pointValue(rd, ti);
      rd.pts[ti] += p; award(ti, p);
      go('answer');
    } else { Snd.wrong(); go('steal'); }
  },
  afterAnswer(){ afterSeat(); },
  toStealReveal(){ Timer.stop(); go('stealReveal'); },
  judgeSteal(e){
    const v = e.dataset.v === '1', g = G(), rd = curRound(), owner = curTeam(), th = otherTeam(owner);
    rd.res[g.seat].stolen = v;
    if(v){ const p = pointValue(rd, owner); rd.pts[th] += p; award(th, p, 'steal'); }
    else Snd.wrong();
    go('answer');
  },
  nextRound(){ nextRound(); },

  /* ---- mini ---- */
  miniStart(){ G().mini.i = 0; go('miniQ'); },
  /* Same escape hatch as "Swap this question" in a standard round: if the
     number doesn't suit the room, pull another. Prefers a theme this
     mini-game has not already used, to protect the one-per-theme spread. */
  miniSwap(){
    const g = G(), m = g.mini;
    const inPlay = new Set();
    g.rounds.forEach(r => r.q.forEach(q => inPlay.add(q.id)));
    m.qs.forEach(q => inPlay.add(q.id));
    (m.spare || []).forEach(q => inPlay.add(q.id));

    let pool = S.bank.filter(q => q.type === 'closest' && !inPlay.has(q.id) && isFresh(q));
    if(!pool.length) pool = S.bank.filter(q => q.type === 'closest' && !inPlay.has(q.id));
    if(!pool.length) return toast('No spare Closest To Wins question left in the bank.');

    const spent = new Set(m.qs.filter((q, i) => i !== m.i).map(q => q.theme));
    const offTheme = pool.filter(q => !spent.has(q.theme));
    const q = shuffle(offTheme.length ? offTheme : pool)[0];

    m.qs[m.i] = q; markUsed(q);
    toast('New number question — ' + q.theme + '.');
    go('miniQ');
  },
  toMiniEntry(){ Timer.stop(); go('miniEntry'); },
  calc(){
    const g = G(), m = g.mini, q = m.qs[m.i];
    const a = numFrom(el('gA').value), b = numFrom(el('gB').value);
    const out = el('calcOut');
    if(a == null || b == null){ out.innerHTML = 'Enter both to compare'; return; }
    const ans = Number(q.answer);
    const da = Math.abs(a - ans), db = Math.abs(b - ans);
    const w = da === db ? 'tie' : (da < db ? 0 : 1);
    out.innerHTML =
      '<div><div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)">Off by</div>' +
      '<div style="margin-top:6px"><span style="color:var(--a);font-weight:700">' + nf(Math.round(da)) + '</span>' +
      '<span class="dim"> vs </span><span style="color:var(--b);font-weight:700">' + nf(Math.round(db)) + '</span></div>' +
      '<div style="margin-top:8px">' + (w === 'tie' ? '<span class="badge line">Tie</span>' :
        '<span class="badge ' + (w === 0 ? 'a' : 'b') + '">' + esc(g.teams[w].name) + ' is closer</span>') + '</div></div>';
  },
  miniWin(e){
    const g = G(), m = g.mini, q = m.qs[m.i];
    const w = e.dataset.w === 'tie' ? 'tie' : +e.dataset.w;
    const a = el('gA') ? numFrom(el('gA').value) : null;
    const b = el('gB') ? numFrom(el('gB').value) : null;
    if(a != null && b != null){
      const ans = Number(q.answer);
      m.delta[0] += Math.abs(a - ans); m.delta[1] += Math.abs(b - ans);
      m.counted = true;
    }
    m.subs.push({ q, gA:a, gB:b, winner:w });
    if(w === 'tie'){ m.wins[0]++; m.wins[1]++; toast('Tie — a point each.'); }
    else { m.wins[w]++; Snd.correct(); toast(g.teams[w].name + ' takes leg ' + (m.i + 1) + '.'); }
    m.i++;
    if(m.i < m.qs.length) go('miniQ'); else miniFinish();
  },
  miniAward(e){ awardMini(e.dataset.w === 'split' ? 'split' : +e.dataset.w); render(); },
  afterMini(){
    const g = G();
    if(g.mini.verdict && g.mini.verdict.needsHost) return toast('Award the mini-game points first.');
    g.miniPlayed = true;
    advanceRound();
  },

  /* ---- battle of the captains ---- */
  battleYes(){
    closeModal();
    const g = G();
    g.battleOffered = true;
    g.battle = buildBattle();
    if(!g.battle){ toast('Not enough spare questions left for the Battle.'); endGame(); return; }
    go('battleIntro');
  },
  battleNo(){ closeModal(); G().battleOffered = true; endGame(); },
  /* used by both the intro and the handoff — cap and i are already set */
  battleStart(){ const b = G().battle; b.shown = false; go('battleQ'); },
  battleShow(){ Timer.stop(); G().battle.shown = true; render(); },
  /* Same escape hatch as a standard round: if the question doesn't suit the
     room, pull another at the same difficulty so the shape survives. The one
     dropped is remembered, so pressing it twice can't hand back the first. */
  battleSwap(){
    const b = G().battle, cur = b.qs[b.cap][b.i];
    let pool = battlePool(cur.difficulty);
    if(!pool.length) pool = battlePool();
    if(!pool.length) return toast('No spare question left in the bank.');
    b.dropped.push(cur.id);
    b.qs[b.cap][b.i] = shuffle(pool)[0];
    toast('New question.');
    go('battleQ');
  },
  battleMark(e){
    const b = G().battle, q = b.qs[b.cap][b.i], got = e.dataset.v === '1';
    b.log[b.cap][b.i] = { q, got };
    if(got){ b.score[b.cap]++; Snd.correct(); } else Snd.wrong();
    markUsed(q);
    b.shown = false;
    b.i++;
    if(b.i < b.n){ go('battleQ'); return; }
    if(b.cap === 0){ b.cap = 1; b.i = 0; go('battleHandoff'); return; }
    battleFinish();
  },
  battleTbShow(){ G().battle.tb.shown = true; render(); },
  battleTbSwap(){ battleTieBreak(false); },
  battleTbWin(e){
    const b = G().battle;
    if(e.dataset.w === 'none'){ battleTieBreak(); return; }
    b.winner = +e.dataset.w;
    battleAward();
  },
  /* the Battle's 2 points can create a tie as easily as break one — 10-8 with
     the trailing captain winning is 10-10 — so hand back to the normal ending,
     which sends a level game to sudden death exactly as it always did */
  battleDone(){ endGame(); },

  /* ---- sudden death ---- */
  sdShow(){ G().sd.shown = true; render(); },
  sdSwap(){ startSudden(false); },
  sdWin(e){
    const g = G();
    if(e.dataset.w === 'none'){ startSudden(); return; }
    const w = +e.dataset.w;
    g.teams[w].score += 1;
    g.winner = w;
    finalize();
  },

  /* the colophon reveals on tap. A phone has no hover, and iOS fires :active
     too unreliably to hang it on, so it goes through the same click handler as
     everything else in the app. */
  colophon(t){ t.classList.toggle('lit'); },

  /* ---- misc ---- */
  quit(){
    openModal('<div class="center stack"><h3 class="display">Leave the game?</h3>' +
      '<p class="muted">Scores are not saved unless the game finishes.</p>' +
      '<div class="btn-row center"><button class="btn ghost" data-act="closeModal">Keep playing</button>' +
      '<button class="btn danger" data-act="quitYes">Leave</button></div></div>');
  },
  quitYes(){ closeModal(); Timer.stop(); S.game = null; S.screen = 'home'; render(); },
  closeModal(){ closeModal(); },
  newGame(){ S.game = null; S.setup = defaultSetup(); S.screen = 'setup'; render(); },
  exportResult(){
    const g = G();
    const lines = ['QUIZ ME BABY — ' + new Date(g.startedAt).toLocaleString(), '',
      g.teams[0].name + ': ' + g.teams[0].score, g.teams[1].name + ': ' + g.teams[1].score, '',
      g.winner == null ? 'Result: draw' : 'Winner: ' + g.teams[g.winner].name, ''];
    g.rounds.filter(r => r.done).forEach(r => {
      lines.push('Round ' + r.n + ' — ' + r.theme + '  (' + r.pts[0] + ' / ' + r.pts[1] + ')');
      r.q.forEach((q, i) => lines.push('   Q' + (i + 1) + ': ' + q.question + '  →  ' + q.answer));
    });
    lines.push('', 'Closest to wins: ' + g.mini.wins[0] + ' — ' + g.mini.wins[1] + '  (points ' + (g.mini.award || [0, 0]).join(' / ') + ')');
    download('quiz-me-baby-' + new Date(g.startedAt).toISOString().slice(0, 10) + '.txt', lines.join('\n'));
  },

  /* ---- bank ---- */
  bf(e){ S.tmp.bankFilter[e.dataset.k] = e.value; render(); },
  qDel(e){
    const id = e.dataset.id;
    const q = S.bank.find(x => x.id === id);
    /* remember deleted built-ins so a future version of this file does not bring them back */
    if(q && q.src === 'seed'){
      const killed = DB.get(DB.k.killed, []);
      if(killed.indexOf(id) < 0){ killed.push(id); DB.set(DB.k.killed, killed); }
    }
    S.bank = S.bank.filter(x => x.id !== id);
    saveBank(); render();
  },
  qAdd(){
    openModal('<div class="stack"><h3 class="display">Add a question</h3>' +
      '<label class="fld">Question<textarea id="nq" rows="2"></textarea></label>' +
      '<label class="fld">Answer<input type="text" id="na"></label>' +
      '<label class="fld">Notes (shown with the answer)<input type="text" id="nn"></label>' +
      '<div class="grid2">' +
        '<label class="fld">Theme<select id="nt">' + THEMES.map(t => '<option>' + esc(t) + '</option>').join('') + '</select></label>' +
        '<label class="fld">Difficulty<select id="nd">' + DIFFS.map(d => '<option' + (d === 'medium' ? ' selected' : '') + '>' + d + '</option>').join('') + '</select></label>' +
        '<label class="fld">Type<select id="ny"><option value="standard">Standard</option><option value="closest">Closest to wins</option></select></label>' +
        '<label class="fld">Pair ticker<input type="text" id="nu" placeholder="e.g. capital-of"></label>' +
      '</div>' +
      '<div class="btn-row end"><button class="btn ghost" data-act="closeModal">Cancel</button>' +
      '<button class="btn gold" data-act="qSave">Add it</button></div></div>');
  },
  qSave(){
    const q = el('nq').value.trim(), a = el('na').value.trim();
    if(!q || !a) return toast('Question and answer are both required.');
    S.bank.push({ id:hash(q), question:q, answer:a, notes:el('nn').value.trim(),
      theme:el('nt').value, difficulty:el('nd').value, type:el('ny').value,
      use_with:el('nu').value.trim(), src:'manual' });
    saveBank(); closeModal(); toast('Added.'); render();
  },
  bankTemplate(){
    const sample = [
      ['question','answer','notes','theme','type','difficulty','use_question_with'],
      ['What is the capital of Australia?','Canberra','Not Sydney.','Geography','standard','easy','capital-of'],
      ['What is the capital of Canada?','Ottawa','Not Toronto.','Geography','standard','easy','capital-of'],
      ['Population of Indonesia','277500000','Roughly 277.5 million (2023).','Geography','closest','medium','']
    ];
    download('quiz-me-baby-template.csv', sample.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
  },
  bankExport(){ download('quiz-me-baby-bank.csv', bankToCSV(S.bank), 'text/csv'); },
  bankReset(){
    openModal('<div class="center stack"><h3 class="display">Restore the starter bank?</h3>' +
      '<p class="muted">This replaces everything in the bank, including anything you imported.</p>' +
      '<div class="btn-row center"><button class="btn ghost" data-act="closeModal">Cancel</button>' +
      '<button class="btn danger" data-act="bankResetYes">Replace it</button></div></div>');
  },
  bankResetYes(){
    S.bank = buildSeedBank();
    DB.set(DB.k.killed, []);            // un-delete built-ins too
    DB.set(DB.k.seedv, SEED_VERSION);
    saveBank(); closeModal(); toast('Starter bank restored — ' + S.bank.length + ' questions.'); render();
  },

  /* ---- history / data ---- */
  histDel(e){ S.history = S.history.filter(h => h.id !== e.dataset.id); saveHistory(); render(); },
  histClear(){
    openModal('<div class="center stack"><h3 class="display">Delete all history?</h3>' +
      '<div class="btn-row center"><button class="btn ghost" data-act="closeModal">Cancel</button>' +
      '<button class="btn danger" data-act="histClearYes">Delete everything</button></div></div>');
  },
  histClearYes(){ S.history = []; saveHistory(); closeModal(); render(); },
  histExport(){ download('quiz-me-baby-history.json', JSON.stringify(S.history, null, 2), 'application/json'); },
  resetUsed(){ S.used = new Set(); saveUsed(); toast('Played-question memory cleared.'); render(); },
  exportAll(){
    download('quiz-me-baby-backup.json', JSON.stringify({
      v:1, exported:new Date().toISOString(),
      bank:S.bank, history:S.history, used:[...S.used], settings:S.settings
    }, null, 2), 'application/json');
  }
};

function numFrom(v){
  if(v == null) return null;
  const s = String(v).replace(/[\s,'_]/g, '').replace(/[^0-9.\-]/g, '');
  if(!s || isNaN(Number(s))) return null;
  return Number(s);
}

/* ==========================================================================
   25. EVENT WIRING
   ========================================================================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
  const fn = ACT[t.dataset.act];
  if(fn){ e.preventDefault(); Snd.resume(); fn(t); }
});
document.addEventListener('input', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const fn = ACT[t.dataset.act];
  if(fn && ['tf','setNum','vol','bf','calc'].indexOf(t.dataset.act) > -1) fn(t);
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  if(['setNum','bf'].indexOf(t.dataset.act) > -1) ACT[t.dataset.act](t);
});
el('modal').addEventListener('click', e => {
  if(e.target.id !== 'modal') return;
  if(S.tmp.llModal) ACT.closeLL();   // a lifeline modal — put the clock back
  else closeModal();
});

document.addEventListener('keydown', e => {
  if(['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName) > -1) return;
  const k = e.key.toLowerCase();
  if(k === 'escape'){ if(S.tmp.llModal) ACT.closeLL(); else closeModal(); return; }
  if(S.screen === 'reveal'){
    if(k === 'y'){ e.preventDefault(); ACT.judge({ dataset:{ v:'1' } }); }
    if(k === 'n'){ e.preventDefault(); ACT.judge({ dataset:{ v:'0' } }); }
  }
  if(S.screen === 'stealReveal'){
    if(k === 'y'){ e.preventDefault(); ACT.judgeSteal({ dataset:{ v:'1' } }); }
    if(k === 'n'){ e.preventDefault(); ACT.judgeSteal({ dataset:{ v:'0' } }); }
  }
  /* seven seconds is no time to be hunting for a button — Y/N works here too */
  if(S.screen === 'battleQ' && S.game && S.game.battle.shown){
    if(k === 'y'){ e.preventDefault(); ACT.battleMark({ dataset:{ v:'1' } }); }
    if(k === 'n'){ e.preventDefault(); ACT.battleMark({ dataset:{ v:'0' } }); }
  }
  if(k === ' ' && (S.screen === 'ask' || S.screen === 'steal' || S.screen === 'miniQ' || S.screen === 'battleQ')){ e.preventDefault(); Timer.toggle(); }
  if(k === 'enter'){
    const main = $('.btn.gold.lg') || $('.btn.gold');
    if(main){ e.preventDefault(); main.click(); }
  }
});

window.addEventListener('beforeunload', e => {
  if(S.game && S.screen !== 'final'){ e.preventDefault(); e.returnValue = ''; }
});

/* iOS Safari ignores user-scalable=no and honours touch-action only patchily,
   but it does fire these three and it does respect preventDefault on them.
   This is the belt to the stylesheet's braces. No other browser fires them,
   and a mouse never can, so a laptop is unaffected. */
['gesturestart','gesturechange','gestureend'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault(), { passive:false }));

/* ==========================================================================
   26. BOOT
   ========================================================================== */
/* The house defaults for sound moved — jingles on, 75%. Apply them once to a
   browser that is carrying settings saved under the old defaults, then never
   touch the host's choices again. */
if(!DB.get('qn.audiodefaults.v2', false)){
  S.settings.sound = true;
  S.settings.volume = 0.75;
  saveSettings();
  DB.set('qn.audiodefaults.v2', true);
}

render();
if(S.tmp.seedNews) setTimeout(() => toast(S.tmp.seedNews + ' new built-in questions added to your bank.', 5000), 900);

/* The theme plays ONCE, when the app is opened — not every time you land back
   on the home screen from Settings or from a finished game. No button, by
   design: it is the sound of the app starting up.
   Browsers refuse to make noise before the visitor has interacted with the
   page, so if the audio context is still suspended we wait for the first click
   or key press and play it then. */
(function openingTheme(){
  let played = false;
  const play = () => { if(played) return; played = true; Snd.jingle(); };
  Snd.init();
  if(Snd.ctx && Snd.ctx.state === 'running'){ play(); return; }
  const arm = () => {
    window.removeEventListener('pointerdown', arm, true);
    window.removeEventListener('keydown', arm, true);
    Snd.resume();
    setTimeout(play, 0);      // let the click that unlocked audio finish first
  };
  window.addEventListener('pointerdown', arm, true);
  window.addEventListener('keydown', arm, true);
})();
</script>
</body>
