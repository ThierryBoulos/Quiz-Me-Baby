# Keeps the game server awake and tells the owner if it isn't.
# Every 30 minutes GitHub calls the live site's health check; the check reads one
# row from the Supabase database (a Free project pauses after a quiet week).
# If it fails, the run goes red and GitHub emails the repo owner.
name: Keep awake
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Health check
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 20 https://quiz-me-baby-eta.vercel.app/api/health; then exit 0; fi
            sleep 20
          done
          echo "The game server didn't answer 3 times in a row."; exit 1
